[versions]
java = "21"
jackson = "2.21.7"
junit = "5.14.2"
quarkus = "3.40.1"
json-schema = "1.5.9"
bouncycastle = "1.86"
sqlite = "3.53.4.0"
guava = "33.7.2-jre"

[libraries]
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version = "2.21" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.14.2" }
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
json-schema = { module = "com.networknt:json-schema-validator", version.ref = "json-schema" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }

[plugins]
quarkus = { id = "io.quarkus", version.ref = "quarkus" }

# Add third-party library versions here as implementation modules are introduced.
# Keep shared dependency versions centralized rather than duplicating them in subprojects.
