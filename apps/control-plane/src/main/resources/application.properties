quarkus.http.host=0.0.0.0
quarkus.http.port=8082
quarkus.http.auth.proactive=false
# Package uploads may reach 64 MiB; BodyLimit keeps every other request at 2 MiB.
quarkus.http.limits.max-body-size=65M
quarkus.http.limits.max-header-size=16K
quarkus.http.idle-timeout=30s
quarkus.http.read-timeout=10s
quarkus.http.access-log.enabled=false
quarkus.http.proxy.proxy-address-forwarding=false
quarkus.security.jaxrs.deny-unannotated-endpoints=true
quarkus.management.enabled=true
quarkus.management.host=0.0.0.0
quarkus.management.port=9092
quarkus.smallrye-openapi.management.enabled=false
quarkus.swagger-ui.enabled=false
mp.openapi.scan.disable=true
quarkus.shutdown.timeout=20s
quarkus.log.console.json.enabled=true
quarkus.log.console.json.exception-output-type=formatted
quarkus.otel.traces.exporter=cdi
quarkus.otel.metrics.enabled=false
quarkus.otel.logs.enabled=false
quarkus.otel.service.name=olo-toolgate-control
quarkus.micrometer.binder.http-server.ignore-patterns=/q/.*
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=16
quarkus.datasource.jdbc.acquisition-timeout=3s
quarkus.datasource.jdbc.login-timeout=2s
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=5
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=10
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-at-start=false
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.clean-disabled=true
quarkus.flyway.baseline-on-migrate=false
mp.jwt.verify.publickey.algorithm=RS256
mp.jwt.verify.clock.skew=0
mp.jwt.verify.token.age=900
smallrye.jwt.time-to-live=900
smallrye.jwt.required.claims=exp,iat,sub,tenant_id
smallrye.jwt.verify.relax-key-validation=false
smallrye.jwt.require.named-principal=true
toolgate.control.max-records=512
# Optional shared directory acceleration; authority always requires a current database version.
toolgate.control.cache.mode=${TOOLGATE_CONTROL_CACHE_MODE:local}
toolgate.control.cache.host=${TOOLGATE_CONTROL_CACHE_HOST:}
toolgate.control.cache.port=${TOOLGATE_CONTROL_CACHE_PORT:6379}
toolgate.control.cache.tls=${TOOLGATE_CONTROL_CACHE_TLS:true}
toolgate.control.cache.username=${TOOLGATE_CONTROL_CACHE_USERNAME:default}
toolgate.control.cache.namespace=${TOOLGATE_CONTROL_CACHE_NAMESPACE:}
toolgate.control.cache.password-path=${TOOLGATE_CONTROL_CACHE_PASSWORD_PATH:}
toolgate.control.cache.encryption-key-path=${TOOLGATE_CONTROL_CACHE_ENCRYPTION_KEY_PATH:}
toolgate.control.cache.ca-path=${TOOLGATE_CONTROL_CACHE_CA_PATH:}
toolgate.control.cache.timeout-ms=${TOOLGATE_CONTROL_CACHE_TIMEOUT_MS:500}
toolgate.control.cache.ttl-seconds=${TOOLGATE_CONTROL_CACHE_TTL_SECONDS:3600}
toolgate.control.default-team-id=${TOOLGATE_DEFAULT_TEAM_ID:team-default}
toolgate.control.default-policy-ids=${TOOLGATE_DEFAULT_POLICY_IDS:}
toolgate.control.max-config-bytes=1048576
toolgate.control.development-mode=false
toolgate.control.trace-export-enabled=false
toolgate.control.bundle.enabled=false
toolgate.control.bundle.issuer=control
toolgate.control.bundle.audience=gateway
toolgate.control.approval.enabled=false
toolgate.control.approval.pending-ttl-ms=300000
toolgate.control.approval.max-active=1000
toolgate.control.approval.max-active-permits=4096
toolgate.control.endpoint.enabled=false
# Env-owned Phase A client check-in (platform-requirements.md §17.2). Unset values use the enterprise defaults:
# 2000 ms, 20 % jitter, offline after max(120000, 6 x check-in).
toolgate.control.client-check-in.check-in-ms=${TOOLGATE_CONTROL_CLIENT_CHECKIN_MS:}
toolgate.control.client-check-in.jitter-pct=${TOOLGATE_CONTROL_CLIENT_CHECKIN_JITTER_PCT:}
toolgate.control.client-check-in.offline-after-ms=${TOOLGATE_CONTROL_CLIENT_OFFLINE_AFTER_MS:}
quarkus.http.ssl.client-auth=request

toolgate.control.fleet.enabled=false
toolgate.control.builder.enabled=false
toolgate.control.builder.java-executable=/opt/java/openjdk/bin/java
toolgate.control.builder.sdk-libraries=/opt/toolgate/json-sdk/lib
toolgate.control.builder.cli-executable=/usr/local/bin/toolgate
toolgate.control.builder.data-directory=/data/builder
toolgate.control.core-packages.lock-path=${TOOLGATE_CONTROL_CORE_PACKAGES_LOCK_PATH:}
toolgate.control.profile.path=${TOOLGATE_CONTROL_PROFILE_PATH:}
# Client-tool images (ADR 026): the registry Control pushes to, and the approved JRE base mirrored there, by digest.
toolgate.control.client-images.enabled=${TOOLGATE_CONTROL_CLIENT_IMAGES_ENABLED:false}
toolgate.control.client-images.registry-url=${TOOLGATE_CONTROL_CLIENT_IMAGES_REGISTRY_URL:}
toolgate.control.client-images.repository=${TOOLGATE_CONTROL_CLIENT_IMAGES_REPOSITORY:}
toolgate.control.client-images.base=${TOOLGATE_CONTROL_CLIENT_IMAGES_BASE:}
toolgate.control.client-images.python-base=${TOOLGATE_CONTROL_CLIENT_IMAGES_PYTHON_BASE:}
toolgate.control.client-images.credentials-path=${TOOLGATE_CONTROL_CLIENT_IMAGES_CREDENTIALS_PATH:}
toolgate.control.client-images.ca-path=${TOOLGATE_CONTROL_CLIENT_IMAGES_CA_PATH:}
toolgate.control.client-images.platforms=${TOOLGATE_CONTROL_CLIENT_IMAGES_PLATFORMS:LINUX}
toolgate.control.client-images.minimum-client-version=${TOOLGATE_CONTROL_CLIENT_IMAGES_MINIMUM_CLIENT_VERSION:}
toolgate.control.package-release.private-key-path=${TOOLGATE_CONTROL_PACKAGE_RELEASE_PRIVATE_KEY_PATH:}
toolgate.control.package-release.key-id=${TOOLGATE_CONTROL_PACKAGE_RELEASE_KEY_ID:}

# OLO Orgs Marketplace (olo-marketplace repository, docs/api.md §4). Environment-owned: a configuration import can't change them.
toolgate.control.marketplace.enabled=${TOOLGATE_CONTROL_MARKETPLACE_ENABLED:false}
toolgate.control.marketplace.id=${TOOLGATE_CONTROL_MARKETPLACE_ID:}
toolgate.control.marketplace.base-url=${TOOLGATE_CONTROL_MARKETPLACE_BASE_URL:}
toolgate.control.marketplace.keys=${TOOLGATE_CONTROL_MARKETPLACE_KEYS:}
toolgate.control.marketplace.ca-path=${TOOLGATE_CONTROL_MARKETPLACE_CA_PATH:}

# Quickstart alone uses the checksummed SQLite adapter; production retains PostgreSQL.
%quickstart.quarkus.datasource.health.enabled=false

# Group authority is online. Effect signing uses a third dedicated key domain.
toolgate.control.effect.enabled=false
toolgate.control.effect.issuer=control
toolgate.control.effect.audience=toolgate-client
