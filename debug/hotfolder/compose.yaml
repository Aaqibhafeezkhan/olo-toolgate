# Applied after the LangChain base and signed trigger profile overlays.
services:
  quickstart:
    image: olo-toolgate-hotfolder-quickstart:local
    environment:
      TOOLGATE_CONTROL_PROFILE_PATH: ""
      TOOLGATE_TRIGGERS_CONTROL_CORE_ENABLED: "true"
  linux-device:
    image: olo-toolgate-hotfolder-device:local
    build:
      context: ${TOOLGATE_HOTFOLDER_ROOT:?use bringup.py}
      dockerfile: debug/hotfolder/device.Dockerfile
    volumes:
      - type: bind
        source: ${TOOLGATE_HOTFOLDER_FILES:?use bringup.py}
        target: /var/lib/olo-toolgate/hotfolder
        bind:
          create_host_path: false
