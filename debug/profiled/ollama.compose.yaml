# Optional local model companions; the three ToolGate core services stay separate.
services:
  ollama:
    image: ollama/ollama:latest
    gpus: all
    environment:
      OLLAMA_SCHED_SPREAD: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    volumes:
      - models:/root/.ollama
    networks: [installation]
    restart: unless-stopped
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
  ollama-tls:
    image: nginx:stable-alpine
    user: "65532:65532"
    entrypoint: [nginx, -g, "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    volumes:
      - ./ollama-nginx.conf:/etc/nginx/nginx.conf:ro
      - type: volume
        source: custody
        target: /custody/ollama
        read_only: true
        volume:
          subpath: ollama
    networks:
      installation:
        aliases: [ollama-provider]
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
volumes:
  models:
    name: ${TOOLGATE_PROFILED_OLLAMA_STORAGE:?Select this installation's model storage}
    labels:
      io.ololabs.toolgate.profiled-root: ${TOOLGATE_PROFILED_ROOT:?Select this checkout}
      io.ololabs.toolgate.profiled-format: "2"
  custody:
    external: true
    name: ${TOOLGATE_PROFILED_CUSTODY:?Select this installation's custody}
networks:
  installation:
    external: true
    name: toolgate-profiled_default
