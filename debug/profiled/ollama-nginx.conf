pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 9443 ssl;
    server_name ollama-provider;
    ssl_certificate /custody/ollama/server.crt;
    ssl_certificate_key /custody/ollama/server.key;
    client_max_body_size 128k;
    location = /v1/chat/completions {
      include /custody/ollama/authorization.conf;
      proxy_pass http://ollama:11434/v1/chat/completions;
      proxy_next_upstream off;
      proxy_set_header Host ollama;
      proxy_set_header Authorization "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
    }
    location / { return 404; }
  }
}
