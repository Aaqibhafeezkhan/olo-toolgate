services:
  collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: [--config=/etc/otelcol/config.json]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: [../credentials/monitoring.env]
    volumes: [../credentials/collector.json:/etc/otelcol/config.json:ro]
    networks:
      installation:
        aliases: [insights-collector]
    restart: unless-stopped
networks:
  installation:
    external: true
    name: toolgate-profiled_default
