# Public API v1 (docs/api.md §1)
toolgate_marketplace.api.catalog:
  path: '/api/toolgate/v1/catalog'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\ApiController::catalog' }
  methods: [GET]
  requirements: { _access: 'TRUE' }
toolgate_marketplace.api.package:
  path: '/api/toolgate/v1/tools/{package_id}'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\ApiController::package' }
  methods: [GET]
  requirements: { _access: 'TRUE', package_id: '[a-z][a-z0-9.-]{2,126}' }
toolgate_marketplace.api.version:
  path: '/api/toolgate/v1/tools/{package_id}/{version}'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\ApiController::version' }
  methods: [GET]
  requirements: { _access: 'TRUE', package_id: '[a-z][a-z0-9.-]{2,126}', version: '[0-9A-Za-z.+-]{5,128}' }
toolgate_marketplace.api.download:
  path: '/api/toolgate/v1/tools/{package_id}/{version}/package'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\ApiController::download' }
  methods: [GET, HEAD]
  requirements: { _access: 'TRUE', package_id: '[a-z][a-z0-9.-]{2,126}', version: '[0-9A-Za-z.+-]{5,128}' }
  options: { no_cache: TRUE }
toolgate_marketplace.api.release:
  path: '/api/toolgate/v1/tools/{package_id}/{version}/release'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\ApiController::release' }
  methods: [GET]
  requirements: { _access: 'TRUE', package_id: '[a-z][a-z0-9.-]{2,126}', version: '[0-9A-Za-z.+-]{5,128}' }
toolgate_marketplace.api.publisher:
  path: '/api/toolgate/v1/publishers/{slug}'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\ApiController::publisher' }
  methods: [GET]
  requirements: { _access: 'TRUE', slug: '[a-z][a-z0-9-]{1,30}' }
toolgate_marketplace.api.media:
  path: '/api/toolgate/v1/media/{media_id}'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\ApiController::media' }
  methods: [GET]
  requirements: { _access: 'TRUE', media_id: 'm_[0-9a-f]{32}' }
  options: { no_cache: TRUE }
toolgate_marketplace.keys:
  path: '/.well-known/toolgate-marketplace-keys.json'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\ApiController::keys' }
  methods: [GET]
  requirements: { _access: 'TRUE' }
  options: { no_cache: TRUE }
toolgate_marketplace.health:
  path: '/health'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\HealthController::health' }
  methods: [GET, HEAD]
  requirements: { _access: 'TRUE' }
  options: { no_cache: TRUE }

# Public pages
toolgate_marketplace.home:
  path: '/home'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\PageController::home', _title: 'OLO Orgs' }
  requirements: { _access: 'TRUE' }
toolgate_marketplace.browse:
  path: '/tools'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\PageController::browse', _title: 'Browse tools' }
  requirements: { _access: 'TRUE' }
toolgate_marketplace.tool:
  path: '/tools/{package_id}'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\PageController::tool', _title_callback: 'Drupal\toolgate_marketplace\Controller\PageController::toolTitle', version: null }
  requirements: { _access: 'TRUE', package_id: '[a-z][a-z0-9.-]{2,126}' }
toolgate_marketplace.tool_version:
  path: '/tools/{package_id}/{version}'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\PageController::tool', _title_callback: 'Drupal\toolgate_marketplace\Controller\PageController::toolTitle' }
  requirements: { _access: 'TRUE', package_id: '[a-z][a-z0-9.-]{2,126}', version: '[0-9A-Za-z.+-]{5,128}' }
toolgate_marketplace.publishers:
  path: '/publishers'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\PageController::publishers', _title: 'Publishers' }
  requirements: { _access: 'TRUE' }
toolgate_marketplace.publisher:
  path: '/publishers/{slug}'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\PageController::publisher', _title_callback: 'Drupal\toolgate_marketplace\Controller\PageController::publisherTitle' }
  requirements: { _access: 'TRUE', slug: '[a-z][a-z0-9-]{1,30}' }
toolgate_marketplace.about_signing:
  path: '/about/signing'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\PageController::aboutSigning', _title: 'About signing' }
  requirements: { _access: 'TRUE' }
toolgate_marketplace.terms:
  path: '/about/terms'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\PageController::terms', _title: 'Terms' }
  requirements: { _access: 'TRUE' }
toolgate_marketplace.privacy:
  path: '/about/privacy'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\PageController::privacy', _title: 'Privacy' }
  requirements: { _access: 'TRUE' }
toolgate_marketplace.sitemap:
  path: '/sitemap.xml'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\PageController::sitemap' }
  requirements: { _access: 'TRUE' }

# Publishing (signed-in publishers)
toolgate_marketplace.my_profile:
  path: '/my/profile'
  defaults: { _form: 'Drupal\toolgate_marketplace\Form\PublisherForm', _title: 'My publisher profile' }
  requirements: { _permission: 'publish toolgate packages' }
toolgate_marketplace.my_packages:
  path: '/my/packages'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\PageController::myPackages', _title: 'My packages' }
  requirements: { _permission: 'publish toolgate packages' }
toolgate_marketplace.publish:
  path: '/publish'
  defaults: { _form: 'Drupal\toolgate_marketplace\Form\UploadForm', _title: 'Publish a tool' }
  requirements: { _permission: 'publish toolgate packages' }
toolgate_marketplace.publish_checks:
  path: '/publish/{tgm_version}/checks'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\PageController::checks', _title: 'Publish a tool: checks' }
  requirements: { _entity_access: 'tgm_version.view', tgm_version: '\d+' }
  options: { parameters: { tgm_version: { type: 'entity:tgm_version' } } }
toolgate_marketplace.publish_describe:
  path: '/publish/{tgm_version}/describe'
  defaults: { _form: 'Drupal\toolgate_marketplace\Form\ListingForm', _title: 'Publish a tool: describe' }
  requirements: { _entity_access: 'tgm_version.update', tgm_version: '\d+' }
  options: { parameters: { tgm_version: { type: 'entity:tgm_version' } } }
toolgate_marketplace.version_edit:
  path: '/my/packages/{tgm_version}/edit'
  defaults: { _form: 'Drupal\toolgate_marketplace\Form\ListingForm', _title: 'Edit listing' }
  requirements: { _entity_access: 'tgm_version.update', tgm_version: '\d+' }
  options: { parameters: { tgm_version: { type: 'entity:tgm_version' } } }
toolgate_marketplace.version_delist:
  path: '/my/packages/{tgm_version}/delist'
  defaults: { _form: 'Drupal\toolgate_marketplace\Form\DelistForm', _title: 'Delist version' }
  requirements: { _entity_access: 'tgm_version.update', tgm_version: '\d+' }
  options: { parameters: { tgm_version: { type: 'entity:tgm_version' } } }
toolgate_marketplace.version_discard:
  path: '/my/packages/{tgm_version}/discard'
  defaults: { _form: 'Drupal\toolgate_marketplace\Form\DiscardForm', _title: 'Discard upload' }
  requirements: { _entity_access: 'tgm_version.delete', tgm_version: '\d+' }
  options: { parameters: { tgm_version: { type: 'entity:tgm_version' } } }

# Administration
toolgate_marketplace.admin:
  path: '/admin/marketplace'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\AdminController::dashboard', _title: 'Marketplace' }
  requirements: { _permission: 'administer toolgate marketplace' }
toolgate_marketplace.admin_seed:
  path: '/admin/marketplace/seed'
  defaults: { _controller: 'Drupal\toolgate_marketplace\Controller\AdminController::seed', _title: 'Example seed status' }
  requirements: { _permission: 'administer toolgate marketplace' }
