ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ErrorLog /dev/stderr
CustomLog /dev/stdout combined
LimitRequestBody 67108864
<Directory /opt/drupal/web>
  AllowOverride All
  Require all granted
</Directory>
