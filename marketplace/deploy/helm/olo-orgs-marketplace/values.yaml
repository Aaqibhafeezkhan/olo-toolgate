#
# PostgreSQL, Redis and S3-compatible object storage are external; this chart runs only the Marketplace's own
# workloads. Secrets are never values: create the three Secrets below first (docs/deployment.md).

imageRegistry: docker.io/ololabs
imagePullSecrets: []

marketplace:
  id: olo-labs-marketplace
  baseUrl: https://olo-labs.duckdns.org
  siteName: OLO Orgs
  trustedHosts: []
  # Pod CIDRs of the ingress controller; X-Forwarded-* is trusted only from these.
  reverseProxyAddresses: []
  maxPackageMb: 50
  maxExpandedMb: 200
  validationTimeoutSeconds: 30
  reservedPrefixes: olo,ololabs,toolgate,examples
  systemPublishers: examples
  seedExamples: true
  seedStrict: false
  mailFrom: noreply@olo-labs.duckdns.org
  contactEmail: abuse@olo-labs.duckdns.org
  smtpDsn: ''
  adminUser: admin
  adminMail: admin@olo-labs.duckdns.org
  database:
    driver: pgsql
    host: postgres
    port: 5432
    name: olo_orgs
    user: olo_orgs
  redis:
    host: redis
    port: 6379
  s3:
    endpoint: https://s3.example.invalid
    region: us-east-1
    bucket: olo-orgs
    # Host (and path) that serves <publicDomain>/s3fs-public/ to browsers; empty means the site's own origin,
    # which then must route /<bucket>/s3fs-public/ to the bucket.
    publicDomain: ''
  # Extra environment for every Drupal container.
  extraEnv: {}

secrets:
  # Keys: hash_salt, helper_token, db_password, s3_access_key, s3_secret_key, admin_password, and optionally
  # redis_password.
  drupal: olo-orgs-drupal
  # Keys: helper_token, s3_access_key, s3_secret_key.
  helper: olo-orgs-helper
  # Key: marketplace_signing_key (PKCS#8 PEM from scripts/init-signing-key.sh). Mounted only into the helper.
  signingKey: olo-orgs-signing-key

drupal:
  image:
    repository: olo-orgs-marketplace-drupal
    tag: ''
    digest: ''
    pullPolicy: IfNotPresent
  replicaCount: 2
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: '1', memory: 512Mi }
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  pdb:
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  ingress:
    enabled: false
    className: ''
    annotations: {}
    tlsSecret: ''
  deployJob:
    backoffLimit: 1
    activeDeadlineSeconds: 1800
  cron:
    schedule: '*/5 * * * *'

helper:
  image:
    repository: olo-toolgate-marketplace-helper
    tag: ''
    digest: ''
    pullPolicy: IfNotPresent
  signingKeyId: olo-marketplace-2026-1
  # keyId:base64PublicKey,... still listed after a rotation.
  retiredKeys: ''
  threads: 4
  replicaCount: 2
  resources:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { cpu: '1', memory: 768Mi }
  # Each validation stages one package in /tmp: threads x maxPackageMb, with headroom.
  tmpSize: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    minAvailable: 1
  networkPolicy:
    enabled: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
