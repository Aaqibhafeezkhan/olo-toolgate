{{- $name := printf "%s-drupal" (include "olo-orgs.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-orgs.labels" . | nindent 4 }}
    app.kubernetes.io/component: drupal
spec:
  {{- if not .Values.drupal.autoscaling.enabled }}
  replicas: {{ .Values.drupal.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "olo-orgs.selector" . | nindent 6 }}
      app.kubernetes.io/component: drupal
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        {{- include "olo-orgs.selector" . | nindent 8 }}
        app.kubernetes.io/component: drupal
        olo-orgs.ololabs.io/helper-client: "true"
      annotations:
        checksum/env: {{ include "olo-orgs.drupalEnvData" . | sha256sum }}
    spec:
      {{- include "olo-orgs.drupalPod" . | nindent 6 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: drupal
          {{- include "olo-orgs.drupalContainer" . | nindent 10 }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "olo-orgs.host" . | quote }}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "olo-orgs.host" . | quote }}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.drupal.resources | nindent 12 }}
      {{- with .Values.drupal.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.drupal.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.drupal.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "olo-orgs.selector" . | nindent 14 }}
              app.kubernetes.io/component: drupal
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-orgs.labels" . | nindent 4 }}
    app.kubernetes.io/component: drupal
spec:
  selector:
    {{- include "olo-orgs.selector" . | nindent 4 }}
    app.kubernetes.io/component: drupal
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-orgs.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.drupal.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "olo-orgs.selector" . | nindent 6 }}
      app.kubernetes.io/component: drupal
{{- if .Values.drupal.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-orgs.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ max 2 .Values.drupal.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.drupal.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.drupal.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.drupal.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-orgs.labels" . | nindent 4 }}
  {{- with .Values.drupal.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.drupal.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.drupal.ingress.tlsSecret }}
  tls:
    - hosts: [{{ include "olo-orgs.host" . | quote }}]
      secretName: {{ .Values.drupal.ingress.tlsSecret }}
  {{- end }}
  rules:
    - host: {{ include "olo-orgs.host" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
{{- end }}
