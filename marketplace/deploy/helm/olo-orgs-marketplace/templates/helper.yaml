{{- $name := printf "%s-helper" (include "olo-orgs.fullname" .) -}}
{{- $m := .Values.marketplace -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-orgs.labels" . | nindent 4 }}
    app.kubernetes.io/component: helper
spec:
  {{- if not .Values.helper.autoscaling.enabled }}
  replicas: {{ .Values.helper.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "olo-orgs.selector" . | nindent 6 }}
      app.kubernetes.io/component: helper
  template:
    metadata:
      labels:
        {{- include "olo-orgs.selector" . | nindent 8 }}
        app.kubernetes.io/component: helper
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: helper
          image: {{ include "olo-orgs.image" (list . .Values.helper.image) }}
          imagePullPolicy: {{ .Values.helper.image.pullPolicy }}
          env:
            - { name: MARKETPLACE_ID, value: {{ $m.id | quote }} }
            - { name: MARKETPLACE_SIGNING_KEY_ID, value: {{ .Values.helper.signingKeyId | quote }} }
            - { name: MARKETPLACE_RETIRED_KEYS, value: {{ .Values.helper.retiredKeys | quote }} }
            - { name: MARKETPLACE_SIGNING_KEY_FILE, value: /run/secrets/signing/marketplace_signing_key }
            - { name: MARKETPLACE_HELPER_TOKEN_FILE, value: /run/secrets/helper/helper_token }
            - { name: MARKETPLACE_S3_ACCESS_KEY_FILE, value: /run/secrets/helper/s3_access_key }
            - { name: MARKETPLACE_S3_SECRET_KEY_FILE, value: /run/secrets/helper/s3_secret_key }
            - { name: MARKETPLACE_S3_ENDPOINT, value: {{ $m.s3.endpoint | quote }} }
            - { name: MARKETPLACE_S3_REGION, value: {{ $m.s3.region | quote }} }
            - { name: MARKETPLACE_S3_BUCKET, value: {{ $m.s3.bucket | quote }} }
            - { name: MARKETPLACE_MAX_PACKAGE_MB, value: {{ $m.maxPackageMb | quote }} }
            - { name: MARKETPLACE_MAX_EXPANDED_MB, value: {{ $m.maxExpandedMb | quote }} }
            - { name: MARKETPLACE_VALIDATION_TIMEOUT_SECONDS, value: {{ $m.validationTimeoutSeconds | quote }} }
            - { name: MARKETPLACE_HELPER_THREADS, value: {{ .Values.helper.threads | quote }} }
            - { name: MARKETPLACE_RESERVED_PREFIXES, value: {{ $m.reservedPrefixes | quote }} }
            - { name: MARKETPLACE_SYSTEM_PUBLISHERS, value: {{ $m.systemPublishers | quote }} }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: helper, mountPath: /run/secrets/helper, readOnly: true }
            - { name: signing, mountPath: /run/secrets/signing, readOnly: true }
          resources:
            {{- toYaml .Values.helper.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.helper.tmpSize }}
        - name: helper
          secret:
            secretName: {{ .Values.secrets.helper }}
            defaultMode: 0440
        - name: signing
          secret:
            secretName: {{ .Values.secrets.signingKey }}
            defaultMode: 0440
            items:
              - { key: marketplace_signing_key, path: marketplace_signing_key }
      {{- with .Values.helper.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.helper.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.helper.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-orgs.labels" . | nindent 4 }}
    app.kubernetes.io/component: helper
spec:
  selector:
    {{- include "olo-orgs.selector" . | nindent 4 }}
    app.kubernetes.io/component: helper
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-orgs.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.helper.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "olo-orgs.selector" . | nindent 6 }}
      app.kubernetes.io/component: helper
{{- if .Values.helper.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-orgs.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ max 2 .Values.helper.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.helper.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.helper.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.helper.networkPolicy.enabled }}
---
# Only Drupal pods (web, deploy Job, cron) reach the helper; the kubelet's probes are not subject to this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-orgs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "olo-orgs.selector" . | nindent 6 }}
      app.kubernetes.io/component: helper
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "olo-orgs.selector" . | nindent 14 }}
              olo-orgs.ololabs.io/helper-client: "true"
      ports:
        - port: http
{{- end }}
