#
# OLO Orgs on one host: Caddy, two stateless Drupal replicas, the deploy job, cron, two helper replicas, PostgreSQL,
# Redis and MinIO. Run it only through scripts/compose.sh, which exports the absolute TOOLGATE_DIR, MARKETPLACE_DIR and
# MARKETPLACE_SEED_OUT and builds the seed first:
#
#   scripts/compose.sh --profile init-key run --rm init-key     # once: creates deploy/secrets/marketplace_signing_key
#   scripts/compose.sh up -d
#
# Settings come from deploy/.env (copy .env.example). No relative path here leaves deploy/.

name: olo-orgs

x-drupal: &drupal
  image: olo-orgs-marketplace-drupal:local
  env_file: .env
  environment:
    MARKETPLACE_REVERSE_PROXY_ADDRESSES: 172.30.10.0/24
    MARKETPLACE_HELPER_FILE_ROOT: ""
    # Secrets come from files; *_FILE wins over the plain variable in settings.php.
    DRUPAL_HASH_SALT_FILE: /run/secrets/drupal_hash_salt
    MARKETPLACE_HELPER_TOKEN_FILE: /run/secrets/marketplace_helper_token
    MARKETPLACE_ADMIN_PASSWORD_FILE: /run/secrets/marketplace_admin_password
    TOOLGATE_REVISION: ${TOOLGATE_REVISION:-unknown}
  secrets:
    - source: helper_token
      target: marketplace_helper_token
    - source: hash_salt
      target: drupal_hash_salt
  read_only: true
  tmpfs:
    - /tmp:size=256m,uid=33,gid=33
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }

services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    env_file: .env
    ports:
      - "${MARKETPLACE_HTTP_PORT:-80}:80"
      - "${MARKETPLACE_HTTPS_PORT:-443}:443"
    volumes:
      - ${MARKETPLACE_DIR}/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [web]
    depends_on: [drupal]
    restart: unless-stopped

  drupal:
    <<: *drupal
    build:
      context: ${MARKETPLACE_DIR}/drupal
      additional_contexts:
        marketplace: ${MARKETPLACE_DIR}
        seed: ${MARKETPLACE_SEED_OUT}
      args:
        TOOLGATE_REVISION: ${TOOLGATE_REVISION:-unknown}
      labels:
        io.ololabs.toolgate.revision: ${TOOLGATE_REVISION:-unknown}
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 512M }
    depends_on:
      deploy: { condition: service_completed_successfully }
    networks: [web, internal]
    restart: unless-stopped

  deploy:
    <<: *drupal
    command: ["/opt/drupal/scripts/deploy.sh"]
    secrets:
      - source: helper_token
        target: marketplace_helper_token
      - source: hash_salt
        target: drupal_hash_salt
      - source: admin_password
        target: marketplace_admin_password
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      helper: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  cron:
    <<: *drupal
    command: ["bash", "-c", "while true; do /opt/drupal/scripts/cron.sh || true; sleep 300; done"]
    depends_on:
      deploy: { condition: service_completed_successfully }
    networks: [internal]
    restart: unless-stopped

  helper:
    image: olo-toolgate-marketplace-helper:local
    build:
      context: ${TOOLGATE_DIR}
      dockerfile: ${MARKETPLACE_DIR}/helper/Dockerfile
      additional_contexts:
        marketplace: ${MARKETPLACE_DIR}
      args:
        TOOLGATE_REVISION: ${TOOLGATE_REVISION:-unknown}
      labels:
        io.ololabs.toolgate.revision: ${TOOLGATE_REVISION:-unknown}
    env_file: .env
    environment:
      MARKETPLACE_HELPER_TOKEN_FILE: /run/secrets/marketplace_helper_token
      # Only the helper mounts the signing key (design §6.1).
      MARKETPLACE_SIGNING_KEY_FILE: /run/secrets/marketplace_signing_key
      TOOLGATE_REVISION: ${TOOLGATE_REVISION:-unknown}
    secrets:
      - source: signing_key
        target: marketplace_signing_key
      - source: helper_token
        target: marketplace_helper_token
    read_only: true
    tmpfs:
      - /tmp:size=512m,uid=65532,gid=65532
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 768M }
    depends_on:
      minio-init: { condition: service_completed_successfully }
    networks: [internal]
    restart: unless-stopped

  db:
    image: postgres:17-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${MARKETPLACE_DB_NAME:-olo_orgs}
      POSTGRES_USER: ${MARKETPLACE_DB_USER:-olo_orgs}
      POSTGRES_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?set MARKETPLACE_DB_PASSWORD in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ${MARKETPLACE_DIR}/deploy/postgres/init.sql:/docker-entrypoint-initdb.d/10-pg_trgm.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:8.8.3-alpine@sha256:0b2b77d3ea5078274795e3177cdbdada8b96316684a38911d528534ed679b5ec
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal]
    restart: unless-stopped

  minio:
    # Community build of MinIO; upstream stopped publishing images.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MARKETPLACE_S3_ACCESS_KEY:?set MARKETPLACE_S3_ACCESS_KEY in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MARKETPLACE_S3_SECRET_KEY:?set MARKETPLACE_S3_SECRET_KEY in deploy/.env}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [internal, web]
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set store http://minio:9000 "$$MARKETPLACE_S3_ACCESS_KEY" "$$MARKETPLACE_S3_SECRET_KEY" &&
        mc mb --ignore-existing "store/$$MARKETPLACE_S3_BUCKET" &&
        mc anonymous set download "store/$$MARKETPLACE_S3_BUCKET/s3fs-public"
    env_file: .env
    depends_on:
      minio: { condition: service_healthy }
    networks: [internal]
    restart: "no"

  # One-time key generation (design §6.1). Refuses to overwrite an existing key.
  init-key:
    profiles: [init-key]
    image: olo-orgs-marketplace-drupal:local
    user: "0:0"
    entrypoint: ["bash", "-c"]
    command:
      - bash /marketplace/scripts/init-signing-key.sh /secrets/marketplace_signing_key && chown 65532:65532 /secrets/marketplace_signing_key
    environment:
      MARKETPLACE_SIGNING_KEY_ID: ${MARKETPLACE_SIGNING_KEY_ID:-}
    volumes:
      - ${MARKETPLACE_DIR}/scripts:/marketplace/scripts:ro
      - ${MARKETPLACE_DIR}/deploy/secrets:/secrets
    network_mode: none

secrets:
  signing_key:
    file: ${MARKETPLACE_DIR}/deploy/secrets/marketplace_signing_key
  helper_token:
    file: ${MARKETPLACE_DIR}/deploy/secrets/helper_token
  hash_salt:
    file: ${MARKETPLACE_DIR}/deploy/secrets/drupal_hash_salt
  admin_password:
    file: ${MARKETPLACE_DIR}/deploy/secrets/admin_password

networks:
  web:
    ipam:
      config:
        - subnet: 172.30.10.0/24
  internal:
    internal: true

volumes:
  db-data:
  minio-data:
  caddy-data:
