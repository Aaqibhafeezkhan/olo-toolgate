#
# OLO Orgs on a laptop in two containers: the site (Drupal, PostgreSQL and files, olo-orgs-standalone) and the
# helper that validates and signs packages. See README.md.
#
#   docker compose --profile init-key run --rm init-key   # once: the signing key, into the helper's own volume
#   docker compose up -d                                  # then open http://localhost:8080

name: olo-orgs-standalone

services:
  drupal:
    image: ${OLO_ORGS_IMAGE:-olo-orgs-standalone:local}
    ports:
      - "${OLO_ORGS_PORT:-8080}:8080"
    environment:
      MARKETPLACE_BASE_URL: http://localhost:${OLO_ORGS_PORT:-8080}
    volumes:
      - site:/var/lib/olo-orgs
    restart: unless-stopped

  helper:
    image: ${OLO_HELPER_IMAGE:-olo-toolgate-marketplace-helper:local}
    environment:
      MARKETPLACE_ID: olo-labs-marketplace
      MARKETPLACE_SIGNING_KEY_ID: ${OLO_SIGNING_KEY_ID:-olo-marketplace-local-1}
      MARKETPLACE_SIGNING_KEY_FILE: /run/olo-key/marketplace_signing_key
      # Written by the drupal container on its first start; the helper restarts until it exists.
      MARKETPLACE_HELPER_TOKEN_FILE: /var/lib/olo-orgs/secrets/helper_token
      MARKETPLACE_HELPER_FILE_ROOT: /var/lib/olo-orgs/private
    volumes:
      - site:/var/lib/olo-orgs:ro
      - signing-key:/run/olo-key:ro
    restart: unless-stopped

  # One-time key generation; refuses to replace an existing key.
  init-key:
    profiles: [init-key]
    image: ${OLO_ORGS_IMAGE:-olo-orgs-standalone:local}
    user: "0:0"
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        if [ -e /run/olo-key/marketplace_signing_key ]; then echo "signing key already exists; not replacing it" >&2; exit 1; fi
        umask 077
        openssl genpkey -algorithm ed25519 -out /run/olo-key/marketplace_signing_key
        chown 65532:65532 /run/olo-key/marketplace_signing_key
        chmod 400 /run/olo-key/marketplace_signing_key
        pub="$$(openssl pkey -in /run/olo-key/marketplace_signing_key -pubout -outform DER | tail -c 32 | base64)"
        echo "keyId:     ${OLO_SIGNING_KEY_ID:-olo-marketplace-local-1}"
        echo "publicKey: $$pub"
        echo "ToolGate:  TOOLGATE_CONTROL_MARKETPLACE_KEYS=${OLO_SIGNING_KEY_ID:-olo-marketplace-local-1}:$$pub"
    volumes:
      - signing-key:/run/olo-key
    network_mode: none

volumes:
  site:
  signing-key:
