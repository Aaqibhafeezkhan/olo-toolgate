[workspace]
resolver = "2"
members = [
  "packages/contracts/rust",
  "packages/tenant-identity/rust",
  "apps/gateway",
  "apps/endpoint-client",
  "apps/tool-host",
  "tool-sdk/cli",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/olo-labs/olo-toolgate"
version = "1.0.0-dev.1"

[workspace.dependencies]
olo-toolgate-tenant-identity = { path = "packages/tenant-identity/rust" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
olo-toolgate-contracts = { path = "packages/contracts/rust", version = "1.0.0-dev.1" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util", "test-util", "fs", "process"] }
jsonschema = { version = "0.58.4", default-features = false }
sha2 = "0.11.0"
subtle = "2.6.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json"] }
tower = { version = "0.5.3", features = ["util"] }
base64 = "0.22.1"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "ring"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
x509-parser = { version = "0.18.1", features = ["verify"] }
libc = "0.2.183"
windows-service = "0.8.1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
semver = "1.0.28"
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3.31", features = ["sink"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Services", "Win32_UI_Shell"] }
