# Merge after deploy/compose/QuickStart/compose.yaml.
services:
  quickstart:
    environment:
      TOOLGATE_INSIGHTS_MODE: DETAILED
      TOOLGATE_INSIGHTS_SPAN_SAMPLE_RATIO: ${TOOLGATE_INSIGHTS_SPAN_SAMPLE_RATIO:-1.0}
      TOOLGATE_INSIGHTS_OTLP_ENDPOINT: http://toolgate-datadog-collector:4318
      TOOLGATE_INSIGHTS_OTLP_SERVICE_NAME: ${TOOLGATE_INSIGHTS_OTLP_SERVICE_NAME:-olo-toolgate}
      TOOLGATE_INSIGHTS_OTLP_ENVIRONMENT: ${TOOLGATE_INSIGHTS_OTLP_ENVIRONMENT:-development}

