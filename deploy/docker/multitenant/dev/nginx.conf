pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
stream {
    server { listen 18443; listen 19443; proxy_pass control:8443; proxy_timeout 40s; }
}
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map "$server_port:$host" $tenant_gateway {
        "18444:tenant-a.olo.test" gateway-a:8081;
        "19444:tenant-b.olo.test" gateway-b:8081;
        default "";
    }
    map "$server_port:$host" $tenant_management {
        "18444:tenant-a.olo.test" gateway-a:9091;
        "19444:tenant-b.olo.test" gateway-b:9091;
        default "";
    }
    resolver 127.0.0.11 valid=10s;
    server {
        listen 18444 ssl;
        listen 19444 ssl;
        server_name tenant-a.olo.test tenant-b.olo.test;
        ssl_certificate /etc/ingress/tls.crt;
        ssl_certificate_key /etc/ingress/tls.key;
        if ($tenant_gateway = "") { return 404; }
        client_max_body_size 128m;
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ingress/control-ca.pem;
        location = /v1/health/ready {
            limit_except GET { deny all; }
            proxy_pass http://$tenant_management;
        }
        location ~ ^/(mcp$|access/|v1/chat/completions$|\.well-known/olo-toolgate-client$|api/public/v1/clients/configuration$) {
            proxy_pass http://$tenant_gateway;
        }
        location / { proxy_pass https://control:8443; }
    }
}
