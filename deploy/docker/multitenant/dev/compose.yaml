name: olo-multitenant-dev
x-runtime: &runtime
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 256
  tmpfs: [/tmp:rw,noexec,nosuid,size=128m,uid=65532,gid=65532]
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Select PostgreSQL 17}
    entrypoint: [/bin/sh, /deployment/start-postgres.sh]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/database/admin-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/toolgate-postgres/server.crt, -c, ssl_key_file=/run/toolgate-postgres/server.key, -c, hba_file=/deployment/pg_hba.conf]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${CREDENTIALS_DIR:?Use manage.py}/database:/run/database:ro
      - ./init-database.sh:/docker-entrypoint-initdb.d/10-toolgate.sh:ro
      - ./start-postgres.sh:/deployment/start-postgres.sh:ro
      - ./pg_hba.conf:/deployment/pg_hba.conf:ro
    tmpfs: [/run/toolgate-postgres:rw,noexec,nosuid,size=1m]
    networks: [platform]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt: [no-new-privileges:true]
  control:
    <<: *runtime
    image: ${CONTROL_IMAGE:?Select matching Control}
    env_file: ${CREDENTIALS_DIR:?Use manage.py}/control/control.env
    environment:
      TOOLGATE_TENANCY_MODE: subdomain
      TOOLGATE_CONTROL_BUILDER_ENABLED: "false"
      QUARKUS_HTTP_HOST: 0.0.0.0
    volumes:
      - ${CREDENTIALS_DIR:?Use manage.py}/control:/etc/toolgate:ro
      - control-data:/data
    networks: [platform, ingress-control, graph-control]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 2g
    cpus: 2.0
  gateway-a:
    <<: *runtime
    image: ${GATEWAY_IMAGE:?Select matching Gateway}
    env_file: ${CREDENTIALS_DIR:?Use manage.py}/tenant-a/gateway/model.env
    environment: {TOOLGATE_GATEWAY_CONFIG: /etc/gateway/config.json, TOOLGATE_GATEWAY_CREDENTIALS: /etc/gateway/credentials.json}
    volumes: ["${CREDENTIALS_DIR:?Use manage.py}/tenant-a/gateway:/etc/gateway:ro"]
    networks: [tenant-a, ingress-a, model-a]
  gateway-b:
    <<: *runtime
    image: ${GATEWAY_IMAGE:?Select matching Gateway}
    env_file: ${CREDENTIALS_DIR:?Use manage.py}/tenant-b/gateway/model.env
    environment: {TOOLGATE_GATEWAY_CONFIG: /etc/gateway/config.json, TOOLGATE_GATEWAY_CREDENTIALS: /etc/gateway/credentials.json}
    volumes: ["${CREDENTIALS_DIR:?Use manage.py}/tenant-b/gateway:/etc/gateway:ro"]
    networks: [tenant-b, ingress-b, model-b]
  host-a:
    <<: *runtime
    image: ${TOOL_HOST_IMAGE:?Select matching Tool Host}
    entrypoint: [/usr/local/bin/olo-toolgate-tool-host]
    healthcheck: {disable: true}
    environment: {TOOLGATE_TOOL_HOST_CONFIG: /etc/tenant/config.json}
    volumes:
      - ${CREDENTIALS_DIR:?Use manage.py}/tenant-a/host:/etc/tenant:ro
      - host-a-state:/data
    networks: [tenant-a]
    mem_limit: 2g
    cpus: 2.0
  host-b:
    <<: *runtime
    image: ${TOOL_HOST_IMAGE:?Select matching Tool Host}
    entrypoint: [/usr/local/bin/olo-toolgate-tool-host]
    healthcheck: {disable: true}
    environment: {TOOLGATE_TOOL_HOST_CONFIG: /etc/tenant/config.json}
    volumes:
      - ${CREDENTIALS_DIR:?Use manage.py}/tenant-b/host:/etc/tenant:ro
      - host-b-state:/data
    networks: [tenant-b]
    mem_limit: 2g
    cpus: 2.0
  graph-builder:
    <<: *runtime
    image: ${RUNTIME_IMAGE:?Select matching workflow runtime}
    entrypoint: [/opt/toolgate-runtime/bin/python, -m, toolgate_runtime.graph_server]
    command: [--configuration, /installation/graph.json]
    volumes: ["${CREDENTIALS_DIR:?Use manage.py}/graph-builder:/installation:ro"]
    networks: [graph-control]
    healthcheck: {disable: true}
  worker-a:
    <<: *runtime
    image: ${RUNTIME_IMAGE:?Select matching workflow runtime}
    entrypoint: [/opt/toolgate-runtime/bin/python, -m, toolgate_runtime.worker]
    command: [--control-origin, "https://tenant-a.olo.test:18443", --gateway-origin, "https://tenant-a.olo.test:18444", --token-file, /installation/worker.token, --control-ca-file, /installation/ca.crt, --gateway-ca-file, /installation/ca.crt]
    volumes: ["${CREDENTIALS_DIR:?Use manage.py}/tenant-a/worker:/installation:ro"]
    networks: [ingress-a]
    healthcheck: {disable: true}
  worker-b:
    <<: *runtime
    image: ${RUNTIME_IMAGE:?Select matching workflow runtime}
    entrypoint: [/opt/toolgate-runtime/bin/python, -m, toolgate_runtime.worker]
    command: [--control-origin, "https://tenant-b.olo.test:19443", --gateway-origin, "https://tenant-b.olo.test:19444", --token-file, /installation/worker.token, --control-ca-file, /installation/ca.crt, --gateway-ca-file, /installation/ca.crt]
    volumes: ["${CREDENTIALS_DIR:?Use manage.py}/tenant-b/worker:/installation:ro"]
    networks: [ingress-b]
    healthcheck: {disable: true}
  ingress:
    <<: *runtime
    image: ${INGRESS_IMAGE:?Select nginx with stream/TLS support}
    entrypoint: [nginx, -g, "daemon off;"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CREDENTIALS_DIR:?Use manage.py}/ingress:/etc/ingress:ro
    ports: ["127.0.0.1:18444:18444", "127.0.0.1:19444:19444", "127.0.0.1:18443:18443", "127.0.0.1:19443:19443"]
    networks:
      ingress-control: {}
      graph-control: {aliases: [tenant-a.olo.test, tenant-b.olo.test]}
      tenant-a: {aliases: [tenant-a.olo.test]}
      tenant-b: {aliases: [tenant-b.olo.test]}
      ingress-a: {aliases: [tenant-a.olo.test]}
      ingress-b: {aliases: [tenant-b.olo.test]}
networks:
  platform: {internal: true}
  ingress-control: {internal: true}
  graph-control: {internal: true}
  tenant-a: {internal: true}
  tenant-b: {internal: true}
  ingress-a: {internal: true}
  ingress-b: {internal: true}
  model-a: {}
  model-b: {}
volumes:
  postgres-data: {}
  control-data: {}
  host-a-state: {}
  host-b-state: {}
