name: toolgate-multitenant
x-runtime: &runtime
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "65532:65532"
  restart: unless-stopped
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 256
  tmpfs: [/tmp:rw,noexec,nosuid,size=128m,uid=65532,gid=65532]
services:
  control:
    <<: *runtime
    mem_limit: 2g
    cpus: 2.0
    image: ${CONTROL_IMAGE:?Set the qualified Control image digest}
    env_file: ${CONTROL_ENV:?Set the protected Control environment file}
    environment:
      TOOLGATE_TENANCY_MODE: subdomain
      TOOLGATE_CONTROL_BUILDER_ENABLED: "false"
      QUARKUS_HTTP_HOST: 0.0.0.0
    volumes:
      - ${CONTROL_CUSTODY:?Set platform-only custody}:/etc/toolgate:ro
      - control-data:/data
    networks:
      platform: {}
      ingress-control: {}
      tenant-a: {aliases: [tenant1.xyz.com]}
      tenant-b: {aliases: [tenant2.xyz.com]}
  gateway-a:
    <<: *runtime
    image: ${GATEWAY_IMAGE:?Set the qualified Gateway image digest}
    environment: {TOOLGATE_GATEWAY_CONFIG: /etc/gateway/config.json, TOOLGATE_GATEWAY_CREDENTIALS: /etc/gateway/credentials.json}
    volumes: ["${TENANT_A_GATEWAY_CUSTODY:?Set tenant A Gateway custody}:/etc/gateway:ro"]
    networks: [tenant-a, ingress-a]
  gateway-b:
    <<: *runtime
    image: ${GATEWAY_IMAGE:?Set the qualified Gateway image digest}
    environment: {TOOLGATE_GATEWAY_CONFIG: /etc/gateway/config.json, TOOLGATE_GATEWAY_CREDENTIALS: /etc/gateway/credentials.json}
    volumes: ["${TENANT_B_GATEWAY_CUSTODY:?Set tenant B Gateway custody}:/etc/gateway:ro"]
    networks: [tenant-b, ingress-b]
  host-a:
    <<: *runtime
    mem_limit: 2g
    cpus: 2.0
    image: ${TOOL_HOST_IMAGE:?Set the qualified Tool Host image digest}
    environment: {TOOLGATE_TOOL_HOST_CONFIG: /etc/tenant/config.json}
    volumes:
      - ${TENANT_A_HOST_CUSTODY:?Set tenant A public roots and configuration}:/etc/tenant:ro
      - host-a-state:/data
    networks: [tenant-a]
  host-b:
    <<: *runtime
    mem_limit: 2g
    cpus: 2.0
    image: ${TOOL_HOST_IMAGE:?Set the qualified Tool Host image digest}
    environment: {TOOLGATE_TOOL_HOST_CONFIG: /etc/tenant/config.json}
    volumes:
      - ${TENANT_B_HOST_CUSTODY:?Set tenant B public roots and configuration}:/etc/tenant:ro
      - host-b-state:/data
    networks: [tenant-b]
  ingress:
    <<: *runtime
    image: ${INGRESS_IMAGE:?Set the qualified nginx image digest with stream support}
    entrypoint: [nginx, -g, "daemon off;"]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${INGRESS_CUSTODY:?Set ingress-only TLS certificate/key and public Control CA}:/etc/ingress:ro
    ports: ["443:8444", "8443:8443"]
    networks: [ingress-a, ingress-b, ingress-control]
networks:
  platform: {external: true, name: "${PLATFORM_NETWORK:?Set the restricted PostgreSQL network}"}
  ingress-control: {internal: true}
  ingress-a: {internal: true}
  ingress-b: {internal: true}
  tenant-a: {internal: true}
  tenant-b: {internal: true}
volumes:
  control-data: {}
  host-a-state: {}
  host-b-state: {}
