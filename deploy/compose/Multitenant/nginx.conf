pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
stream {
    # Preserve the original TLS handshake and device peer certificate at Control.
    server { listen 8443; proxy_pass control:8443; proxy_timeout 40s; }
}
http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $host $tenant_gateway {
        tenant1.xyz.com gateway-a:8081;
        tenant2.xyz.com gateway-b:8081;
        default "";
    }
    resolver 127.0.0.11 valid=10s;
    server {
        listen 8444 ssl;
        server_name tenant1.xyz.com tenant2.xyz.com;
        ssl_certificate /etc/ingress/tls.crt;
        ssl_certificate_key /etc/ingress/tls.key;
        if ($tenant_gateway = "") { return 404; }
        client_max_body_size 1m;
        proxy_set_header Host $host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ingress/control-ca.pem;
        location ~ ^/(mcp$|access/|\.well-known/olo-toolgate-client$|api/public/v1/clients/configuration$) {
            proxy_pass http://$tenant_gateway;
        }
        location / { proxy_pass https://control:8443; }
    }
}
