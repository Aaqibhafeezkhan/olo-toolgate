name: toolgate-gateway-control
x-runtime: &runtime
  platform: linux/amd64
  restart: unless-stopped
  logging:
    driver: local
    options: {max-size: "10m", max-file: "3"}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [backend]
services:
  control:
    <<: *runtime
    image: ${CONTROL_IMAGE:-ololab/olo-toolgate-control:dev}
    env_file:
      - path: ./env/control.env
        format: raw
        required: true
    mem_limit: 768m
    cpus: 2
    stop_grace_period: 30s
    tmpfs: [/tmp:rw,noexec,nosuid,size=128m,uid=65532,gid=65532]
    volumes:
      - ./custody/control:/custody:ro
      - builder-data:/data/builder
  gateway:
    <<: *runtime
    image: ${GATEWAY_IMAGE:-ololab/olo-toolgate-gateway:dev}
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 20s
    environment:
      TOOLGATE_GATEWAY_CONFIG: /config/gateway.json
      TOOLGATE_GATEWAY_CREDENTIALS: /config/credentials.json
    volumes:
      - ./custody/gateway:/config:ro
  proxy:
    <<: *runtime
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    mem_limit: 128m
    tmpfs: [/var/cache/nginx:rw,noexec,nosuid,size=16m, /var/run:rw,noexec,nosuid,size=1m]
    ports: ["127.0.0.1:${STACK_TLS_PORT:-8444}:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./custody/proxy:/tls:ro
    depends_on: [control, gateway]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/ready']
      interval: 5s
      timeout: 3s
      retries: 30
networks:
  backend:
volumes:
  builder-data:
