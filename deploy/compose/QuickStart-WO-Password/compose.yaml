name: toolgate-quickstart-wo-password
services:
  quickstart:
    image: ${QUICKSTART_IMAGE:-ololab/olo-toolgate-quickstart:dev}
    platform: linux/amd64
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
    stop_grace_period: 35s
    environment:
      # Used only when the setup administrator is first created.
      TOOLGATE_ADMIN_EMAIL: ${TOOLGATE_ADMIN_EMAIL:-admin@admin.com}
      TOOLGATE_DISABLE_ADMIN_PASSWORD: ${TOOLGATE_DISABLE_ADMIN_PASSWORD:-false}
      TOOLGATE_QUICKSTART_DATABASE_MODE: ${TOOLGATE_QUICKSTART_DATABASE_MODE:-sqlite}
      # Client check-in (env-owned; shown read-only in the console). 500 ms is the job pickup latency.
      TOOLGATE_CONTROL_CLIENT_CHECKIN_MS: ${TOOLGATE_CONTROL_CLIENT_CHECKIN_MS:-500}
      TOOLGATE_CONTROL_CLIENT_CHECKIN_JITTER_PCT: ${TOOLGATE_CONTROL_CLIENT_CHECKIN_JITTER_PCT:-0}
      TOOLGATE_CONTROL_CLIENT_OFFLINE_AFTER_MS: ${TOOLGATE_CONTROL_CLIENT_OFFLINE_AFTER_MS:-120000}
      # OLO Orgs Marketplace (env-owned; off unless enabled). KEYS lists keyId:base64PublicKey pairs; CA_PATH optionally
      # names a PEM under /external that Control trusts for the Marketplace origin. See marketplace/docs/api.md §4.
      TOOLGATE_CONTROL_MARKETPLACE_ENABLED: ${TOOLGATE_CONTROL_MARKETPLACE_ENABLED:-false}
      TOOLGATE_CONTROL_MARKETPLACE_ID: ${TOOLGATE_CONTROL_MARKETPLACE_ID:-}
      TOOLGATE_CONTROL_MARKETPLACE_BASE_URL: ${TOOLGATE_CONTROL_MARKETPLACE_BASE_URL:-}
      TOOLGATE_CONTROL_MARKETPLACE_KEYS: ${TOOLGATE_CONTROL_MARKETPLACE_KEYS:-}
      TOOLGATE_CONTROL_MARKETPLACE_CA_PATH: ${TOOLGATE_CONTROL_MARKETPLACE_CA_PATH:-}
    env_file:
      - path: ./env/.env.db
        required: false
        format: raw
    extra_hosts: ["host.docker.internal:host-gateway"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=65532,gid=65532
    ports:
      - "127.0.0.1:${QUICKSTART_HTTP_PORT:-8080}:8080"
      - "127.0.0.1:${QUICKSTART_TLS_PORT:-8443}:8443"
    volumes:
      - data:/data
      - ./env:/external:ro
      - ./check-options.py:/opt/quickstart/check-options.py:ro
volumes:
  data:
