global:
  imageRegistry: ghcr.io/olo-labs
  imagePullSecrets: []
gateway:
  enabled: false
  replicaCount: 2
  image:
    repository: olo-toolgate-gateway
    tag: ''
    digest: ''
    pullPolicy: IfNotPresent
  credentialsSecret: ''
  credentialsKey: credentials.json
  config:
    listen: 0.0.0.0:8081
    managementListen: 0.0.0.0:9091
    trustedTlsProxy: true
    allowedOrigins: []
    limits:
      maxBodyBytes: 65536
      maxHeaderBytes: 8192
      maxConcurrentRequests: 128
      maxConnections: 256
      requestsPerSecond: 1000
      requestTimeoutMs: 20000
      connectionTimeoutMs: 35000
      shutdownTimeoutMs: 35000
      auditQueueCapacity: 256
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: '1'
      memory: 256Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
  terminationGracePeriodSeconds: 45
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  networkPolicy:
    enabled: true
    runtimeFrom: []
    managementFrom: []
    controlTo: []
    dnsTo: []
  ingress:
    enabled: false
    className: ''
    annotations: {}
    host: gateway.example.invalid
    tlsSecret: ''
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
  control:
    url: https://control.example.invalid
    tokenSecret: ''
    tokenKey: access-token
    controlPort: 443
control:
  enabled: false
  builder:
    enabled: false
    # Retain and back up this claim with Control's database. Multiple replicas require shared read/write storage.
    existingClaim: ''
  approval:
    enabled: false
    pendingTtlMs: 300000
    maxActive: 1000
    maxActivePermits: 4096
  bundle:
    enabled: false
    keyId: bundle-key-1
    issuer: control
    audience: gateway
    signingSecret: ''
    signingKey: private.pem
    keyRevision: '1'
  replicaCount: 2
  image:
    repository: olo-toolgate-control
    tag: ''
    digest: ''
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '2'
      memory: 768Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  pdb:
    enabled: true
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  networkPolicy:
    enabled: true
    runtimeFrom: []
    managementFrom: []
    databaseTo: []
    dnsTo: []
    collectorTo: []
    artifactTo: []
    marketplaceTo: []
    # Egress to the client-tool image registry (clientImages); its port comes from clientImages.registryUrl.
    registryTo: []
  ingress:
    enabled: false
    className: ''
    annotations: {}
    host: control.example.invalid
    tlsSecret: ''
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s
  developmentMode: false
  clientDownloads:
    enabled: false
  # Env-owned client check-in (platform-requirements.md §17.2), shown read-only in the console. The check-in is
  # the job pickup latency for an idle device. offlineAfterMs 0 means max(120000, 6 x checkInMs).
  clientCheckIn:
    checkInMs: 2000
    jitterPct: 20
    offlineAfterMs: 0
  endpoint:
    enabled: false
    tenantId: ''
    serverId: ''
    organization: ''
    controlUrl: ''
    gatewayUrl: ''
    deviceCaSecret: ''
    tlsSecret: ''
    trustStoreSecret: ''
  publicKeySecret: ''
  publicKeyKey: public.pem
  jwt:
    issuer: https://identity.example.invalid
    audience: toolgate-control
  tracing:
    enabled: false
    host: collector.example.invalid
    port: 4317
    protocol: grpc
  database:
    host: postgres.example.invalid
    port: 5432
    name: toolgate
    credentialsSecret: ''
    sslMode: verify-full
    caSecret: ''
    caKey: ca.crt
  limits:
    maxRecords: 512
    maxConfigBytes: 1048576
  # OLO Orgs Marketplace (marketplace docs/api.md §4). Environment-owned: a configuration import can't change these.
  # keys lists keyId:base64RawEd25519PublicKey pairs; Control logs and shows their fingerprints. caSecret optionally
  # names a Secret whose ca.pem Control trusts for the Marketplace origin instead of the default trust store.
  marketplace:
    enabled: false
    id: ''
    baseUrl: ''
    keys: ''
    caSecret: ''
  # Deployment profile (docs/deployment/profiles.md): a ConfigMap whose profile.json Control applies at startup through
  # its provisioning service. Empty means no profile.
  profile:
    configMap: ''
  # Client-tool images (ADR 026): the registry Control pushes images to and the approved JRE base mirrored there by
  # digest. credentialsSecret holds `credentials` (user:secret); caSecret holds `ca.pem` for a private registry CA.
  clientImages:
    enabled: false
    registryUrl: ''
    repository: ''
    base: ''
    platforms: LINUX
    credentialsSecret: ''
    caSecret: ''
  # The package-release key Control signs client releases with (`private.pem`); never the organization (fleet) key.
  # Without it Control returns the exact release document for an independent release authority.
  packageRelease:
    signingSecret: ''
    keyId: ''
  fleet:
    enabled: false
    keyId: ''
    signingSecret: ''
    trustSecret: ''
    artifactOrigin: ''
    artifactSecret: ''
    artifactPort: 443
  effect:
    enabled: true
    signingSecret: ''
    signingKey: private.pem
    keyId: effect-key-1
    issuer: control
    audience: toolgate-client
  recovery:
    enabled: false
    packetSecret: ''
    packetKey: reviewed-recovery.json
    trustSecret: ''
    trustKey: reviewer-keys.json
