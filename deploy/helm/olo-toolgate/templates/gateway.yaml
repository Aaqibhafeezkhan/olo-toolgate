{{- if .Values.gateway.enabled }}
{{- $g := .Values.gateway }}
{{- $name := include "olo-toolgate.gatewayName" . }}
{{- $config := deepCopy $g.config }}
{{- if lt (int $g.config.limits.requestTimeoutMs) 10000 }}{{ fail "online authority requires at least a ten second ingress deadline" }}{{ end }}
{{- $control := dict "tenantId" (required "Gateway requires its provisioned tenant UUID" $g.control.tenantId) "url" (required "Gateway requires its canonical tenant Control origin" $g.control.url) "tokenPath" "/etc/toolgate/control-auth/access-token" "developmentLoopbackHttp" false }}
{{- if $g.control.caSecret }}{{- $_ := set $control "caCertificatePath" "/etc/toolgate/control-ca/ca.pem" }}{{- end }}
{{- $_ := set $config "control" $control }}
{{- $_ := set $config "publicDiscovery" (dict "controlOrigin" $g.control.url "gatewayOrigin" (required "Gateway requires its canonical publicOrigin" $g.publicOrigin)) }}
{{- if and $g.networkPolicy.enabled (or (not $g.networkPolicy.controlTo) (not $g.networkPolicy.dnsTo)) }}{{ fail "online authority requires explicit controlTo and dnsTo egress peers" }}{{ end }}
{{- if or (ne $g.config.listen "0.0.0.0:8081") (ne $g.config.managementListen "0.0.0.0:9091") }}
{{- fail "Helm requires the fixed internal runtime/management listeners" }}
{{- end }}
{{- if not $g.config.trustedTlsProxy }}{{ fail "Helm requires trusted TLS termination" }}{{ end }}
{{- if and $g.ingress.enabled (not (or (has $g.ingress.host $g.config.tenantHosts) (has (printf "%s:443" $g.ingress.host) $g.config.tenantHosts))) }}{{ fail "Gateway ingress must name one of its configured tenant authorities" }}{{ end }}
{{- if le (int $g.terminationGracePeriodSeconds) (div (int $g.config.limits.shutdownTimeoutMs) 1000) }}{{ fail "termination grace must exceed application drain deadline" }}{{ end }}
{{- if and $g.autoscaling.enabled (gt (int $g.autoscaling.minReplicas) (int $g.autoscaling.maxReplicas)) }}{{ fail "HPA minimum must not exceed maximum" }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-toolgate.gatewayLabels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-toolgate.gatewayLabels" . | nindent 4 }}
data:
  gateway.json: {{ $config | toJson | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-toolgate.gatewayLabels" . | nindent 4 }}
spec:
  {{- if not $g.autoscaling.enabled }}
  replicas: {{ $g.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "olo-toolgate.gatewaySelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "olo-toolgate.gatewaySelector" . | nindent 8 }}
      annotations:
        checksum/config: {{ $g | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $g.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml $g.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $g.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $g.topologySpreadConstraints | nindent 8 }}
      {{- else }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "olo-toolgate.gatewaySelector" . | nindent 14 }}
      {{- end }}
      containers:
        - name: gateway
          {{- if $g.image.digest }}
          image: {{ printf "%s/%s@%s" .Values.global.imageRegistry $g.image.repository $g.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s/%s:%s" .Values.global.imageRegistry $g.image.repository ($g.image.tag | default .Chart.AppVersion) | quote }}
          {{- end }}
          imagePullPolicy: {{ $g.image.pullPolicy }}
          securityContext:
            {{- toYaml $g.securityContext | nindent 12 }}
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          ports:
            - {name: runtime, containerPort: 8081}
            - {name: management, containerPort: 9091}
          env:
            - {name: TOOLGATE_GATEWAY_CONFIG, value: /etc/toolgate/config/gateway.json}
            - {name: TOOLGATE_GATEWAY_CREDENTIALS, value: /etc/toolgate/credentials/credentials.json}
          startupProbe:
            httpGet: {path: /v1/health/live, port: management}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /v1/health/ready, port: management}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /v1/health/live, port: management}
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - {name: config, mountPath: /etc/toolgate/config, readOnly: true}
            - {name: credentials, mountPath: /etc/toolgate/credentials, readOnly: true}
            - {name: control-auth, mountPath: /etc/toolgate/control-auth, readOnly: true}
            {{- if $g.control.caSecret }}
            - {name: control-ca, mountPath: /etc/toolgate/control-ca, readOnly: true}
            {{- end }}
      volumes:
        {{- if $g.control.caSecret }}
        - name: control-ca
          secret:
            secretName: {{ $g.control.caSecret | quote }}
            defaultMode: 0444
            items: [{key: ca.pem, path: ca.pem}]
        {{- end }}
        - name: config
          configMap:
            name: {{ $name }}
        - name: credentials
          secret:
            secretName: {{ required "gateway.credentialsSecret is required" $g.credentialsSecret | quote }}
            defaultMode: 0444
            items:
              - key: {{ $g.credentialsKey | quote }}
                path: credentials.json
        - name: control-auth
          secret:
            secretName: {{ required "gateway.control.tokenSecret required" $g.control.tokenSecret | quote }}
            defaultMode: 0440
            items: [{key: {{ $g.control.tokenKey | quote }}, path: access-token}]

---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-toolgate.gatewayLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "olo-toolgate.gatewaySelector" . | nindent 4 }}
  ports:
    - {name: runtime, port: 8081, targetPort: runtime}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-metrics
  labels:
    {{- include "olo-toolgate.gatewayLabels" . | nindent 4 }}
    toolgate-metrics: gateway
spec:
  type: ClusterIP
  selector:
    {{- include "olo-toolgate.gatewaySelector" . | nindent 4 }}
  ports:
    - {name: management, port: 9091, targetPort: management}
{{- if $g.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels:
      {{- include "olo-toolgate.gatewaySelector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    - ports: [{protocol: TCP, port: {{ $g.control.controlPort }}}]
      to:
        {{- toYaml $g.networkPolicy.controlTo | nindent 8 }}
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
      to:
        {{- toYaml $g.networkPolicy.dnsTo | nindent 8 }}
  {{- if or $g.networkPolicy.runtimeFrom $g.networkPolicy.managementFrom }}
  ingress:
    {{- if $g.networkPolicy.runtimeFrom }}
    - ports: [{protocol: TCP, port: 8081}]
      from:
        {{- toYaml $g.networkPolicy.runtimeFrom | nindent 8 }}
    {{- end }}
    {{- if $g.networkPolicy.managementFrom }}
    - ports: [{protocol: TCP, port: 9091}]
      from:
        {{- toYaml $g.networkPolicy.managementFrom | nindent 8 }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
{{- if $g.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  minAvailable: {{ $g.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "olo-toolgate.gatewaySelector" . | nindent 6 }}
{{- end }}
{{- if $g.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $name }}}
  minReplicas: {{ $g.autoscaling.minReplicas }}
  maxReplicas: {{ $g.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $g.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
{{- if $g.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  {{- with $g.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "gateway.ingress.className required" $g.ingress.className | quote }}
  tls:
    - hosts: [{{ $g.ingress.host | quote }}]
      secretName: {{ required "gateway.ingress.tlsSecret required" $g.ingress.tlsSecret | quote }}
  rules:
    - host: {{ $g.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port: {name: runtime}
{{- end }}
{{- if $g.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-toolgate.gatewayLabels" . | nindent 4 }}
    {{- with $g.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {toolgate-metrics: gateway, app.kubernetes.io/instance: {{ .Release.Name }}}
  endpoints:
    - {port: management, path: /v1/metrics, interval: {{ $g.serviceMonitor.interval | quote }}}
{{- end }}
{{- end }}
