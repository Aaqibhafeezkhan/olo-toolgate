{{/* Copyright 2026 OLO Labs; SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.control.enabled }}
{{- $g := .Values.control }}
{{- $name := include "olo-toolgate.controlName" . }}
{{- $c := $g.clientCheckIn }}
{{- if gt (add (int $c.checkInMs) (div (mul (int $c.checkInMs) (int $c.jitterPct)) 100) 5000) 30000 }}{{ fail "control.clientCheckIn: check-in plus jitter plus 5 s must fit the 30 s sync deadline" }}{{ end }}
{{- if le (int $g.terminationGracePeriodSeconds) 20 }}{{ fail "termination grace must exceed application drain deadline" }}{{ end }}
{{- if and $g.autoscaling.enabled (gt (int $g.autoscaling.minReplicas) (int $g.autoscaling.maxReplicas)) }}{{ fail "HPA minimum must not exceed maximum" }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-toolgate.controlLabels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-toolgate.controlLabels" . | nindent 4 }}
data:
  QUARKUS_DATASOURCE_JDBC_URL: {{ printf "jdbc:postgresql://%s:%v/%s?sslmode=%s&sslrootcert=/etc/toolgate/database/ca.crt" $g.database.host $g.database.port $g.database.name $g.database.sslMode | quote }}
  MP_JWT_VERIFY_ISSUER: {{ $g.jwt.issuer | quote }}
  MP_JWT_VERIFY_AUDIENCES: {{ $g.jwt.audience | quote }}
  TOOLGATE_CONTROL_DEVELOPMENT_MODE: {{ $g.developmentMode | quote }}
  TOOLGATE_CONTROL_MAX_RECORDS: {{ printf "%d" (int $g.limits.maxRecords) | quote }}
  TOOLGATE_CONTROL_MAX_CONFIG_BYTES: {{ printf "%d" (int $g.limits.maxConfigBytes) | quote }}
  TOOLGATE_CONTROL_TRACE_EXPORT_ENABLED: {{ $g.tracing.enabled | quote }}
  QUARKUS_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ printf "https://%s:%v" $g.tracing.host $g.tracing.port | quote }}
  QUARKUS_OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: {{ $g.tracing.protocol | quote }}
  TOOLGATE_CONTROL_EFFECT_ENABLED: {{ $g.effect.enabled | quote }}
  {{- if $g.effect.enabled }}
  TOOLGATE_CONTROL_EFFECT_PRIVATE_KEY_PATH: /etc/toolgate/effect-signing/private.pem
  TOOLGATE_CONTROL_EFFECT_KEY_ID: {{ $g.effect.keyId | quote }}
  TOOLGATE_CONTROL_EFFECT_ISSUER: {{ $g.effect.issuer | quote }}
  TOOLGATE_CONTROL_EFFECT_AUDIENCE: {{ $g.effect.audience | quote }}
  {{- end }}
  {{- if $g.recovery.enabled }}
  TOOLGATE_CONTROL_RECOVERY_PACKET_PATH: /etc/toolgate/recovery-packet/reviewed-recovery.json
  TOOLGATE_CONTROL_RECOVERY_TRUST_PATH: /etc/toolgate/recovery-trust/reviewer-keys.json
  {{- end }}
  TOOLGATE_CONTROL_APPROVAL_ENABLED: {{ $g.approval.enabled | quote }}
  TOOLGATE_CONTROL_MARKETPLACE_ENABLED: {{ $g.marketplace.enabled | quote }}
  {{- if $g.marketplace.enabled }}
  TOOLGATE_CONTROL_MARKETPLACE_ID: {{ required "control.marketplace.id required" $g.marketplace.id | quote }}
  TOOLGATE_CONTROL_MARKETPLACE_BASE_URL: {{ required "control.marketplace.baseUrl required" $g.marketplace.baseUrl | quote }}
  TOOLGATE_CONTROL_MARKETPLACE_KEYS: {{ required "control.marketplace.keys required" $g.marketplace.keys | quote }}
  {{- if $g.marketplace.caSecret }}
  TOOLGATE_CONTROL_MARKETPLACE_CA_PATH: /etc/toolgate/marketplace-ca/ca.pem
  {{- end }}
  {{- end }}
  TOOLGATE_CONTROL_FLEET_ENABLED: {{ $g.fleet.enabled | quote }}
  {{- if $g.fleet.enabled }}
  TOOLGATE_CONTROL_FLEET_KEY_ID: {{ required "control.fleet.keyId required" $g.fleet.keyId | quote }}
  TOOLGATE_CONTROL_FLEET_PRIVATE_KEY_PATH: /etc/toolgate/fleet-signing/private.pem
  TOOLGATE_CONTROL_FLEET_RELEASE_KEYS_PATH: /etc/toolgate/fleet-trust/release.json
  TOOLGATE_CONTROL_FLEET_ORGANIZATION_KEYS_PATH: /etc/toolgate/fleet-trust/organization.json
  TOOLGATE_CONTROL_FLEET_ARTIFACT_ORIGIN: {{ required "control.fleet.artifactOrigin required" $g.fleet.artifactOrigin | quote }}
  {{- if $g.fleet.artifactSecret }}
  TOOLGATE_CONTROL_FLEET_ARTIFACT_TOKEN_PATH: /etc/toolgate/artifact-store/token
  TOOLGATE_CONTROL_FLEET_ARTIFACT_CA_PATH: /etc/toolgate/artifact-store/ca.pem
  {{- end }}
  {{- end }}
  TOOLGATE_CONTROL_ENDPOINT_ENABLED: {{ $g.endpoint.enabled | quote }}
  TOOLGATE_CONTROL_CLIENT_CHECKIN_MS: {{ printf "%d" (int $c.checkInMs) | quote }}
  TOOLGATE_CONTROL_CLIENT_CHECKIN_JITTER_PCT: {{ printf "%d" (int $c.jitterPct) | quote }}
  {{- if gt (int $c.offlineAfterMs) 0 }}
  TOOLGATE_CONTROL_CLIENT_OFFLINE_AFTER_MS: {{ printf "%d" (int $c.offlineAfterMs) | quote }}
  {{- end }}
  TOOLGATE_CLIENT_DOWNLOADS_DIRECTORY: {{ ternary "/opt/toolgate/client-downloads" "" $g.clientDownloads.enabled | quote }}
  {{- if $g.endpoint.enabled }}
  TOOLGATE_CONTROL_ENDPOINT_TENANT_ID: {{ required "control.endpoint.tenantId required" $g.endpoint.tenantId | quote }}
  TOOLGATE_CONTROL_ENDPOINT_SERVER_ID: {{ required "control.endpoint.serverId required" $g.endpoint.serverId | quote }}
  TOOLGATE_CONTROL_ENDPOINT_ORGANIZATION: {{ required "control.endpoint.organization required" $g.endpoint.organization | quote }}
  TOOLGATE_CONTROL_ENDPOINT_CONTROL_URL: {{ required "control.endpoint.controlUrl required" $g.endpoint.controlUrl | quote }}
  TOOLGATE_CONTROL_ENDPOINT_GATEWAY_URL: {{ required "control.endpoint.gatewayUrl required" $g.endpoint.gatewayUrl | quote }}
  TOOLGATE_CONTROL_ENDPOINT_PRIVATE_KEY_PATH: /etc/toolgate/device-ca/private.pem
  TOOLGATE_CONTROL_ENDPOINT_CA_CERTIFICATE_PATH: /etc/toolgate/device-ca/ca.pem
  QUARKUS_HTTP_INSECURE_REQUESTS: disabled
  QUARKUS_HTTP_SSL_PORT: "8082"
  QUARKUS_HTTP_SSL_CLIENT_AUTH: request
  QUARKUS_HTTP_SSL_CERTIFICATE_FILES: /etc/toolgate/server-tls/tls.crt
  QUARKUS_HTTP_SSL_CERTIFICATE_KEY_FILES: /etc/toolgate/server-tls/tls.key
  QUARKUS_HTTP_SSL_CERTIFICATE_TRUST_STORE_FILE: /etc/toolgate/device-trust/truststore.p12
  QUARKUS_HTTP_SSL_CERTIFICATE_TRUST_STORE_FILE_TYPE: PKCS12
  {{- end }}
  TOOLGATE_CONTROL_APPROVAL_PENDING_TTL_MS: {{ printf "%d" (int $g.approval.pendingTtlMs) | quote }}
  TOOLGATE_CONTROL_APPROVAL_MAX_ACTIVE: {{ printf "%d" (int $g.approval.maxActive) | quote }}
  TOOLGATE_CONTROL_APPROVAL_MAX_ACTIVE_PERMITS: {{ printf "%d" (int $g.approval.maxActivePermits) | quote }}
  TOOLGATE_CONTROL_BUNDLE_ENABLED: {{ $g.bundle.enabled | quote }}
  TOOLGATE_CONTROL_BUNDLE_ISSUER: {{ $g.bundle.issuer | quote }}
  TOOLGATE_CONTROL_BUNDLE_AUDIENCE: {{ $g.bundle.audience | quote }}
  {{- if $g.bundle.enabled }}
  TOOLGATE_CONTROL_BUNDLE_KEY_ID: {{ $g.bundle.keyId | quote }}
  TOOLGATE_CONTROL_BUNDLE_PRIVATE_KEY_PATH: /etc/toolgate/bundle-signing/private.pem
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-toolgate.controlLabels" . | nindent 4 }}
spec:
  {{- if not $g.autoscaling.enabled }}
  replicas: {{ $g.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "olo-toolgate.controlSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "olo-toolgate.controlSelector" . | nindent 8 }}
      annotations:
        checksum/config: {{ $g | toJson | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $g.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml $g.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $g.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $g.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $g.topologySpreadConstraints | nindent 8 }}
      {{- else }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "olo-toolgate.controlSelector" . | nindent 14 }}
      {{- end }}
      containers:
        - name: control
          {{- if $g.image.digest }}
          image: {{ printf "%s/%s@%s" .Values.global.imageRegistry $g.image.repository $g.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s/%s:%s" .Values.global.imageRegistry $g.image.repository ($g.image.tag | default .Chart.AppVersion) | quote }}
          {{- end }}
          imagePullPolicy: {{ $g.image.pullPolicy }}
          securityContext:
            {{- toYaml $g.securityContext | nindent 12 }}
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          ports:
            - {name: runtime, containerPort: 8082}
            - {name: management, containerPort: 9092}
          envFrom:
            - configMapRef: {name: {{ $name }}}
          env:
            {{- if $g.endpoint.enabled }}
            - name: QUARKUS_HTTP_SSL_CERTIFICATE_TRUST_STORE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ required "control.endpoint.trustStoreSecret required" $g.endpoint.trustStoreSecret | quote }}, key: password}
            {{- end }}
            - {name: MP_JWT_VERIFY_PUBLICKEY_LOCATION, value: /etc/toolgate/identity/public.pem}
            {{- range $env, $key := dict "QUARKUS_DATASOURCE_USERNAME" "username" "QUARKUS_DATASOURCE_PASSWORD" "password" "QUARKUS_FLYWAY_USERNAME" "migrationUsername" "QUARKUS_FLYWAY_PASSWORD" "migrationPassword" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef: {name: {{ $g.database.credentialsSecret | quote }}, key: {{ $key }}}
            {{- end }}
          startupProbe:
            httpGet: {path: /q/health/live, port: management}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /q/health/ready, port: management}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /q/health/live, port: management}
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            {{- if $g.effect.enabled }}
            - {name: effect-signing, mountPath: /etc/toolgate/effect-signing, readOnly: true}
            {{- end }}
            {{- if $g.recovery.enabled }}
            - {name: recovery-packet, mountPath: /etc/toolgate/recovery-packet, readOnly: true}
            - {name: recovery-trust, mountPath: /etc/toolgate/recovery-trust, readOnly: true}
            {{- end }}
            {{- if and $g.marketplace.enabled $g.marketplace.caSecret }}
            - {name: marketplace-ca, mountPath: /etc/toolgate/marketplace-ca, readOnly: true}
            {{- end }}
            {{- if $g.fleet.enabled }}
            - {name: fleet-signing, mountPath: /etc/toolgate/fleet-signing, readOnly: true}
            - {name: fleet-trust, mountPath: /etc/toolgate/fleet-trust, readOnly: true}
            {{- if $g.fleet.artifactSecret }}
            - {name: artifact-store, mountPath: /etc/toolgate/artifact-store, readOnly: true}
            {{- end }}
            {{- end }}
            - {name: identity, mountPath: /etc/toolgate/identity, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if $g.endpoint.enabled }}
            - {name: device-ca, mountPath: /etc/toolgate/device-ca, readOnly: true}
            - {name: server-tls, mountPath: /etc/toolgate/server-tls, readOnly: true}
            - {name: device-trust, mountPath: /etc/toolgate/device-trust, readOnly: true}
            {{- end }}
            {{- if $g.bundle.enabled }}
            - {name: bundle-signing, mountPath: /etc/toolgate/bundle-signing, readOnly: true}
            {{- end }}
            {{- if eq $g.database.sslMode "verify-full" }}
            - {name: database-ca, mountPath: /etc/toolgate/database, readOnly: true}
            {{- end }}
      volumes:
        {{- if $g.effect.enabled }}
        - name: effect-signing
          secret:
            secretName: {{ required "control.effect.signingSecret required" $g.effect.signingSecret | quote }}
            defaultMode: 0440
            items: [{key: {{ $g.effect.signingKey | quote }}, path: private.pem}]
        {{- end }}
        {{- if $g.recovery.enabled }}
        - name: recovery-packet
          secret:
            secretName: {{ required "control.recovery.packetSecret required" $g.recovery.packetSecret | quote }}
            defaultMode: 0440
            items: [{key: {{ $g.recovery.packetKey | quote }}, path: reviewed-recovery.json}]
        - name: recovery-trust
          secret:
            secretName: {{ required "control.recovery.trustSecret required" $g.recovery.trustSecret | quote }}
            defaultMode: 0440
            items: [{key: {{ $g.recovery.trustKey | quote }}, path: reviewer-keys.json}]
        {{- end }}
        {{- if and $g.marketplace.enabled $g.marketplace.caSecret }}
        - name: marketplace-ca
          secret:
            secretName: {{ $g.marketplace.caSecret | quote }}
            defaultMode: 0440
            items: [{key: ca.pem, path: ca.pem}]
        {{- end }}
        {{- if $g.fleet.enabled }}
        - name: fleet-signing
          secret:
            secretName: {{ required "control.fleet.signingSecret required" $g.fleet.signingSecret | quote }}
            defaultMode: 0440
            items: [{key: private.pem, path: private.pem}]
        - name: fleet-trust
          secret:
            secretName: {{ required "control.fleet.trustSecret required" $g.fleet.trustSecret | quote }}
            defaultMode: 0440
            items: [{key: release.json, path: release.json}, {key: organization.json, path: organization.json}]
        {{- if $g.fleet.artifactSecret }}
        - name: artifact-store
          secret:
            secretName: {{ $g.fleet.artifactSecret | quote }}
            defaultMode: 0440
            items: [{key: token, path: token}, {key: ca.pem, path: ca.pem}]
        {{- end }}
        {{- end }}
        {{- if $g.endpoint.enabled }}
        - name: device-ca
          secret:
            secretName: {{ required "control.endpoint.deviceCaSecret required" $g.endpoint.deviceCaSecret | quote }}
            defaultMode: 0440
            items: [{key: private.pem, path: private.pem}, {key: ca.pem, path: ca.pem}]
        - name: server-tls
          secret:
            secretName: {{ required "control.endpoint.tlsSecret required" $g.endpoint.tlsSecret | quote }}
            defaultMode: 0440
            items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
        - name: device-trust
          secret:
            secretName: {{ required "control.endpoint.trustStoreSecret required" $g.endpoint.trustStoreSecret | quote }}
            defaultMode: 0440
            items: [{key: truststore.p12, path: truststore.p12}]
        {{- end }}
        - name: identity
          secret:
            secretName: {{ required "control.publicKeySecret required" $g.publicKeySecret | quote }}
            defaultMode: 0444
            items: [{key: {{ $g.publicKeyKey | quote }}, path: public.pem}]
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        {{- if $g.bundle.enabled }}
        - name: bundle-signing
          secret:
            secretName: {{ required "control.bundle.signingSecret required" $g.bundle.signingSecret | quote }}
            defaultMode: 0440
            items: [{key: {{ $g.bundle.signingKey | quote }}, path: private.pem}]
        {{- end }}
        {{- if eq $g.database.sslMode "verify-full" }}
        - name: database-ca
          secret:
            secretName: {{ required "control.database.caSecret required" $g.database.caSecret | quote }}
            defaultMode: 0444
            items: [{key: {{ $g.database.caKey | quote }}, path: ca.crt}]
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-toolgate.controlLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "olo-toolgate.controlSelector" . | nindent 4 }}
  ports:
    - {name: runtime, port: 8082, targetPort: runtime}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-metrics
  labels:
    {{- include "olo-toolgate.controlLabels" . | nindent 4 }}
    toolgate-metrics: control
spec:
  type: ClusterIP
  selector:
    {{- include "olo-toolgate.controlSelector" . | nindent 4 }}
  ports:
    - {name: management, port: 9092, targetPort: management}
{{- if $g.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
spec:
  podSelector:
    matchLabels:
      {{- include "olo-toolgate.controlSelector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if or $g.networkPolicy.databaseTo $g.networkPolicy.dnsTo (and $g.tracing.enabled $g.networkPolicy.collectorTo) (and $g.fleet.enabled $g.networkPolicy.artifactTo) (and $g.marketplace.enabled $g.networkPolicy.marketplaceTo) }}
  egress:
    {{- if and $g.marketplace.enabled $g.networkPolicy.marketplaceTo }}
    - ports: [{protocol: TCP, port: 443}]
      to:
        {{- toYaml $g.networkPolicy.marketplaceTo | nindent 8 }}
    {{- end }}
    {{- if and $g.fleet.enabled $g.networkPolicy.artifactTo }}
    - ports: [{protocol: TCP, port: {{ $g.fleet.artifactPort }}}]
      to:
        {{- toYaml $g.networkPolicy.artifactTo | nindent 8 }}
    {{- end }}
    {{- if $g.networkPolicy.databaseTo }}
    - ports: [{protocol: TCP, port: {{ $g.database.port }}}]
      to:
        {{- toYaml $g.networkPolicy.databaseTo | nindent 8 }}
    {{- end }}
    {{- if $g.networkPolicy.dnsTo }}
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
      to:
        {{- toYaml $g.networkPolicy.dnsTo | nindent 8 }}
    {{- end }}
    {{- if and $g.tracing.enabled $g.networkPolicy.collectorTo }}
    - ports: [{protocol: TCP, port: {{ $g.tracing.port }}}]
      to:
        {{- toYaml $g.networkPolicy.collectorTo | nindent 8 }}
    {{- end }}
  {{- else }}
  egress: []
  {{- end }}
  {{- if or $g.networkPolicy.runtimeFrom $g.networkPolicy.managementFrom }}
  ingress:
    {{- if $g.networkPolicy.runtimeFrom }}
    - ports: [{protocol: TCP, port: 8082}]
      from:
        {{- toYaml $g.networkPolicy.runtimeFrom | nindent 8 }}
    {{- end }}
    {{- if $g.networkPolicy.managementFrom }}
    - ports: [{protocol: TCP, port: 9092}]
      from:
        {{- toYaml $g.networkPolicy.managementFrom | nindent 8 }}
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
{{- if $g.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  minAvailable: {{ $g.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "olo-toolgate.controlSelector" . | nindent 6 }}
{{- end }}
{{- if $g.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ $name }}}
  minReplicas: {{ $g.autoscaling.minReplicas }}
  maxReplicas: {{ $g.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ $g.autoscaling.targetCPUUtilizationPercentage }}}
{{- end }}
{{- if $g.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  {{- with $g.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ required "control.ingress.className required" $g.ingress.className | quote }}
  tls:
    - hosts: [{{ $g.ingress.host | quote }}]
      secretName: {{ required "control.ingress.tlsSecret required" $g.ingress.tlsSecret | quote }}
  rules:
    - host: {{ $g.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port: {name: runtime}
{{- end }}
{{- if $g.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $name }}
  labels:
    {{- include "olo-toolgate.controlLabels" . | nindent 4 }}
    {{- with $g.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {toolgate-metrics: control, app.kubernetes.io/instance: {{ .Release.Name }}}
  endpoints:
    - {port: management, path: /q/metrics, interval: {{ $g.serviceMonitor.interval | quote }}}
{{- end }}
{{- end }}
