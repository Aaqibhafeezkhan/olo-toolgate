\* Exhaustive, HALT: every core fault combined (crash, failover with a still-running old holder, reinstallation,
\* message loss and duplication) at 2 items.
CONSTANTS
    Exec = {e1, e2}
    N = 2
    Bad = {2}
    Policy = "HALT"
    MaxEpoch = 2
    MaxCrash = 1
    MaxDrop = 1
    MaxPurge = 0
    AllowDistrust = FALSE
    AllowUpgrade = FALSE
    AllowRemove = FALSE
    MaxInFlight = 6
SPECIFICATION Spec
CONSTRAINT InFlight
SYMMETRY ExecSymmetry
INVARIANTS TypeOK S1 S3 S4 L A C D P2 F M X I Q
PROPERTIES P R
CHECK_DEADLOCK FALSE
