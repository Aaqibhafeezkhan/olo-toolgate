\* Exhaustive liveness: every item is eventually stored under fair scheduling, across crashes and message loss.
CONSTANTS
    Exec = {e1, e2}
    N = 2
    Bad = {}
    Policy = "SKIP"
    MaxEpoch = 1
    MaxCrash = 1
    MaxDrop = 1
    MaxPurge = 0
    AllowDistrust = FALSE
    AllowUpgrade = FALSE
    AllowRemove = FALSE
    MaxInFlight = 6
SPECIFICATION FairSpec
CONSTRAINT InFlight
PROPERTY EventuallyStored
CHECK_DEADLOCK FALSE
