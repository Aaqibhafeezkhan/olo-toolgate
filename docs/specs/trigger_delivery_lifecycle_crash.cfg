\* Exhaustive: lifecycle faults with process crashes and message loss, one epoch.
CONSTANTS
    Exec = {e1, e2}
    N = 2
    Bad = {}
    Policy = "SKIP"
    MaxEpoch = 1
    MaxCrash = 1
    MaxDrop = 1
    MaxPurge = 1
    AllowDistrust = TRUE
    AllowUpgrade = TRUE
    AllowRemove = TRUE
    MaxInFlight = 6
SPECIFICATION Spec
CONSTRAINT InFlight
SYMMETRY ExecSymmetry
INVARIANTS TypeOK S1 S3 S4 L A C D P2 F M X I Q
PROPERTIES P R
CHECK_DEADLOCK FALSE
