name: Publish Maven contracts
'on':
  workflow_call:
    inputs:
      manual:
        type: boolean
        default: false
        description: Consume manual build artifacts instead of verified CI artifacts
permissions:
  contents: read
jobs:
  publish:
    name: Publish Maven contracts
    if: github.ref == 'refs/heads/main' || (!inputs.manual && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: development-release
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ${{ inputs.manual && 'manual-development-libraries' || 'verified-release-packages' }}
        path: ${{ inputs.manual && 'build/manual-development/assets' || 'build/development' }}
    - name: Publish versioned Maven contracts
      env:
        MAVEN_REPOSITORY_URL: ${{ vars.MAVEN_REPOSITORY_URL || format('https://maven.pkg.github.com/{0}', github.repository) }}
        DEFAULT_MAVEN_URL: ${{ format('https://maven.pkg.github.com/{0}', github.repository) }}
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        GH_TOKEN: ${{ github.token }}
        MANUAL_RELEASE: ${{ inputs.manual }}
      run: |
        python tools/release/development.py validate-maven
        if [ "$MAVEN_REPOSITORY_URL" = "$DEFAULT_MAVEN_URL" ]; then
          export MAVEN_USERNAME="${MAVEN_USERNAME:-$GITHUB_ACTOR}"
          export MAVEN_PASSWORD="${MAVEN_PASSWORD:-$GH_TOKEN}"
        elif [ -z "$MAVEN_USERNAME" ] || [ -z "$MAVEN_PASSWORD" ]; then
          echo 'Custom Maven repository requires MAVEN_USERNAME and MAVEN_PASSWORD secrets'
          exit 1
        fi
        if [ "$MANUAL_RELEASE" != true ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
          python tools/release/development.py publish-maven
        else
          if [ "$MANUAL_RELEASE" = true ]; then
            maven_version="$(python -c 'import json; print(json.load(open("build/manual-development/assets/development-release.json"))["libraryVersion"])')"
            assets=build/manual-development/assets
            pom="$assets/toolgate-contracts-$maven_version.pom"
          else
            maven_version="$(cat build/development/MAVEN_VERSION)"
            ./gradlew --no-daemon "-PcontractsPublicationVersion=$maven_version" :contracts-java:assemble :contracts-java:generatePomFileForMavenJavaPublication -x test
            assets=packages/contracts/java/build/libs
            pom=packages/contracts/java/build/publications/mavenJava/pom-default.xml
          fi
          python tools/release/maven.py --assets "$assets" --version "$maven_version" --pom "$pom"
        fi
