name: Publish release images, Helm and GitHub assets
'on':
  workflow_call:
    inputs:
      selection_artifact_id:
        type: string
        default: ''
        description: Immutable selection artifact ID emitted by the trusted manual controller
      manual:
        type: boolean
        default: false
        description: Consume manual build artifacts instead of verified CI artifacts
permissions:
  contents: read
jobs:
  publish:
    name: Publish images, Helm and GitHub release
    if: github.ref == 'refs/heads/main' || (!inputs.manual && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: development-release
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install Helm for tagged publication
      if: ${{ !inputs.manual && startsWith(github.ref, 'refs/tags/') }}
      run: |
        curl --fail --location --proto '=https' -o helm-v3.17.3-linux-amd64.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
        curl --fail --location --proto '=https' -o helm.sha256 https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
        sha256sum --check helm.sha256
        tar -xzf helm-v3.17.3-linux-amd64.tar.gz
        sudo install linux-amd64/helm /usr/local/bin/helm
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ${{ inputs.manual && 'manual-development-assets' || 'verified-release-packages' }}
        path: ${{ inputs.manual && 'build/manual-development/assets' || 'build/development' }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ${{ inputs.manual && 'manual-development-images' || 'verified-release-images' }}
        path: ${{ inputs.manual && 'build/manual-development' || 'build/development' }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.manual }}
      with:
        artifact-ids: ${{ inputs.selection_artifact_id }}
        merge-multiple: true
        path: build/manual-development/selection
    - name: Publish tested images and development prerelease
      id: push
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_SHA: ${{ github.sha }}
        DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        MANUAL_RELEASE: ${{ inputs.manual }}
      run: |
        if [ "$MANUAL_RELEASE" = true ]; then
          docker load --input build/manual-development/images.tar
          python tools/release/manual_development.py publish
        else
          python tools/release/development.py publish
        fi
    - name: Attest Control image
      if: ${{ !inputs.manual && startsWith(github.ref, 'refs/tags/') }}
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.push.outputs.control_image }}
        subject-digest: ${{ steps.push.outputs.control_digest }}
        push-to-registry: true
    - name: Attest Gateway image
      if: ${{ !inputs.manual && startsWith(github.ref, 'refs/tags/') }}
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.push.outputs.gateway_image }}
        subject-digest: ${{ steps.push.outputs.gateway_digest }}
        push-to-registry: true
    - name: Attest Quickstart image
      if: ${{ !inputs.manual && startsWith(github.ref, 'refs/tags/') }}
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.push.outputs.quickstart_image }}
        subject-digest: ${{ steps.push.outputs.quickstart_digest }}
        push-to-registry: true
    - name: Attest Device image
      if: ${{ !inputs.manual && startsWith(github.ref, 'refs/tags/') }}
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.push.outputs.device_image }}
        subject-digest: ${{ steps.push.outputs.device_digest }}
        push-to-registry: true
    - name: Attest secured Device image
      if: ${{ !inputs.manual && startsWith(github.ref, 'refs/tags/') }}
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.push.outputs.secured_device_image }}
        subject-digest: ${{ steps.push.outputs.secured_device_digest }}
        push-to-registry: true
    - name: Attest versioned release assets and SBOMs
      if: ${{ !inputs.manual && startsWith(github.ref, 'refs/tags/') }}
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-path: build/development/assets/*
    - name: Create immutable tagged GitHub release after provenance
      if: ${{ !inputs.manual && startsWith(github.ref, 'refs/tags/') }}
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_SHA: ${{ github.sha }}
      run: python tools/release/development.py finalize
