name: endpoint-client
permissions:
  contents: read
  pull-requests: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          binary: olo-toolgate-client
        - runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          binary: olo-toolgate-client
        - runner: windows-2025
          target: x86_64-pc-windows-msvc
          binary: olo-toolgate-client.exe
        - runner: windows-11-arm
          target: aarch64-pc-windows-msvc
          binary: olo-toolgate-client.exe
        - runner: macos-15-intel
          target: x86_64-apple-darwin
          binary: olo-toolgate-client
        - runner: macos-15
          target: aarch64-apple-darwin
          binary: olo-toolgate-client
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TOOLGATE_RELEASE_BUILD: ${{ inputs.build_number }}
      TOOLGATE_QUALIFICATION_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.development_source }}
      with:
        name: manual-development-source
        path: .
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
        # Windows ARM runs native ARM64 Rust/services; x64 Python supplies the fixture's published crypto wheels.
        architecture: ${{ startsWith(matrix.target, 'aarch64') && runner.os != 'Windows' && 'arm64' || 'x64' }}
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - name: Install pinned discovery fixture dependency
      if: ${{ inputs.run_tests }}
      run: python -m pip install cryptography==50.0.1
    - name: Verify native target and source
      shell: bash
      env:
        NATIVE_TARGET: ${{ matrix.target }}
        SHARED_CHECKS: ${{ inputs.shared_checks }}
      run: |
        rustup show
        test "$(rustc -vV | sed -n 's/^host: //p')" = "$NATIVE_TARGET"
        # Linux x64 workspace tests/lint belong to foundation; other targets retain native checks.
        if [ "$SHARED_CHECKS" != true ]; then cargo fmt --all --check; fi
        if [ "$SHARED_CHECKS" != true ] || [ "$NATIVE_TARGET" != x86_64-unknown-linux-gnu ]; then
          cargo clippy -p olo-toolgate-client --all-targets --locked -- -D warnings
          cargo test -p olo-toolgate-client --locked
        fi
      if: ${{ inputs.run_tests }}
    - name: Build native client and browser host
      run: cargo build -p olo-toolgate-client -p toolgate-cli -p olo-toolgate-tool-host --release --locked --bins
    - name: Verify compiled client and authoring CLI versions
      shell: bash
      env:
        NATIVE_BINARY: ${{ matrix.binary }}
      run: |
        expected="$(cat VERSION)"
        test "$("target/release/$NATIVE_BINARY" version)" = "$expected"
        cli=toolgate
        if [ "$RUNNER_OS" = Windows ]; then cli=toolgate.exe; fi
        test "$("target/release/$cli" --version)" = "toolgate $expected"
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      if: inputs.run_tests && matrix.target == 'x86_64-unknown-linux-gnu'
      with:
        distribution: temurin
        java-version: '21'
    - name: Prove Java and Python Hello World run on pinned bases under the client sandbox
      if: inputs.run_tests && matrix.target == 'x86_64-unknown-linux-gnu'
      run: |
        python -m pip install -r tools/requirements.txt
        python tools/client/runtime_check.py --cli target/release/toolgate
    - name: Prove system service lifetime after installer and CLI exit
      shell: bash
      env:
        NATIVE_BINARY: ${{ matrix.binary }}
      run: python tools/client/service_smoke.py --binary "target/release/$NATIVE_BINARY"
      if: ${{ inputs.run_tests }}
    - name: Assemble native release package
      shell: bash
      env:
        NATIVE_TARGET: ${{ matrix.target }}
        NATIVE_BINARY: ${{ matrix.binary }}
      run: python tools/client/package.py --target "$NATIVE_TARGET" --binary "target/release/$NATIVE_BINARY"
    - name: Install pinned Windows installer compiler
      if: runner.os == 'Windows'
      shell: powershell
      run: ./tools/client/installer-compiler.ps1
    - name: Build unsigned interactive installer
      shell: bash
      env:
        NATIVE_TARGET: ${{ matrix.target }}
        TOOLGATE_CHROME_STORE_URL: ${{ vars.TOOLGATE_CHROME_STORE_URL }}
      run: python tools/client/installer.py --target "$NATIVE_TARGET"
    - name: Prove packaged installer starts the system service
      shell: bash
      env:
        NATIVE_TARGET: ${{ matrix.target }}
      run: python tools/client/installer_smoke.py --target "$NATIVE_TARGET"
      if: ${{ inputs.run_tests }}
    - name: Verify registered Windows uninstall selection
      if: inputs.run_tests && runner.os == 'Windows'
      shell: powershell
      run: ./tools/client/uninstall_test.ps1
    - name: Retain native qualification evidence
      if: ${{ inputs.run_tests }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-qualification-${{ matrix.target }}
        path: build/client/qualification/
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: endpoint-client-${{ matrix.target }}
        path: build/client/release/
        if-no-files-found: error
  public-bundle:
    needs: native
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.development_source }}
      with:
        name: manual-development-source
        path: .
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: endpoint-client-*
        path: build/client/release
        merge-multiple: true
    - name: Assemble anonymous client download manifest
      run: python tools/client/manifest.py
    - name: Package Chrome Connect extension
      env:
        TOOLGATE_CHROME_STORE_URL: ${{ vars.TOOLGATE_CHROME_STORE_URL }}
      run: |
        python tools/client/extension.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: public-client-bundle
        path: deploy/client-assets/release/
        if-no-files-found: error
'on':
  workflow_call:
    inputs:
      development_source:
        type: boolean
        default: false
        description: Apply the same-run stamped development source overlay before building
      build_number:
        type: string
        default: ''
        description: Allocated release build embedded in native build information
      source_sha:
        type: string
        default: ''
        description: Source commit pinned by the calling workflow
      shared_checks:
        type: boolean
        default: false
        description: Foundation owns shared format and Linux x64 workspace test/lint gates
      run_tests:
        type: boolean
        default: true
        description: Run native tests and smoke gates before packaging; false is manual build only
