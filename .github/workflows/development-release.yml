name: Verified publication
permissions:
  contents: read
  pull-requests: read
jobs:
  prepare:
    name: Prepare verified publication artifacts
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: development-release
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Verify CI and collect the exact tested release artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_SHA: ${{ github.sha }}
        DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/development.py prepare --run-id "$GITHUB_RUN_ID"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: verified-release-packages
        path: |
          build/development/assets/
          build/development/foundation/
          build/development/MAVEN_VERSION
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: verified-release-images
        path: |
          build/development/control/
          build/development/gateway/
          build/development/quickstart/
          build/development/device/
          build/development/secured_device/
        compression-level: 1
        if-no-files-found: error
  publish:
    name: Publish images, Helm and GitHub release
    needs: prepare
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-images.yml
    secrets: inherit
    with:
      manual: false
# Maven publication is disconnected pending the release-only pipeline.
# The reusable implementation remains in release-maven.yml.
'on':
  workflow_call: null
