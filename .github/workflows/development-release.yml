name: Verified publication
permissions:
  contents: read
  pull-requests: read
jobs:
  prepare:
    name: Prepare verified publication artifacts
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: development-release
    permissions:
      actions: read
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Verify CI and collect the exact tested release artifacts
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_SHA: ${{ github.sha }}
        DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        python tools/release/development.py prepare --run-id "$GITHUB_RUN_ID"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: verified-release-packages
        path: |
          build/development/assets/
          build/development/foundation/
          build/development/MAVEN_VERSION
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: verified-release-images
        path: |
          build/development/control/
          build/development/gateway/
          build/development/quickstart/
          build/development/device/
          build/development/secured_device/
        compression-level: 1
        if-no-files-found: error
  publish:
    name: Publish images, Helm and GitHub release
    needs: prepare
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: development-release
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install Helm for tagged publication
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        curl --fail --location --proto '=https' -o helm-v3.17.3-linux-amd64.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
        curl --fail --location --proto '=https' -o helm.sha256 https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
        sha256sum --check helm.sha256
        tar -xzf helm-v3.17.3-linux-amd64.tar.gz
        sudo install linux-amd64/helm /usr/local/bin/helm
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: verified-release-packages
        path: build/development
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: verified-release-images
        path: build/development
    - name: Publish tested images and development prerelease
      id: push
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_SHA: ${{ github.sha }}
        DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: python tools/release/development.py publish
    - name: Attest Control image
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.push.outputs.control_image }}
        subject-digest: ${{ steps.push.outputs.control_digest }}
        push-to-registry: true
    - name: Attest Gateway image
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.push.outputs.gateway_image }}
        subject-digest: ${{ steps.push.outputs.gateway_digest }}
        push-to-registry: true
    - name: Attest Quickstart image
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.push.outputs.quickstart_image }}
        subject-digest: ${{ steps.push.outputs.quickstart_digest }}
        push-to-registry: true
    - name: Attest Device image
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.push.outputs.device_image }}
        subject-digest: ${{ steps.push.outputs.device_digest }}
        push-to-registry: true
    - name: Attest secured Device image
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.push.outputs.secured_device_image }}
        subject-digest: ${{ steps.push.outputs.secured_device_digest }}
        push-to-registry: true
    - name: Attest versioned release assets and SBOMs
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-path: build/development/assets/*
    - name: Create immutable tagged GitHub release after provenance
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_SHA: ${{ github.sha }}
      run: python tools/release/development.py finalize
  publish-maven:
    name: Publish Maven contracts
    needs: prepare
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: development-release
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: verified-release-packages
        path: build/development
    - name: Publish versioned Maven contracts
      env:
        MAVEN_REPOSITORY_URL: ${{ vars.MAVEN_REPOSITORY_URL || format('https://maven.pkg.github.com/{0}', github.repository) }}
        DEFAULT_MAVEN_URL: ${{ format('https://maven.pkg.github.com/{0}', github.repository) }}
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        GH_TOKEN: ${{ github.token }}
      run: |
        python tools/release/development.py validate-maven
        if [ "$MAVEN_REPOSITORY_URL" = "$DEFAULT_MAVEN_URL" ]; then
          export MAVEN_USERNAME="${MAVEN_USERNAME:-$GITHUB_ACTOR}"
          export MAVEN_PASSWORD="${MAVEN_PASSWORD:-$GH_TOKEN}"
        else
          if [ -z "$MAVEN_USERNAME" ] || [ -z "$MAVEN_PASSWORD" ]; then
            echo 'Custom Maven repository requires MAVEN_USERNAME and MAVEN_PASSWORD secrets'
            exit 1
          fi
        fi
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          python tools/release/development.py publish-maven
        else
          maven_version="$(cat build/development/MAVEN_VERSION)"
          ./gradlew --no-daemon "-PcontractsPublicationVersion=$maven_version" :contracts-java:publishMavenJavaPublicationToRemoteRepository -x test
        fi
'on':
  workflow_call: null
