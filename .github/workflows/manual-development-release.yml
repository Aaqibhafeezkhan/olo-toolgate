name: Manual development release (build and publish only)
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: development-release
  cancel-in-progress: false
jobs:
  native:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/client.yml
    secrets: inherit
    with:
      run_tests: false
      shared_checks: true
  build:
    name: Build publication artifacts
    needs: native
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/images.yml
    secrets: inherit
    with:
      run_tests: false
  publish:
    name: Publish images, Helm and GitHub release
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-images.yml
    secrets: inherit
    with:
      manual: true
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
  publish-typescript:
    name: Publish TypeScript library
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-typescript.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
      packages: write
  publish-maven:
    name: Publish Java library to Maven
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-maven.yml
    secrets: inherit
    with:
      manual: true
    permissions:
      actions: read
      contents: read
      packages: write
'on':
  workflow_dispatch: null
