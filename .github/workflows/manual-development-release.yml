name: Manual development release (build and publish only)
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: manual-development-${{ inputs.source_branch }}
  cancel-in-progress: false
jobs:
  select:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sourceCommit }}
      build_number: ${{ steps.source.outputs.build }}
      selection_artifact_id: ${{ steps.selection.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Pin development source and version
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_BRANCH: ${{ inputs.source_branch }}
        SOURCE_COMMIT: latest
      run: python tools/release/development_source.py select
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      id: selection
      with:
        name: manual-development-selection
        path: build/manual-development/selection/
        if-no-files-found: error
  prepare:
    needs: select
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.select.outputs.source_sha }}
        path: source
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: manual-development-selection
        path: build/manual-development/selection
    - name: Stamp development packages without publication credentials
      env:
        # Selected source scripts must not access the controller's Actions cache.
        ACTIONS_CACHE_URL: ''
        ACTIONS_RESULTS_URL: ''
        ACTIONS_RUNTIME_TOKEN: ''
      run: |
        python -m pip install -r tools/requirements.txt
        python tools/release/development_source.py prepare --source source
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: manual-development-source
        path: build/manual-development/overlay/
        if-no-files-found: error
  native:
    needs: [select, prepare]
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')
    uses: ./.github/workflows/client.yml
    with:
      source_sha: ${{ needs.select.outputs.source_sha }}
      build_number: ${{ needs.select.outputs.build_number }}
      development_source: true
      run_tests: false
      shared_checks: true
  build:
    name: Build publication artifacts
    needs: [select, native]
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')
    uses: ./.github/workflows/images.yml
    secrets: inherit
    with:
      source_sha: ${{ needs.select.outputs.source_sha }}
      development_source: true
      run_tests: false
  publish:
    name: Publish images, Helm and GitHub release
    needs: [select, build]
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')
    uses: ./.github/workflows/release-images.yml
    secrets: inherit
    with:
      manual: true
      selection_artifact_id: ${{ needs.select.outputs.selection_artifact_id }}
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write
      attestations: write
  publish-typescript:
    name: Publish TypeScript library
    needs: [select, build]
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')
    uses: ./.github/workflows/release-typescript.yml
    with:
      selection_artifact_id: ${{ needs.select.outputs.selection_artifact_id }}
    permissions:
      actions: read
      contents: read
      packages: write
# Maven publication is disconnected pending the release-only pipeline.
# The reusable implementation remains in release-maven.yml.
'on':
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch (main, release/* or any feature branch)
        type: string
        default: main
        required: true
