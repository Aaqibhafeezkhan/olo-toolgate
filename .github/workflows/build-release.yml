name: Build and release binaries
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Build/test only, or build/test and publish
        type: choice
        options: [build-only, build-and-publish]
        default: build-only
        required: true
      build_run_id:
        description: Leave empty for first build; enter original Actions run ID to reuse its verified bundle
        type: string
        default: ''
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: product-release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  select:
    name: Select immutable release
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      commit: ${{ steps.select.outputs.commit }}
      build: ${{ steps.select.outputs.build }}
      buildRun: ${{ steps.select.outputs.buildRun }}
      reuse: ${{ steps.select.outputs.reuse }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Pin prepared commit and claim or reuse its build run
      id: select
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_BRANCH: ${{ github.ref_name }}
        BUILD_RUN_ID: ${{ inputs.build_run_id }}
      run: python tools/release/prepare.py resolve
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ steps.select.outputs.commit }}
        path: source
        persist-credentials: false
    - name: Check all prepared versions and generated metadata before expensive builds
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py --root source --selection build-release-selection.json
        python tools/release/pipeline.py verify-source --source source
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-selection
        path: build-release-selection.json
        overwrite: true
        retention-days: 90
        if-no-files-found: error
  preflight:
    needs: select
    if: needs.select.outputs.reuse != 'true'
    uses: ./.github/workflows/preflight.yml
    with:
      shared_checks: true
  foundation:
    needs: [select, preflight]
    if: needs.select.outputs.reuse != 'true'
    uses: ./.github/workflows/foundation.yml
    with:
      source_sha: ${{ needs.select.outputs.commit }}
      build_number: ${{ needs.select.outputs.build }}
  clients:
    needs: [select, preflight]
    if: needs.select.outputs.reuse != 'true'
    uses: ./.github/workflows/client.yml
    with:
      source_sha: ${{ needs.select.outputs.commit }}
      build_number: ${{ needs.select.outputs.build }}
      shared_checks: true
      run_tests: true
  images:
    needs: [select, foundation, clients]
    if: needs.select.outputs.reuse != 'true'
    uses: ./.github/workflows/images.yml
    with:
      source_sha: ${{ needs.select.outputs.commit }}
      run_tests: true
  collect:
    name: Collect immutable release bundle
    needs: [select, preflight, foundation, clients, images]
    if: needs.select.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.select.outputs.commit }}
        path: source
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-selection
        path: .
    - name: Verify original gates and collect the exact tested package/image bytes
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py --root source --selection build-release-selection.json
        python tools/release/pipeline.py collect --source source
    - name: Attest checked release assets and source/build manifest
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-path: build/product-release/assets/*
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-bundle
        path: build/product-release/
        compression-level: 1
        retention-days: 90
        if-no-files-found: error
  publish:
    name: Publish verified release
    needs: [select, collect]
    if: >-
      always() && startsWith(github.ref, 'refs/heads/release/') && inputs.mode == 'build-and-publish' &&
      needs.select.result == 'success' &&
      (needs.select.outputs.reuse == 'true' || needs.collect.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production-release
    concurrency:
      group: product-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        registry-url: https://npm.pkg.github.com
        scope: '@olo-labs'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-selection
        path: .
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-bundle
        path: build/product-release
        run-id: ${{ needs.select.outputs.buildRun }}
        github-token: ${{ github.token }}
    - name: Install checksum-verified Helm
      run: |
        curl --fail --location --proto '=https' -o helm.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
        curl --fail --location --proto '=https' -o helm.sha256 https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
        expected="$(cut -d ' ' -f 1 helm.sha256)"
        printf '%s  helm.tar.gz\n' "$expected" | sha256sum --check
        tar -xzf helm.tar.gz
        sudo install linux-amd64/helm /usr/local/bin/helm
    - name: Validate original build evidence and resume registry publication
      id: registries
      env:
        GH_TOKEN: ${{ github.token }}
        NODE_AUTH_TOKEN: ${{ github.token }}
        MAVEN_REPOSITORY_URL: ${{ vars.MAVEN_REPOSITORY_URL || format('https://maven.pkg.github.com/{0}', github.repository) }}
        DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      run: python tools/release/pipeline.py publish
    - name: Log in to GHCR for image attestations
      env:
        GH_TOKEN: ${{ github.token }}
        REGISTRY_USERNAME: ${{ github.actor }}
      run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin
    - name: Attest Control image
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.registries.outputs.control_image }}
        subject-digest: ${{ steps.registries.outputs.control_digest }}
        push-to-registry: true
    - name: Attest Gateway image
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.registries.outputs.gateway_image }}
        subject-digest: ${{ steps.registries.outputs.gateway_digest }}
        push-to-registry: true
    - name: Attest Quickstart image
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.registries.outputs.quickstart_image }}
        subject-digest: ${{ steps.registries.outputs.quickstart_digest }}
        push-to-registry: true
    - name: Attest Device image
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.registries.outputs.device_image }}
        subject-digest: ${{ steps.registries.outputs.device_digest }}
        push-to-registry: true
    - name: Attest secured Device image
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-name: ${{ steps.registries.outputs.secured_device_image }}
        subject-digest: ${{ steps.registries.outputs.secured_device_digest }}
        push-to-registry: true
    - name: Attest final release assets and registry receipt
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
      with:
        subject-path: build/publication/assets/*
    - name: Finalize GitHub release and advance the matching package channel
      env:
        GH_TOKEN: ${{ github.token }}
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: python tools/release/pipeline.py finalize
    - name: Log out of GHCR
      if: always()
      run: docker logout ghcr.io
