name: release-foundation
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish Maven, Helm OCI and GitHub release assets
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: release-foundation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admission:
    uses: ./.github/workflows/admission.yml
  policy-compatibility:
    needs: admission
    if: needs.admission.outputs.allow == 'true'
    uses: ./.github/workflows/policy.yml
  release:
    needs: policy-compatibility
    runs-on: ubuntu-24.04
    environment: foundation-release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install -r tools/requirements.txt
          rustup show
          curl --fail --location --proto '=https' -o helm-v3.17.3-linux-amd64.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          curl --fail --location --proto '=https' -o helm.sha256 https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm.sha256
          tar -xzf helm-v3.17.3-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
          rm -rf linux-amd64 helm-v3.17.3-linux-amd64.tar.gz helm.sha256
      - name: Validate immutable release version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          python tools/contracts/version.py --check
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            test "${RELEASE_REF#refs/tags/}" = "v$(cat VERSION)"
          fi
          if [[ "$RELEASE_PUBLISH" == true ]]; then
            test "$RELEASE_REF" = "refs/tags/v$(cat VERSION)"
          fi
      - name: Build and test release
        run: |
          make check PYTHON=python
          python tools/check.py --scans
          python tools/release/bundle.py
          contracts_version="$(cat packages/contracts/VERSION)"
          for classifier in "" "-sources" "-javadoc"; do
            cp "packages/contracts/java/build/libs/toolgate-contracts-${contracts_version}${classifier}.jar" build/release/
          done
          helm package deploy/helm/olo-toolgate --destination build/release
          cp CHANGELOG.md docs/development/foundation-upgrades.md build/release/
          cp docs/gateway/upgrades.md build/release/gateway-upgrades.md
          cp docs/control-plane/upgrades.md build/release/control-upgrades.md
      - name: Generate release dependency SBOM
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.61.1 fs --no-progress --include-dev-deps --format cyclonedx --scanners vuln --skip-dirs .dev,**/build,**/node_modules,target,.gradle,.git --output /repo/build/release/sbom.cdx.json /repo
          python tools/release/bundle.py --checksums-only
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: build/release/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-release
          path: build/release/*
          if-no-files-found: error
      - name: Publish Java contract artifact
        if: github.event_name == 'push' || inputs.publish
        env:
          MAVEN_REPOSITORY_URL: ${{ vars.MAVEN_REPOSITORY_URL }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          test -n "$MAVEN_REPOSITORY_URL"
          ./gradlew --no-daemon :contracts-java:publishMavenJavaPublicationToRemoteRepository
      - name: Publish Helm OCI and immutable GitHub assets
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_ACTOR: ${{ github.actor }}
        run: |
          version="$(cat VERSION)"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_ACTOR" --password-stdin
          helm push "build/release/olo-toolgate-${version}.tgz" oci://ghcr.io/olo-labs/charts
          gh release create "v${version}" build/release/* --verify-tag --title "OLO ToolGate ${version}" --generate-notes --notes-file RELEASE-NOTES.md
