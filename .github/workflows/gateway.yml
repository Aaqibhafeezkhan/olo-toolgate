name: gateway
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      comment:
        description: "Trigger comment must start with RC:"
        type: string
        required: true
      publish:
        description: Publish the tested image from the matching version tag
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: gateway-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admission:
    uses: ./.github/workflows/admission.yml
    with:
      comment: ${{ inputs.comment || '' }}
  preflight:
    needs: admission
    if: needs.admission.outputs.allow == 'true'
    uses: ./.github/workflows/preflight.yml
  policy-compatibility:
    needs: preflight
    uses: ./.github/workflows/policy.yml
  container-and-replicas:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install pinned validation tooling
        run: |
          python -m pip install -r tools/requirements.txt
          rustup show
          curl --fail --location --proto '=https' -o helm.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          curl --fail --location --proto '=https' -o helm.sha256sum https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          test "$(sha256sum helm.tar.gz | cut -d' ' -f1)" = "$(cut -d' ' -f1 helm.sha256sum)"
          tar -xzf helm.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Gateway and canonical contract gates
        run: |
          python tools/contracts/version.py --check
          python tools/contracts/generate.py --check
          python tools/quality.py
          python -m unittest discover -s tests/contracts -v
          python tools/check.py --scans
          cargo test --workspace --locked
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python tools/gateway/check.py
          python tools/gateway/benchmark.py
      - name: Build, smoke and scan production image
        run: |
          python tools/gateway/container.py
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.1 image --no-progress --exit-code 1 --severity HIGH,CRITICAL olo-toolgate-gateway:module05
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/build/gateway:/evidence" aquasec/trivy:0.61.1 image --no-progress --format cyclonedx --output /evidence/gateway-sbom.cdx.json olo-toolgate-gateway:module05
          python tools/enterprise/helm.py
          docker save olo-toolgate-gateway:module05 -o build/gateway/image.tar
          cp CHANGELOG.md docs/gateway/upgrades.md build/gateway/
          (cd build/gateway && sha256sum image.tar gateway-sbom.cdx.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gateway-evidence
          path: build/gateway/
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [container-and-replicas, policy-compatibility]
    runs-on: ubuntu-24.04
    environment: gateway-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gateway-evidence
          path: build/gateway
      - name: Publish the exact scanned image
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_ACTOR: ${{ github.actor }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          version="$(cat VERSION)"
          test "$RELEASE_REF" = "refs/tags/v${version}"
          (cd build/gateway && sha256sum --check SHA256SUMS)
          docker load -i build/gateway/image.tar
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_ACTOR" --password-stdin
          image="ghcr.io/olo-labs/olo-toolgate-gateway:${version}"
          docker tag olo-toolgate-gateway:module05 "$image"
          docker push "$image"
          digest="$(docker inspect "$image" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/olo-labs/olo-toolgate-gateway
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: build/gateway/gateway-sbom.cdx.json
