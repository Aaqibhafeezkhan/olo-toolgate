name: Prepare release branch
'on':
  workflow_dispatch:
    inputs:
      source_branch:
        description: Source branch (main or release/*)
        type: string
        default: main
        required: true
      source_commit:
        description: latest or full 40-character commit SHA from the source branch
        type: string
        default: latest
        required: true
permissions:
  contents: read
concurrency:
  group: prepare-product-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Initialize the major release line without allocating a build
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_BRANCH: ${{ inputs.source_branch }}
        SOURCE_COMMIT: ${{ inputs.source_commit }}
      run: python tools/release/line.py
