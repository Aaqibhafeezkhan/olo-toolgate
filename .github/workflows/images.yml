name: Tested production images
'on':
  workflow_call:
    inputs:
      development_source:
        type: boolean
        default: false
        description: Apply the same-run stamped development source overlay before building
      source_sha:
        type: string
        default: ''
        description: Prepared source commit; workflow controls remain on main
      run_tests:
        type: boolean
        default: true
        description: Verify production images before publication; false builds manual release artifacts only
permissions:
  contents: read
# With run_tests, Quickstart is built and tested first. Control, Gateway and the device image then
# verify in parallel against the saved Quickstart image, and the secured device and LangChain smoke
# follow the device image. Each evidence artifact carries its image.tar, which later jobs load.
# "verify" is the release gate: it passes only when every stage of the selected mode passed.
jobs:
  quickstart:
    if: ${{ inputs.run_tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.development_source }}
      with:
        name: manual-development-source
        path: .
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: public-client-bundle
        path: deploy/client-assets/release
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: foundation-evidence
        path: .
      if: ${{ inputs.run_tests }}
    - name: Prepare runtime tooling
      run: |
        python -m pip install -r tools/requirements.txt
        npm ci --ignore-scripts
        npx --no-install playwright install --with-deps chromium
        rustup show
      if: ${{ inputs.run_tests }}
    - name: Build and test the actual composed image
      run: |
        python tools/quickstart/check.py --build --image olo-toolgate-quickstart:module11 --client-assets deploy/client-assets/release --prebuilt-ui
        docker run --rm -e PYTHONPATH=/opt/quickstart --entrypoint /opt/quickstart-python/bin/python -v "$PWD:/work:ro" -w /work olo-toolgate-quickstart:module11 -m unittest discover -s tests/quickstart -v
        python tools/quickstart/check.py --image olo-toolgate-quickstart:module11 --postgresql --no-browser
        docker run --rm -v "$PWD/.dev/trivy-cache:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.1 image --no-progress --exit-code 1 --severity HIGH,CRITICAL olo-toolgate-quickstart:module11
        docker run --rm -v "$PWD/.dev/trivy-cache:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/build/quickstart:/evidence" aquasec/trivy:0.61.1 image --no-progress --format cyclonedx --output /evidence/quickstart-sbom.cdx.json olo-toolgate-quickstart:module11
        python tools/ui/merge_sbom.py --image-sbom build/quickstart/quickstart-sbom.cdx.json
        docker save olo-toolgate-quickstart:module11 -o build/quickstart/image.tar
        cp CHANGELOG.md docs/deployment/quickstart.md build/quickstart/
        (cd build/quickstart && sha256sum image.tar quickstart-sbom.cdx.json > SHA256SUMS)
      if: ${{ inputs.run_tests }}
    - name: Preserve browser and runtime diagnostics
      if: ${{ always() && inputs.run_tests }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: browser-diagnostics
        path: |
          build/ui/browser-results.json
          build/ui/browser-output/
          build/quickstart/runtime-failure.log
          build/quickstart/startup-failure.log
        if-no-files-found: ignore
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: quickstart-evidence
        path: build/quickstart/
        if-no-files-found: error
      if: ${{ inputs.run_tests }}
    # The Quickstart run adds enterprise configuration evidence and browser results that Control's
    # evidence bundle includes.
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: images-stage-quickstart
        path: |
          build/enterprise/
          build/ui/
        retention-days: 1
        if-no-files-found: error
      if: ${{ inputs.run_tests }}
  control:
    needs: quickstart
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.development_source }}
      with:
        name: manual-development-source
        path: .
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: public-client-bundle
        path: deploy/client-assets/release
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: foundation-evidence
        path: .
      if: ${{ inputs.run_tests }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: images-stage-quickstart
        path: build
      if: ${{ inputs.run_tests }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: quickstart-evidence
        path: build/quickstart
      if: ${{ inputs.run_tests }}
    - name: Prepare runtime tooling
      run: |
        python -m pip install -r tools/requirements.txt
        npm ci --ignore-scripts
        npx --no-install playwright install --with-deps chromium
        docker load -i build/quickstart/image.tar
      if: ${{ inputs.run_tests }}
    - name: Reuse the tested Quickstart helper and verify production Control
      run: |
        docker tag olo-toolgate-quickstart:module11 olo-toolgate-quickstart:enterprise-validation
        python tools/control/container.py --client-assets deploy/client-assets/release --prebuilt-ui
        docker tag olo-toolgate-control:module05 olo-toolgate-control:enterprise-production
        python tools/enterprise/restore_check.py
        python tools/client/downloads.py --image olo-toolgate-control:module05
        docker run --rm -v "$PWD/.dev/trivy-cache:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.1 image --no-progress --exit-code 1 --severity HIGH,CRITICAL olo-toolgate-control:module05
        docker run --rm -v "$PWD/.dev/trivy-cache:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/build/control:/evidence" aquasec/trivy:0.61.1 image --no-progress --format cyclonedx --output /evidence/control-sbom.cdx.json olo-toolgate-control:module05
        python tools/ui/merge_sbom.py
        cp -r build/enterprise build/control/enterprise-evidence
        cp -r build/quickstart build/control/quickstart-evidence
        docker save olo-toolgate-control:module05 -o build/control/image.tar
        cp -r build/ui build/control/ui-evidence
        cp CHANGELOG.md docs/control-plane/upgrades.md build/control/
        (cd build/control && sha256sum image.tar control-sbom.cdx.json > SHA256SUMS)
      if: ${{ inputs.run_tests }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: control-evidence
        path: build/control/
        if-no-files-found: error
      if: ${{ inputs.run_tests }}
  gateway:
    needs: quickstart
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.development_source }}
      with:
        name: manual-development-source
        path: .
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: quickstart-evidence
        path: build/quickstart
      if: ${{ inputs.run_tests }}
    - name: Prepare runtime tooling
      run: |
        python -m pip install -r tools/requirements.txt
        rustup show
        docker load -i build/quickstart/image.tar
      if: ${{ inputs.run_tests }}
    - name: Verify production Gateway using the tested helper
      run: |
        docker tag olo-toolgate-quickstart:module11 olo-toolgate-quickstart:enterprise-validation
        docker build -f apps/gateway/Dockerfile --build-arg VERSION="$(cat VERSION)" --build-arg REVISION="$RELEASE_SHA" -t olo-toolgate-gateway:module05 .
        python tools/gateway/container.py --no-build
        python tools/gateway/benchmark.py
        docker run --rm -v "$PWD/.dev/trivy-cache:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.1 image --no-progress --exit-code 1 --severity HIGH,CRITICAL olo-toolgate-gateway:module05
        docker run --rm -v "$PWD/.dev/trivy-cache:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/build/gateway:/evidence" aquasec/trivy:0.61.1 image --no-progress --format cyclonedx --output /evidence/gateway-sbom.cdx.json olo-toolgate-gateway:module05
        docker save olo-toolgate-gateway:module05 -o build/gateway/image.tar
        cp CHANGELOG.md docs/gateway/upgrades.md build/gateway/
        (cd build/gateway && sha256sum image.tar gateway-sbom.cdx.json > SHA256SUMS)
      if: ${{ inputs.run_tests }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gateway-evidence
        path: build/gateway/
        if-no-files-found: error
      if: ${{ inputs.run_tests }}
  device:
    needs: quickstart
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.development_source }}
      with:
        name: manual-development-source
        path: .
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: quickstart-evidence
        path: build/quickstart
      if: ${{ inputs.run_tests }}
    - name: Prepare runtime tooling
      run: |
        python -m pip install -r tools/requirements.txt
        docker load -i build/quickstart/image.tar
      if: ${{ inputs.run_tests }}
    - name: Build and verify the matching Linux device image
      run: |
        docker build -f apps/device/Dockerfile --build-arg QUICKSTART_IMAGE=olo-toolgate-quickstart:module11 --build-arg VERSION="$(cat VERSION)" --build-arg REVISION="$RELEASE_SHA" -t olo-toolgate-device:module11 .
        python tools/device/check.py
        docker run --rm -v "$PWD/.dev/trivy-cache:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.1 image --no-progress --exit-code 1 --severity HIGH,CRITICAL olo-toolgate-device:module11
        docker run --rm -v "$PWD/.dev/trivy-cache:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/build/device:/evidence" aquasec/trivy:0.61.1 image --no-progress --format cyclonedx --output /evidence/device-sbom.cdx.json olo-toolgate-device:module11
        docker save olo-toolgate-device:module11 -o build/device/image.tar
        cp docs/deployment/device.md build/device/
        (cd build/device && sha256sum image.tar device-sbom.cdx.json > SHA256SUMS)
      if: ${{ inputs.run_tests }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: device-evidence
        path: build/device/
        if-no-files-found: error
      if: ${{ inputs.run_tests }}
  secured-device:
    needs: device
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.development_source }}
      with:
        name: manual-development-source
        path: .
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: quickstart-evidence
        path: build/quickstart
      if: ${{ inputs.run_tests }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: device-evidence
        path: build/device
      if: ${{ inputs.run_tests }}
    - name: Prepare runtime tooling
      run: |
        python -m pip install -r tools/requirements.txt
        docker load -i build/quickstart/image.tar
        docker load -i build/device/image.tar
      if: ${{ inputs.run_tests }}
    - name: Build and verify the Gateway-only secured Linux device
      run: |
        docker build -f apps/device/secured.Dockerfile --build-arg DEVICE_IMAGE=olo-toolgate-device:module11 -t olo-toolgate-linux-secured-device:module11 .
        python tools/device/secured_check.py
        docker run --rm -v "$PWD/.dev/trivy-cache:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.1 image --no-progress --exit-code 1 --severity HIGH,CRITICAL olo-toolgate-linux-secured-device:module11
        docker run --rm -v "$PWD/.dev/trivy-cache:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/build/secured_device:/evidence" aquasec/trivy:0.61.1 image --no-progress --format cyclonedx --output /evidence/secured-device-sbom.cdx.json olo-toolgate-linux-secured-device:module11
        docker save olo-toolgate-linux-secured-device:module11 -o build/secured_device/image.tar
        cp docs/deployment/secured-device.md build/secured_device/
        (cd build/secured_device && sha256sum image.tar secured-device-sbom.cdx.json > SHA256SUMS)
      if: ${{ inputs.run_tests }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: secured-device-evidence
        path: build/secured_device/
        if-no-files-found: error
      if: ${{ inputs.run_tests }}
  langchain:
    needs: device
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.development_source }}
      with:
        name: manual-development-source
        path: .
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: quickstart-evidence
        path: build/quickstart
      if: ${{ inputs.run_tests }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: device-evidence
        path: build/device
      if: ${{ inputs.run_tests }}
    - name: Prepare runtime tooling
      run: |
        python -m pip install -r tools/requirements.txt
        docker load -i build/quickstart/image.tar
        docker load -i build/device/image.tar
      if: ${{ inputs.run_tests }}
    - name: LangChain native smoke on the device image being published
      env:
        TOOLGATE_QUICKSTART_IMAGE: olo-toolgate-quickstart:module11
        TOOLGATE_DEVICE_IMAGE: olo-toolgate-device:module11
        TOOLGATE_HTTP_PORT: '18091'
        TOOLGATE_TLS_PORT: '18451'
      working-directory: examples/langchain
      run: |
        mkdir -p ../../build/langchain
        cleanup() {
          result=$?
          docker compose logs --no-color --tail 200 quickstart linux-device registry > ../../build/langchain/compose.log 2>&1 || true
          docker compose ps --all > ../../build/langchain/containers.txt 2>&1 || true
          docker compose down -v || true
          exit "$result"
        }
        trap cleanup EXIT
        LOCAL_UID="$(id -u)"
        LOCAL_GID="$(id -g)"
        export LOCAL_UID LOCAL_GID
        python -m unittest discover -s . -p test_manage.py
        python -m unittest discover -s . -p test_packages.py
        python manage.py prepare
        docker compose build agent
        docker compose up -d --wait --wait-timeout 180 quickstart linux-device
        python manage.py setup --bootstrap-local --approve-linux-device --target linux
        docker compose run --rm -T --no-deps --entrypoint python -v "$PWD/test_agent.py:/app/test_agent.py:ro" agent /app/test_agent.py
        docker compose run --rm -T agent --target linux --smoke
      if: ${{ inputs.run_tests }}
    - name: Preserve LangChain diagnostics
      if: ${{ always() && inputs.run_tests }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: langchain-diagnostics
        path: build/langchain/
        if-no-files-found: ignore

  build:
    if: ${{ !inputs.run_tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      if: ${{ inputs.development_source }}
      with:
        name: manual-development-source
        path: .
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: public-client-bundle
        path: deploy/client-assets/release
    - name: Build containers and library packages
      env:
        RELEASE_SHA: ${{ inputs.source_sha || github.sha }}
        DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      run: |
        npm ci --ignore-scripts --no-audit
        python tools/release/manual_development.py build
      if: ${{ !inputs.run_tests }}
    - name: Save built container images
      run: |
        docker save --output build/manual-development/images.tar \
          olo-toolgate-control:manual-development olo-toolgate-gateway:manual-development \
          olo-toolgate-quickstart:manual-development olo-toolgate-device:manual-development \
          olo-toolgate-linux-secured-device:manual-development
      if: ${{ !inputs.run_tests }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: manual-development-assets
        path: build/manual-development/assets/
        if-no-files-found: error
      if: ${{ !inputs.run_tests }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: manual-development-libraries
        path: |
          build/manual-development/assets/*.jar
          build/manual-development/assets/*.pom
          build/manual-development/assets/olo-labs-toolgate-contracts-*.tgz
          build/manual-development/assets/development-release.json
        if-no-files-found: error
      if: ${{ !inputs.run_tests }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: manual-development-images
        path: build/manual-development/images.tar
        compression-level: 1
        if-no-files-found: error
      if: ${{ !inputs.run_tests }}
  verify:
    needs: [quickstart, control, gateway, device, secured-device, langchain, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require every image stage of the selected mode
      env:
        RESULTS: ${{ toJSON(needs) }}
        RUN_TESTS: ${{ inputs.run_tests }}
      run: |
        if [ "$RUN_TESTS" = true ]; then
          required='["quickstart","control","gateway","device","secured-device","langchain"]'
        else
          required='["build"]'
        fi
        echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
        echo "$RESULTS" | jq -e --argjson required "$required" '[$required[] as $job | .[$job].result == "success"] | all' > /dev/null
