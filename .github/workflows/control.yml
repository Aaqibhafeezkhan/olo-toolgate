name: control
'on':
  workflow_call: null
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: control-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admission:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/admission.yml
    with:
      main_only: true
  preflight:
    needs: admission
    if: needs.admission.outputs.allow == 'true'
    uses: ./.github/workflows/preflight.yml
  clients:
    needs: preflight
    uses: ./.github/workflows/client.yml
  policy-compatibility:
    needs: preflight
    uses: ./.github/workflows/policy.yml
  container-and-replicas:
    needs: [clients, policy-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Derive build versions from version.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r tools/release/notes-requirements.txt
          python tools/release/config.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install pinned validation tooling
        run: |
          python -m pip install -r tools/requirements.txt
          curl --fail --location --proto '=https' -o helm.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          curl --fail --location --proto '=https' -o helm.sha256sum https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          test "$(sha256sum helm.tar.gz | cut -d' ' -f1)" = "$(cut -d' ' -f1 helm.sha256sum)"
          tar -xzf helm.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Control and canonical contract gates
        run: |
          python tools/contracts/version.py --check
          python tools/contracts/generate.py --check
          python tools/ui/generate.py --check
          npm ci --ignore-scripts
          npm run ui:build
          npm --workspace @olo-labs/toolgate-admin-ui test
          npx --no-install playwright install --with-deps chromium
          python tools/quality.py
          python -m unittest discover -s tests/contracts -v
          python tools/control/check.py
          python tools/enterprise/custody.py
          python tools/ui/package.py
          python tools/check.py --scans
          python tools/control/helm.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-client-bundle
          path: deploy/client-assets/release
      - name: Build, smoke and scan production image
        run: |
          python tools/quickstart/check.py --build --client-assets deploy/client-assets/release
          python tools/quickstart/check.py --postgresql --no-browser
          python tools/control/container.py --client-assets deploy/client-assets/release
          docker tag olo-toolgate-control:module05 olo-toolgate-control:enterprise-production
          python tools/enterprise/restore_check.py
          python tools/tenancy/recovery_check.py --output build/control/tenant-recovery.json
          python tools/client/downloads.py --image olo-toolgate-control:module05
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.1 image --no-progress --exit-code 1 --severity HIGH,CRITICAL olo-toolgate-control:module05
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/build/control:/evidence" aquasec/trivy:0.61.1 image --no-progress --format cyclonedx --output /evidence/control-sbom.cdx.json olo-toolgate-control:module05
          python tools/ui/merge_sbom.py
          python tools/enterprise/helm.py
          cp -r build/enterprise build/control/enterprise-evidence
          cp -r build/quickstart build/control/quickstart-evidence
          docker save olo-toolgate-control:module05 -o build/control/image.tar
          cp -r build/ui build/control/ui-evidence
          cp CHANGELOG.md docs/control-plane/upgrades.md build/control/
          (cd build/control && sha256sum image.tar control-sbom.cdx.json tenant-recovery.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: control-evidence
          path: build/control/
          if-no-files-found: error
