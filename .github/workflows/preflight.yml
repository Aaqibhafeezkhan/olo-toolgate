name: metadata-preflight
on:
  workflow_call:
    inputs:
      shared_checks:
        type: boolean
        default: false
        description: Foundation owns the production UI build and browser download gate
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Derive build versions from version.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r tools/release/notes-requirements.txt
          python tools/release/config.py
      - name: Verify version metadata and generated contract bindings
        run: python tools/ci/preflight.py
      - name: Install dependencies for CI regression tests
        run: python -m pip install -r tools/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify CI regression tests
        run: python -m unittest discover -s tests/ci -v
      - name: Catch Connect protocol and release package regressions early
        run: |
          node --test apps/browser-extension/tests/*.mjs
          python -m unittest discover -s tools/client -p test_extension.py
      - name: Scan staged source and prove public-key allowances remain narrow
        run: node tools/ci/secret-scan.mjs
      - name: Catch browser download contract regressions before native builds
        if: ${{ !inputs.shared_checks }}
        run: |
          npm ci --ignore-scripts
          npm --workspace @olo-labs/toolgate-admin-ui exec -- playwright install --with-deps chromium
          node tools/ci/browser-downloads.mjs
