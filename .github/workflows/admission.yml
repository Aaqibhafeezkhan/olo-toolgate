name: RC admission
on:
  workflow_call:
    inputs:
      branch_checks:
        description: Allow non-main branch push/manual checks without RC publication admission
        type: boolean
        default: false
      main_only:
        description: Require main and exclude version tags for compatibility callers
        type: boolean
        default: false
    outputs:
      allow:
        value: ${{ jobs.admit.outputs.allow }}
permissions:
  contents: read
  pull-requests: read
jobs:
  admit:
    if: >-
      ((inputs.branch_checks && !inputs.main_only && startsWith(github.ref, 'refs/heads/'))
      || github.ref == 'refs/heads/main' || (!inputs.main_only && startsWith(github.ref, 'refs/tags/')))
      && (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
      && vars.TOOLGATE_CI_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      allow: ${{ steps.admission.outputs.allow }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: admission
        name: Check CI enablement and PR title
        env:
          CI_ENABLED: ${{ vars.TOOLGATE_CI_ENABLED }}
          BRANCH_CHECKS: ${{ inputs.branch_checks && !inputs.main_only }}
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/admission.py
