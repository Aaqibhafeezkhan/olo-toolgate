        name: foundation-stage-ui
        path: .
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: foundation-stage-browser
        path: build/ui
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: foundation-stage-java
        path: .
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: foundation-stage-core-mcp
        path: build/core-mcp
    - name: Create raw contract release smoke assets
      run: |
        python tools/release/bundle.py
        contracts_version="$(cat packages/contracts/VERSION)"
        for classifier in "" "-sources" "-javadoc"; do
          cp "packages/contracts/java/build/libs/toolgate-contracts-${contracts_version}${classifier}.jar" build/release/
        done
        cp packages/contracts/java/build/publications/mavenJava/pom-default.xml "build/release/toolgate-contracts-${contracts_version}.pom"
        cp packages/contracts/java/build/publications/mavenJava/module.json "build/release/toolgate-contracts-${contracts_version}.module"
        python tools/release/artifacts.py
        helm package deploy/helm/olo-toolgate --destination build/release
        cp CHANGELOG.md build/release/
        cp docs/architecture/compatibility.md build/release/foundation-upgrades.md
        cp docs/gateway/upgrades.md build/release/gateway-upgrades.md
        cp docs/control-plane/upgrades.md build/release/control-upgrades.md
        docker run --rm -v "$PWD/.dev/trivy-cache:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 -v "$PWD:/repo" aquasec/trivy:0.61.1 fs --no-progress --include-dev-deps --format cyclonedx --scanners vuln --skip-dirs '.dev,**/build,**/node_modules,target,.gradle,.git' --output /repo/build/release/sbom.cdx.json /repo
        python tools/release/bundle.py --checksums-only
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: foundation-evidence
        path: |
          build/release/
          build/core-mcp/
          build/ui/
          packages/contracts/java/build/reports/tests/
          apps/*/build/reports/tests/
          build/enterprise/
          apps/admin-ui/dist/
          packages/contracts/java/build/test-results/
          apps/control-plane/build/test-results/
        if-no-files-found: error
  python-sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-24.04, python: '3.10'}
        - {os: ubuntu-24.04, python: '3.11'}
        - {os: ubuntu-24.04, python: '3.12'}
        - {os: ubuntu-24.04, python: '3.13'}
        - {os: ubuntu-24.04, python: '3.14'}
        - {os: windows-latest, python: '3.12'}
        - {os: macos-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python }}
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - run: python -m pip install -e "tool-sdk/python-sdk[identity,build]"
    - run: python -m unittest discover -s tool-sdk/python-sdk/tests -v
    - run: python -m pip wheel --no-deps --wheel-dir build/python-dist tool-sdk/python-sdk
'on':
  workflow_call:
    inputs:
      build_number:
        type: string
        default: ''
        description: Allocated product build number embedded in the UI
      source_sha:
        type: string
        default: ''
        description: Prepared source commit; workflow controls remain on main
