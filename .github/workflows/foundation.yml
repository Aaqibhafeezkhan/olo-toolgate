      with:
        name: foundation-stage-browser
        path: |
          build/ui/browser-results.json
          build/ui/browser-output/
        retention-days: 1
        if-no-files-found: ignore
  java:
    needs: ui
    runs-on: ubuntu-24.04
    env:
      TOOLGATE_BUILD: ${{ inputs.build_number || 'local' }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
