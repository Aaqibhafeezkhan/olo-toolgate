name: foundation
permissions:
  contents: read
  pull-requests: read
# The shared gates run as independent jobs, one per toolchain. Jobs that need the built admin UI
# receive it from "ui" as a same-run artifact. "check" runs last: it is the release gate, and it
# assembles the foundation-evidence artifact from the stage artifacts.
jobs:
  python:
    runs-on: ubuntu-24.04
    env:
      TOOLGATE_BUILD: ${{ inputs.build_number || 'local' }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - name: Install validation dependencies
      env:
        RUSTUP_HOME: ${{ runner.temp }}/toolgate-rustup
      run: |
        python -m pip install -r tools/requirements.txt
        python -m pip install setuptools wheel
        python tools/ci/install_rust.py
        printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
        curl --fail --location --proto '=https' -o helm-v3.17.3-linux-amd64.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
        curl --fail --location --proto '=https' -o helm.sha256 https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
        sha256sum --check helm.sha256
        tar -xzf helm-v3.17.3-linux-amd64.tar.gz
        sudo install linux-amd64/helm /usr/local/bin/helm
        rm -rf linux-amd64 helm-v3.17.3-linux-amd64.tar.gz helm.sha256
    - name: Python, contract, PHP and Helm gates
      run: |
        python tools/check.py --ci-common --ci-part python
    - name: Verify Quickstart security and restore fixtures before image builds
      env:
        PYTHONPATH: apps/quickstart
      run: python -m unittest discover -s tests/quickstart -v
    - name: Verify LangChain lifecycle and package contracts before image builds
      run: |
        python -m unittest discover -s examples/langchain -p test_manage.py -v
        python -m unittest discover -s examples/langchain -p test_packages.py -v
