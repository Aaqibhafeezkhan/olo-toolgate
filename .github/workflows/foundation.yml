name: foundation
permissions:
  contents: read
  pull-requests: read
# The shared gates run as independent jobs, one per toolchain. Jobs that need the built admin UI
# receive it from "ui" as a same-run artifact. "check" runs last: it is the release gate, and it
# assembles the foundation-evidence artifact from the stage artifacts.
jobs:
  python:
    runs-on: ubuntu-24.04
    env:
      TOOLGATE_BUILD: ${{ inputs.build_number || 'local' }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - name: Select installed Java 21
      run: python3 tools/ci/select_java.py
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - name: Install validation dependencies
      env:
        RUSTUP_HOME: ${{ runner.temp }}/toolgate-rustup
        CARGO_HOME: ${{ runner.temp }}/toolgate-cargo
      run: |
        python -m pip install -r tools/requirements.txt
        python -m pip install setuptools wheel
        python tools/ci/install_rust.py
        printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
        printf 'CARGO_HOME=%s\n' "$CARGO_HOME" >> "$GITHUB_ENV"
        printf '%s/bin\n' "$CARGO_HOME" >> "$GITHUB_PATH"
        curl --fail --location --proto '=https' -o helm-v3.17.3-linux-amd64.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
        curl --fail --location --proto '=https' -o helm.sha256 https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
        sha256sum --check helm.sha256
        tar -xzf helm-v3.17.3-linux-amd64.tar.gz
        sudo install linux-amd64/helm /usr/local/bin/helm
        rm -rf linux-amd64 helm-v3.17.3-linux-amd64.tar.gz helm.sha256
    - name: Python, contract, PHP and Helm gates
      run: |
        python tools/check.py --ci-common --ci-part python
    - name: Documentation structure and link checks
      run: make docs
    - name: Verify LangChain lifecycle and package contracts before image builds
      run: |
        python -m unittest discover -s examples/langchain -p test_manage.py -v
        python -m unittest discover -s examples/langchain -p test_packages.py -v
  ui:
    runs-on: ubuntu-24.04
    env:
      TOOLGATE_BUILD: ${{ inputs.build_number || 'local' }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - name: Select installed Java 21
      run: python3 tools/ci/select_java.py
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - name: Install validation dependencies
      env:
        RUSTUP_HOME: ${{ runner.temp }}/toolgate-rustup
        CARGO_HOME: ${{ runner.temp }}/toolgate-cargo
      run: |
        python -m pip install -r tools/requirements.txt
        python -m pip install setuptools wheel
        python tools/ci/install_rust.py
        printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
        printf 'CARGO_HOME=%s\n' "$CARGO_HOME" >> "$GITHUB_ENV"
        printf '%s/bin\n' "$CARGO_HOME" >> "$GITHUB_PATH"
        curl --fail --location --proto '=https' -o helm-v3.17.3-linux-amd64.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
        curl --fail --location --proto '=https' -o helm.sha256 https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
        sha256sum --check helm.sha256
        tar -xzf helm-v3.17.3-linux-amd64.tar.gz
        sudo install linux-amd64/helm /usr/local/bin/helm
        rm -rf linux-amd64 helm-v3.17.3-linux-amd64.tar.gz helm.sha256
    - name: Contracts and admin UI build, tests and package
      run: |
        python tools/check.py --ci-common --ci-part ui
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: foundation-stage-ui
        path: |
          apps/admin-ui/dist/
          build/ui/
          packages/contracts/typescript/dist/
        retention-days: 1
        if-no-files-found: error
  rust:
    runs-on: ubuntu-24.04
    env:
      TOOLGATE_BUILD: ${{ inputs.build_number || 'local' }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - name: Select installed Java 21
      run: python3 tools/ci/select_java.py
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - name: Install validation dependencies
      env:
        RUSTUP_HOME: ${{ runner.temp }}/toolgate-rustup
        CARGO_HOME: ${{ runner.temp }}/toolgate-cargo
      run: |
        python -m pip install -r tools/requirements.txt
        python -m pip install setuptools wheel
        python tools/ci/install_rust.py
        printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
        printf 'CARGO_HOME=%s\n' "$CARGO_HOME" >> "$GITHUB_ENV"
        printf '%s/bin\n' "$CARGO_HOME" >> "$GITHUB_PATH"
        curl --fail --location --proto '=https' -o helm-v3.17.3-linux-amd64.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
        curl --fail --location --proto '=https' -o helm.sha256 https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
        sha256sum --check helm.sha256
        tar -xzf helm-v3.17.3-linux-amd64.tar.gz
        sudo install linux-amd64/helm /usr/local/bin/helm
        rm -rf linux-amd64 helm-v3.17.3-linux-amd64.tar.gz helm.sha256
    - name: Rust format, tests and clippy
      run: |
        python tools/check.py --ci-common --ci-part rust
    - name: Rootless OCI worker containment
      env:
        SANDBOX_IMAGE: docker.io/library/python@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
      run: |
        sudo apt-get update
        sudo apt-get install -y podman crun uidmap slirp4netns fuse-overlayfs musl-tools
        # Avoid cold full-image copies for each explicit UID/GID mapping.
        install -d -m 700 "$HOME/.config/containers"
        test ! -e "$HOME/.config/containers/storage.conf"
        printf '[storage]\ndriver = "overlay"\n[storage.options.overlay]\nmount_program = "/usr/bin/fuse-overlayfs"\n' > "$HOME/.config/containers/storage.conf"
        podman pull "$SANDBOX_IMAGE"
        rustup target add x86_64-unknown-linux-musl
        python tools/security/broker_image.py
        cargo test -p olo-toolgate-tool-host --lib --test sandbox --locked --no-run
        sudo --preserve-env=PATH,RUSTUP_HOME,CARGO_HOME python tools/security/sandbox.py --service-user "$USER" --cargo "$(command -v cargo)" --image "$SANDBOX_IMAGE" --broker-image "$(cat build/security/broker-image/image-ref.txt)" --broker-image-evidence build/security/broker-image/image.json
    - name: Qualified interface and egress conformance
      run: python tools/security/containment.py
    - name: Managed deployment crash and restart qualification
      env:
        SANDBOX_IMAGE: docker.io/library/python@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
      run: |
        sudo --preserve-env=PATH,RUSTUP_HOME,CARGO_HOME python tools/security/deployment.py --service-user "$USER" --cargo "$(command -v cargo)" --image "$SANDBOX_IMAGE" --broker-image "$(cat build/security/broker-image/image-ref.txt)" --broker-image-evidence build/security/broker-image/image.json
    - name: Retain containment evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: rootless-containment-evidence
        path: |
          build/security/sandbox/
          build/security/broker-image/
          build/security/containment/
          build/security/deployment/
        if-no-files-found: error
  examples:
