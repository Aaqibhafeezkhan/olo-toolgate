    - name: Java SDK plugins and Java example tools end to end
      run: |
        python tools/check.py --ci-common --ci-part examples
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: foundation-stage-tool-packages
        path: |
          examples/java-tools/*/build/toolgate/*.olotool
          examples/mocked-tools/*/build/toolgate/*.olotool
        retention-days: 1
        if-no-files-found: error
  trigger-package-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    env:
      TOOLGATE_BUILD: ${{ inputs.build_number || 'local' }}
      GRADLE_USER_HOME: ${{ github.workspace }}/.dev/trigger-package-gradle
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - name: Select installed Java 21
      run: python3 tools/ci/select_java.py
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Discover every registered trigger package and require its README
      id: packages
      run: python tools/triggers/package_tests.py --matrix --github-output
    - name: Restore producer dependency and bootstrap caches
      id: trigger-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ${{ env.GRADLE_USER_HOME }}/caches/modules-2/files-2.1
          ${{ env.GRADLE_USER_HOME }}/caches/modules-2/metadata-*
          ${{ env.GRADLE_USER_HOME }}/olo-toolgate-bootstrap
        key: trigger-gradle-v1-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle.lockfile', '**/gradle-artifact.lockfile', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties', 'tools/ci/resolve-package-dependencies.init.gradle') }}
        restore-keys: trigger-gradle-v1-${{ runner.os }}-
    - name: Restore existing Java cache for a cold producer
      if: steps.trigger-cache.outputs.cache-matched-key == ''
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.gradle
        key: trigger-java-seed-${{ runner.os }}-${{ github.run_id }}
        restore-keys: ${{ runner.os }}-jdk21-temurin-gradle-
    - name: Seed only dependency files and metadata
      if: steps.trigger-cache.outputs.cache-matched-key == ''
      run: |
        python - <<'PY'
        import os, shutil
        from pathlib import Path
        source = Path.home()/'.gradle/caches/modules-2'
        target = Path(os.environ['GRADLE_USER_HOME'])/'caches/modules-2'
        for path in [source/'files-2.1', *source.glob('metadata-*')]:
            if path.is_dir():
                shutil.copytree(path, target/path.name, dirs_exist_ok=True)
        PY
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - name: Prepare the shared test SDK and offline package CLI once
      env:
        RUSTUP_HOME: ${{ runner.temp }}/toolgate-rustup
        CARGO_HOME: ${{ runner.temp }}/toolgate-cargo
      run: |
        python tools/ci/install_rust.py
        printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
        printf 'CARGO_HOME=%s\n' "$CARGO_HOME" >> "$GITHUB_ENV"
        printf '%s/bin\n' "$CARGO_HOME" >> "$GITHUB_PATH"
        export PATH="$CARGO_HOME/bin:$PATH"
        python tools/triggers/package_tests.py --prepare-sdk
        cargo build --locked -p toolgate-cli
        mkdir -p build/trigger-package-sdk
        cp target/debug/toolgate build/trigger-package-sdk/toolgate
        cp VERSION build/trigger-package-sdk/VERSION
        python tools/triggers/package_tests.py --prepare-dependencies --sdk-repo build/sdk-repo
        mkdir -p "$GRADLE_USER_HOME/olo-toolgate-bootstrap"
        tar --exclude='*.lock' --exclude='gc.properties' --exclude='*.zip' -czf build/trigger-package-sdk/gradle-cache.tar.gz -C "$GRADLE_USER_HOME" caches/modules-2 olo-toolgate-bootstrap
    - name: Save successfully prepared producer dependencies
      if: steps.trigger-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ${{ env.GRADLE_USER_HOME }}/caches/modules-2/files-2.1
          ${{ env.GRADLE_USER_HOME }}/caches/modules-2/metadata-*
          ${{ env.GRADLE_USER_HOME }}/olo-toolgate-bootstrap
        key: ${{ steps.trigger-cache.outputs.cache-primary-key }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: trigger-package-sdk
        path: |
          build/sdk-repo/
          build/trigger-package-sdk/
        retention-days: 1
        if-no-files-found: error
  trigger-package-tests:
    needs: trigger-package-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.trigger-package-sdk.outputs.matrix) }}
    env:
      TOOLGATE_BUILD: ${{ inputs.build_number || 'local' }}
      GRADLE_USER_HOME: ${{ github.workspace }}/.dev/trigger-package-gradle
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - name: Select installed Java 21
      run: python3 tools/ci/select_java.py
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: trigger-package-sdk
        path: .dev/trigger-package-sdk
    - name: Run isolated package mock tests, descriptor examples, pack validation and runtime smoke
      env:
        TOOLGATE_TEST_PACKAGE: ${{ matrix.package }}
        TOOLGATE_TEST_SDK_REPO: ${{ github.workspace }}/.dev/trigger-package-sdk/sdk-repo
        TOOLGATE_CLI: ${{ github.workspace }}/.dev/trigger-package-sdk/trigger-package-sdk/toolgate
        TOOLGATE_TEST_PROVIDER_MODE: mock
      run: |
        chmod +x "$TOOLGATE_CLI"
        test ! -e "$GRADLE_USER_HOME/caches"
        mkdir -p "$GRADLE_USER_HOME"
        tar -xzf .dev/trigger-package-sdk/trigger-package-sdk/gradle-cache.tar.gz -C "$GRADLE_USER_HOME"
        python tools/triggers/package_tests.py --offline --sdk-version-file .dev/trigger-package-sdk/trigger-package-sdk/VERSION
    - name: Retain individual package test evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: trigger-tests-${{ matrix.key }}
        path: |
          build/trigger-package-tests/
          ${{ matrix.package }}/build/test-results/
          ${{ matrix.package }}/build/reports/
          ${{ matrix.package }}/build/toolgate/*.olotool
        if-no-files-found: warn
        retention-days: 7
