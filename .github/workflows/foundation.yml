  core-mcp:
    needs: ui
    runs-on: ubuntu-24.04
    env:
      TOOLGATE_BUILD: ${{ inputs.build_number || 'local' }}
      GRADLE_USER_HOME: ${{ github.workspace }}/.dev/core-mcp-gradle
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - name: Select installed Java 21
      run: python3 tools/ci/select_java.py
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Restore Core MCP dependency cache
      id: core-mcp-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ${{ env.GRADLE_USER_HOME }}/caches/modules-2/files-2.1
          ${{ env.GRADLE_USER_HOME }}/caches/modules-2/metadata-*
        key: core-mcp-gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', '**/gradle.lockfile', '**/gradle-artifact.lockfile', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: core-mcp-gradle-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - name: Install validation dependencies
      env:
        RUSTUP_HOME: ${{ runner.temp }}/toolgate-rustup
        CARGO_HOME: ${{ runner.temp }}/toolgate-cargo
      run: |
        python -m pip install -r tools/requirements.txt
        python -m pip install setuptools wheel
        python tools/ci/install_rust.py
        printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
        printf 'CARGO_HOME=%s\n' "$CARGO_HOME" >> "$GITHUB_ENV"
        printf '%s/bin\n' "$CARGO_HOME" >> "$GITHUB_PATH"
        curl --fail --location --proto '=https' -o helm-v3.17.3-linux-amd64.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
        curl --fail --location --proto '=https' -o helm.sha256 https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
        sha256sum --check helm.sha256
        tar -xzf helm-v3.17.3-linux-amd64.tar.gz
        sudo install linux-amd64/helm /usr/local/bin/helm
        rm -rf linux-amd64 helm-v3.17.3-linux-amd64.tar.gz helm.sha256
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: foundation-stage-ui
        path: .
    - name: Build configured core MCP packages
      run: |
        cargo build --locked -p toolgate-cli
        TOOLGATE_CLI="$PWD/target/debug/toolgate" python -m unittest discover -s tool-sdk/python-sdk/tests -v
        python core-mcp/test_build.py
        python core-mcp/build.py --cli target/debug/toolgate
        TOOLGATE_CLI="$PWD/target/debug/toolgate" ./gradlew --no-daemon :control-plane:sdkWorkerTest -PprebuiltAdminUi=true
    - name: Build versioned profiles including their tool and trigger archives
      run: |
        TOOLGATE_CLI="$PWD/target/debug/toolgate" python bot/build.py
        python -m unittest discover -s tests/ci -p test_profiles.py -v
        npm ci --ignore-scripts
        PROFILE_BUNDLE_DIRECTORY=bot/bin PROFILE_BUNDLE_VERSION="$(cat VERSION)" npm --workspace @olo-labs/toolgate-admin-ui exec -- vitest run tests/profilesBuiltAcceptance.test.ts
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: foundation-stage-profiles
        path: bot/bin/
        retention-days: 1
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: foundation-stage-core-mcp
        path: build/core-mcp/
        retention-days: 1
        if-no-files-found: error
    - name: Save verified Core MCP dependencies
      if: success() && steps.core-mcp-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ${{ env.GRADLE_USER_HOME }}/caches/modules-2/files-2.1
          ${{ env.GRADLE_USER_HOME }}/caches/modules-2/metadata-*
        key: ${{ steps.core-mcp-cache.outputs.cache-primary-key }}
  check:
    needs: [python, ui, rust, examples, trigger-package-sdk, trigger-package-tests, scans, browser, java, core-mcp]
    runs-on: ubuntu-24.04
    env:
      TOOLGATE_BUILD: ${{ inputs.build_number || 'local' }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - name: Select installed Java 21
      run: python3 tools/ci/select_java.py
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - name: Install validation dependencies
      env:
        RUSTUP_HOME: ${{ runner.temp }}/toolgate-rustup
        CARGO_HOME: ${{ runner.temp }}/toolgate-cargo
      run: |
        python -m pip install -r tools/requirements.txt
        python -m pip install setuptools wheel
        python tools/ci/install_rust.py
        printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
        printf 'CARGO_HOME=%s\n' "$CARGO_HOME" >> "$GITHUB_ENV"
        printf '%s/bin\n' "$CARGO_HOME" >> "$GITHUB_PATH"
        curl --fail --location --proto '=https' -o helm-v3.17.3-linux-amd64.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
        curl --fail --location --proto '=https' -o helm.sha256 https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
        sha256sum --check helm.sha256
        tar -xzf helm-v3.17.3-linux-amd64.tar.gz
        sudo install linux-amd64/helm /usr/local/bin/helm
        rm -rf linux-amd64 helm-v3.17.3-linux-amd64.tar.gz helm.sha256
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: foundation-stage-ui
        path: .
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: foundation-stage-browser
        path: build/ui
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: foundation-stage-java
        path: .
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: foundation-stage-core-mcp
        path: build/core-mcp
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: foundation-stage-profiles
        path: bot/bin
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: foundation-stage-tool-packages
        path: examples
    - name: Create raw contract release smoke assets
      run: |
        python tools/release/profiles.py --source bot/bin --output build/release --version "$(cat VERSION)" --commit "$(git rev-parse HEAD)"
        python tools/release/tool_packages.py --output build/release --version "$(cat VERSION)" --commit "$(git rev-parse HEAD)"
        python tools/release/bundle.py
        contracts_version="$(cat packages/contracts/VERSION)"
        for classifier in "" "-sources" "-javadoc"; do
          cp "packages/contracts/java/build/libs/toolgate-contracts-${contracts_version}${classifier}.jar" build/release/
        done
        cp packages/contracts/java/build/publications/mavenJava/pom-default.xml "build/release/toolgate-contracts-${contracts_version}.pom"
        cp packages/contracts/java/build/publications/mavenJava/module.json "build/release/toolgate-contracts-${contracts_version}.module"
        python tools/release/artifacts.py
        helm package deploy/helm/olo-toolgate --destination build/release
        cp CHANGELOG.md build/release/
        cp docs/architecture/compatibility.md build/release/foundation-upgrades.md
        cp docs/architecture/compatibility.md build/release/gateway-upgrades.md
        cp docs/architecture/compatibility.md build/release/control-upgrades.md
        docker run --rm -v "$PWD/.dev/trivy-cache:/root/.cache/trivy" -e TRIVY_DB_REPOSITORY=ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2 -v "$PWD:/repo" aquasec/trivy:0.61.1 fs --no-progress --include-dev-deps --format cyclonedx --scanners vuln --skip-dirs '.dev,**/build,**/node_modules,target,.gradle,.git' --output /repo/build/release/sbom.cdx.json /repo
        python tools/release/bundle.py --checksums-only
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: foundation-evidence
        path: |
          build/release/
          build/core-mcp/
          build/ui/
          packages/contracts/java/build/reports/tests/
          apps/*/build/reports/tests/
          build/enterprise/
          apps/admin-ui/dist/
          packages/contracts/java/build/test-results/
          apps/control-plane/build/test-results/
        if-no-files-found: error
  python-sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
        - {os: ubuntu-24.04, python: '3.10'}
        - {os: ubuntu-24.04, python: '3.11'}
        - {os: ubuntu-24.04, python: '3.12'}
        - {os: ubuntu-24.04, python: '3.13'}
        - {os: ubuntu-24.04, python: '3.14'}
        - {os: windows-latest, python: '3.12'}
        - {os: macos-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ inputs.source_sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python }}
    - name: Derive build versions from version.json
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python -m pip install -r tools/release/notes-requirements.txt
        python tools/release/config.py
    - run: python -m pip install -e "tool-sdk/python-sdk[identity,build]"
    - run: python -m unittest discover -s tool-sdk/python-sdk/tests -v
    - run: python -m pip wheel --no-deps --wheel-dir build/python-dist tool-sdk/python-sdk
'on':
  workflow_call:
    inputs:
      build_number:
        type: string
        default: ''
        description: Allocated product build number embedded in the UI
      source_sha:
        type: string
        default: ''
        description: Source commit pinned by the calling workflow
