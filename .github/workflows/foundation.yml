        printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
        printf 'CARGO_HOME=%s\n' "$CARGO_HOME" >> "$GITHUB_ENV"
        printf '%s/bin\n' "$CARGO_HOME" >> "$GITHUB_PATH"
        curl --fail --location --proto '=https' -o helm-v3.17.3-linux-amd64.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
        curl --fail --location --proto '=https' -o helm.sha256 https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
        sha256sum --check helm.sha256
        tar -xzf helm-v3.17.3-linux-amd64.tar.gz
        sudo install linux-amd64/helm /usr/local/bin/helm
        rm -rf linux-amd64 helm-v3.17.3-linux-amd64.tar.gz helm.sha256
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: foundation-stage-ui
        path: .
    - name: Java build, publication proof and enterprise evidence
      timeout-minutes: 35
      run: |
        python tools/check.py --ci-common --ci-part java
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: foundation-stage-java
        path: |
          packages/contracts/java/build/libs/
          packages/contracts/java/build/publications/
