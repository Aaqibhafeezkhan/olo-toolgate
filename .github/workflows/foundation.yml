name: foundation
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      comment:
        description: "Trigger comment must start with RC:"
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admission:
    uses: ./.github/workflows/admission.yml
    with:
      comment: ${{ inputs.comment || '' }}
  preflight:
    needs: admission
    if: needs.admission.outputs.allow == 'true'
    uses: ./.github/workflows/preflight.yml
  check:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: |
          python -m pip install -r tools/requirements.txt
          rustup show
          curl --fail --location --proto '=https' -o helm-v3.17.3-linux-amd64.tar.gz https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz
          curl --fail --location --proto '=https' -o helm.sha256 https://get.helm.sh/helm-v3.17.3-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm.sha256
          tar -xzf helm-v3.17.3-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
          rm -rf linux-amd64 helm-v3.17.3-linux-amd64.tar.gz helm.sha256
      - name: Required foundation gates
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
          make check PYTHON=python
      - name: Dependency, license and secret scan hooks
        run: python tools/check.py --scans
      - name: Create raw contract release smoke assets
        run: python tools/release/bundle.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-evidence
          path: |
            build/release/
            build/ui/
            packages/contracts/java/build/reports/tests/
            apps/*/build/reports/tests/
          if-no-files-found: error
