name: Publish TypeScript contracts
'on':
  workflow_call:
    inputs:
      selection_artifact_id:
        type: string
        required: true
        description: Immutable selection artifact ID emitted by the trusted manual controller
permissions:
  contents: read
jobs:
  publish:
    name: Publish TypeScript library
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: development-release
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
        registry-url: https://npm.pkg.github.com
        scope: '@olo-labs'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: manual-development-libraries
        path: build/manual-development/assets
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ inputs.selection_artifact_id }}
        merge-multiple: true
        path: build/manual-development/selection
    - name: Publish TypeScript library
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ github.token }}
      run: python tools/release/manual_development.py publish-typescript
