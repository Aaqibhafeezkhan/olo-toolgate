name: quickstart
'on':
  workflow_call: null
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admission:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/admission.yml
    with:
      main_only: true
  preflight:
    needs: admission
    if: needs.admission.outputs.allow == 'true'
    uses: ./.github/workflows/preflight.yml
  clients:
    needs: preflight
    uses: ./.github/workflows/client.yml
  image:
    needs: clients
    runs-on: ubuntu-24.04
    env:
      RUSTUP_HOME: /tmp/toolgate-quickstart-rustup
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Derive build versions from version.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r tools/release/notes-requirements.txt
          python tools/release/config.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-client-bundle
          path: deploy/client-assets/release
      - name: Install isolated pinned Rust toolchain
        env:
          RUSTUP_HOME: /tmp/toolgate-quickstart-rustup
        run: |
          rustup show

      - name: Contracts, unit tests and SQLite upgrade
        run: |
          python -m pip install -r tools/requirements.txt
          npm ci --ignore-scripts
          npm run ui:build
          npm --workspace @olo-labs/toolgate-admin-ui test
          npx --no-install playwright install --with-deps chromium
          python tools/contracts/version.py --check
          python tools/contracts/generate.py --check
          python tools/quality.py
          python -m unittest discover -s tests/contracts -v
          ./gradlew --no-daemon :control-plane:test --tests io.ololabs.toolgate.control.SqliteTest
      - name: Build and test the actual composed image
        run: |
          python tools/quickstart/check.py --build --image olo-toolgate-quickstart:module11 --client-assets deploy/client-assets/release
          python tools/ui/package.py
          docker run --rm -e PYTHONPATH=/opt/quickstart --entrypoint /opt/quickstart-python/bin/python -v "$PWD:/work:ro" -w /work olo-toolgate-quickstart:module11 -m unittest discover -s tests/quickstart -v
          python tools/quickstart/check.py --image olo-toolgate-quickstart:module11 --postgresql --no-browser
          python tools/tenancy/check.py --image olo-toolgate-quickstart:module11 --output build/quickstart/tenant-runtime-evidence.json
          python tools/tenancy/check.py --postgresql --image olo-toolgate-quickstart:module11 --output build/quickstart/tenant-postgresql-runtime-evidence.json
          python tools/tenancy/deployment_check.py --image olo-toolgate-quickstart:module11
          TOOLGATE_TENANT_RUNTIME_EVIDENCE="$PWD/build/quickstart/tenant-runtime-evidence.json" cargo test --locked -p olo-toolgate-tenant-identity --test runtime_cutover -- --ignored
          TOOLGATE_TENANT_RUNTIME_EVIDENCE="$PWD/build/quickstart/tenant-postgresql-runtime-evidence.json" cargo test --locked -p olo-toolgate-tenant-identity --test runtime_cutover -- --ignored
          python tools/check.py --scans
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.1 image --no-progress --exit-code 1 --severity HIGH,CRITICAL olo-toolgate-quickstart:module11
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/build/quickstart:/evidence" aquasec/trivy:0.61.1 image --no-progress --format cyclonedx --output /evidence/quickstart-sbom.cdx.json olo-toolgate-quickstart:module11
          python tools/ui/merge_sbom.py --image-sbom build/quickstart/quickstart-sbom.cdx.json
          docker save olo-toolgate-quickstart:module11 -o build/quickstart/image.tar
          cp CHANGELOG.md docs/deployment/quickstart.md build/quickstart/
          (cd build/quickstart && sha256sum image.tar quickstart-sbom.cdx.json tenant-runtime-evidence.json tenant-postgresql-runtime-evidence.json sqlite-recovery-evidence.json > SHA256SUMS)
      - name: Build and verify the matching Linux device image
        run: |
          docker build -f apps/device/Dockerfile --build-arg QUICKSTART_IMAGE=olo-toolgate-quickstart:module11 --build-arg VERSION="$(cat VERSION)" --build-arg REVISION="$GITHUB_SHA" -t olo-toolgate-device:module11 .
          python tools/device/check.py
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.1 image --no-progress --exit-code 1 --severity HIGH,CRITICAL olo-toolgate-device:module11
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/build/device:/evidence" aquasec/trivy:0.61.1 image --no-progress --format cyclonedx --output /evidence/device-sbom.cdx.json olo-toolgate-device:module11
          docker save olo-toolgate-device:module11 -o build/device/image.tar
          cp docs/deployment/device.md build/device/
          (cd build/device && sha256sum image.tar device-sbom.cdx.json > SHA256SUMS)
      - name: Build and verify the Gateway-only secured Linux device
        run: |
          docker build -f apps/device/secured.Dockerfile --build-arg DEVICE_IMAGE=olo-toolgate-device:module11 -t olo-toolgate-linux-secured-device:module11 .
          python tools/device/secured_check.py
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.1 image --no-progress --exit-code 1 --severity HIGH,CRITICAL olo-toolgate-linux-secured-device:module11
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/build/secured_device:/evidence" aquasec/trivy:0.61.1 image --no-progress --format cyclonedx --output /evidence/secured-device-sbom.cdx.json olo-toolgate-linux-secured-device:module11
          docker save olo-toolgate-linux-secured-device:module11 -o build/secured_device/image.tar
          cp docs/deployment/secured-device.md build/secured_device/
          (cd build/secured_device && sha256sum image.tar secured-device-sbom.cdx.json > SHA256SUMS)
      - name: LangChain native smoke on the device image being published
        env:
          TOOLGATE_QUICKSTART_IMAGE: olo-toolgate-quickstart:module11
          TOOLGATE_DEVICE_IMAGE: olo-toolgate-device:module11
          TOOLGATE_HTTP_PORT: "18091"
          TOOLGATE_TLS_PORT: "18451"
        working-directory: examples/langchain
        run: |
          trap 'docker compose down -v' EXIT
          LOCAL_UID="$(id -u)"
          LOCAL_GID="$(id -g)"
          export LOCAL_UID LOCAL_GID
          docker compose build agent
          docker compose up -d --wait --wait-timeout 180 quickstart linux-device
          python manage.py setup --bootstrap-local --approve-linux-device --target linux
          docker compose run --rm -T agent --target linux --smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quickstart-evidence
          path: build/quickstart/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: device-evidence
          path: build/device/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secured-device-evidence
          path: build/secured_device/
          if-no-files-found: error
