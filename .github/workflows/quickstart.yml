name: quickstart
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      comment:
        description: "Trigger comment must start with RC:"
        type: string
        required: true
      publish:
        description: Publish the tested image from the matching version tag
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: quickstart-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admission:
    uses: ./.github/workflows/admission.yml
    with:
      comment: ${{ inputs.comment || '' }}
      main_only: true
  preflight:
    needs: admission
    if: needs.admission.outputs.allow == 'true'
    uses: ./.github/workflows/preflight.yml
  clients:
    needs: preflight
    uses: ./.github/workflows/client.yml
    with:
      comment: ${{ inputs.comment || '' }}
  image:
    needs: clients
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-client-bundle
          path: deploy/client-assets/release
      - name: Install isolated pinned Rust toolchain
        env:
          RUSTUP_HOME: ${{ runner.temp }}/toolgate-quickstart-rustup
        run: |
          rustup show
          printf 'RUSTUP_HOME=%s\n' "$RUSTUP_HOME" >> "$GITHUB_ENV"
      - name: Contracts, unit tests and SQLite upgrade
        run: |
          python -m pip install -r tools/requirements.txt
          npm ci --ignore-scripts
          npm run ui:build
          npm --workspace @olo-labs/toolgate-admin-ui test
          npx --no-install playwright install --with-deps chromium
          python tools/contracts/version.py --check
          python tools/contracts/generate.py --check
          python tools/quality.py
          python -m unittest discover -s tests/contracts -v
          ./gradlew --no-daemon :control-plane:test --tests io.ololabs.toolgate.control.SqliteTest
      - name: Build and test the actual composed image
        run: |
          python tools/quickstart/check.py --build --image olo-toolgate-quickstart:module11 --client-assets deploy/client-assets/release
          python tools/ui/package.py
          docker run --rm -e PYTHONPATH=/opt/quickstart --entrypoint /opt/quickstart-python/bin/python -v "$PWD:/work:ro" -w /work olo-toolgate-quickstart:module11 -m unittest discover -s tests/quickstart -v
          python tools/quickstart/check.py --image olo-toolgate-quickstart:module11 --postgresql --no-browser
          python tools/check.py --scans
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.1 image --no-progress --exit-code 1 --severity HIGH,CRITICAL olo-toolgate-quickstart:module11
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/build/quickstart:/evidence" aquasec/trivy:0.61.1 image --no-progress --format cyclonedx --output /evidence/quickstart-sbom.cdx.json olo-toolgate-quickstart:module11
          python tools/ui/merge_sbom.py --image-sbom build/quickstart/quickstart-sbom.cdx.json
          docker save olo-toolgate-quickstart:module11 -o build/quickstart/image.tar
          cp CHANGELOG.md docs/deployment/quickstart.md build/quickstart/
          (cd build/quickstart && sha256sum image.tar quickstart-sbom.cdx.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quickstart-evidence
          path: build/quickstart/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: image
    runs-on: ubuntu-24.04
    environment: quickstart-release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: quickstart-evidence
          path: build/quickstart
      - name: Publish the exact scanned image
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_ACTOR: ${{ github.actor }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          version="$(cat VERSION)"
          test "$RELEASE_REF" = "refs/tags/v${version}"
          (cd build/quickstart && sha256sum --check SHA256SUMS)
          docker load -i build/quickstart/image.tar
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_ACTOR" --password-stdin
          image="ghcr.io/olo-labs/olo-toolgate-quickstart:${version}"
          docker tag olo-toolgate-quickstart:module11 "$image"
          docker push "$image"
          digest="$(docker inspect "$image" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/olo-labs/olo-toolgate-quickstart
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: build/quickstart/quickstart-sbom.cdx.json
      - name: Publish immutable Quickstart release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          version="$(cat VERSION)"
          prefix="olo-toolgate-quickstart-${version}"
          cp build/quickstart/quickstart-sbom.cdx.json "build/quickstart/${prefix}-sbom.cdx.json"
          cp docs/deployment/quickstart.md "build/quickstart/${prefix}-operations.md"
          printf '%s@%s\n' "ghcr.io/olo-labs/olo-toolgate-quickstart" "$IMAGE_DIGEST" > "build/quickstart/${prefix}-image.txt"
          (cd build/quickstart && sha256sum "${prefix}-sbom.cdx.json" "${prefix}-operations.md" "${prefix}-image.txt" > "${prefix}-SHA256SUMS")
          if ! gh release view "v${version}"; then
            prerelease=""
            case "$version" in *-*) prerelease="--prerelease" ;; esac
            gh release create "v${version}" --verify-tag $prerelease --title "OLO ToolGate ${version}" --generate-notes --notes-file RELEASE-NOTES.md
          fi
          gh release upload "v${version}" "build/quickstart/${prefix}-sbom.cdx.json" "build/quickstart/${prefix}-operations.md" "build/quickstart/${prefix}-image.txt" "build/quickstart/${prefix}-SHA256SUMS"
