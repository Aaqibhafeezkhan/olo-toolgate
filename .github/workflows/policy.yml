name: enterprise-access-control
on:
  workflow_call:
permissions:
  contents: read
jobs:
  enterprise-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TOOLGATE_DOCKER_TOOLS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Derive build versions from version.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r tools/release/notes-requirements.txt
          python tools/release/config.py
      - name: Early release metadata gate
        run: python tools/ci/preflight.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Canonical contracts and enterprise authority gates
        run: |
          python -m pip install -r tools/requirements.txt
          python tools/contracts/version.py --check
          python tools/contracts/generate.py --check
          python -m unittest discover -s tests/contracts -v
          python tools/enterprise/check.py
          python tools/quickstart/check.py --build --no-browser
          python tools/enterprise/helm.py
          python tools/gateway/benchmark.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enterprise-authority-evidence
          path: |
            build/enterprise/
            build/quickstart/smoke.json
            build/gateway/benchmark.json
          if-no-files-found: error
