name: ToolGate CI - Manual
'on':
  workflow_dispatch: null
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: toolgate-ci-manual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Explicit operator runs bypass RC title and CI enablement admission.
  # Keep the same validation and build stages as ToolGate CI.
  preflight:
    uses: ./.github/workflows/preflight.yml
    with:
      shared_checks: true
  foundation:
    needs: preflight
    uses: ./.github/workflows/foundation.yml
  clients:
    needs: preflight
    uses: ./.github/workflows/client.yml
    with:
      shared_checks: true
      run_tests: true
  images:
    needs:
    - foundation
    - clients
    uses: ./.github/workflows/images.yml
    with:
      run_tests: true
