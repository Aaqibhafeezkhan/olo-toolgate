  /api/control/v1/config/import:
    post:
      operationId: importConfig
      description: Requires import on every group; a snapshot with settings requires Super
        Admin. Every requiredIdentities ID must exist or be resolved in identityResolution
        (EXISTING, MAP, PLACEHOLDER), otherwise 409 UNRESOLVED_IDENTITIES lists them, dry
        runs included. Resolved users are added to their teamIds; other memberships stay
        unless removeUnlistedMemberships. Replace deletes only exported kinds absent from
        the file and refuses with 409 REPLACE_CONFLICTS when a preserved record would point
        at a deleted one. A settings.configuration.requiredReviews change is refused with
        409 REQUIRED_REVIEWS_CHANGE while reviews are required. With requiredReviews 0 the
        import applies at once.
      responses:
        '200':
          description: Success
          headers:
            ETag:
              description: Quoted revision
              schema:
                type: string
            X-Request-ID:
              description: Server correlation ID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/control.schema.json#/$defs/ControlImportResult
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '413': *id007
        '415': *id008
        '500': *id009
        '503': *id010
        '202':
          description: Draft created; review impact, submit for independent review,
            then apply
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/enterprise.schema.json#/$defs/EnterpriseConfigurationChange
      parameters:
      - *id011
      - *id012
      requestBody:
