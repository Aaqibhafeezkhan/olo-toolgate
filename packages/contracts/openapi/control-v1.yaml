          description: Stored and verified
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/package.schema.json#/$defs/PackageVersion
        '200':
          description: Already stored
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/package.schema.json#/$defs/PackageVersion
        '400':
          description: Invalid bounded input
        '401':
          description: Authentication or direct TLS required
        '403':
          description: Not permitted, or not a registered Tool Host
        '413':
          description: Package too large
        '415':
          description: Not a package
        '503':
          description: Dependency unavailable
  /api/control/v1/packages:
    get:
      operationId: listServerPackageVersions
      description: Administrators with read access to every tool. The newest uploaded package versions.
