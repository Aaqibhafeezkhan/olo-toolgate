            application/json:
              schema:
                $ref: ../schemas/v1/enterprise.schema.json#/$defs/EnterpriseSecretDelivery
        '401':
          description: Authentication or direct TLS required
        '403':
          description: Not the admitted lease holder, past the deadline, or the secret is not the binding's
        '404':
          description: No such scan in this tenant
        '503':
          description: Dependency unavailable
  /api/control/v1/tool-hosts/mcp-scans/{id}/result:
    post:
      operationId: postMcpScanResult
      security:
      - deviceCertificate: []
      description: The lease holder reports what it observed, once and before the deadline. Control recomputes every digest.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v2/mcp-proxy.schema.json#/$defs/McpScanResult
      responses:
        '200':
          description: Finished
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/mcp-proxy.schema.json#/$defs/McpScanJob
        '400':
          description: Invalid bounded input
        '401':
          description: Authentication or direct TLS required
        '403':
          description: Not the lease holder, not a member host, or not a registered Tool Host
        '409':
          description: Expired, already reported or stale
        '503':
          description: Dependency unavailable
  /api/control/v1/tool-hosts/mcp-scans/{id}/failure:
    post:
      operationId: postMcpScanFailure
      security:
      - deviceCertificate: []
      description: The lease holder reports a failed scan, once and before the deadline. A failed refresh makes verification UNVERIFIED.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v2/mcp-proxy.schema.json#/$defs/McpScanFailureReport
      responses:
        '200':
          description: Failed
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/mcp-proxy.schema.json#/$defs/McpScanJob
        '400':
          description: Invalid bounded input
        '401':
          description: Authentication or direct TLS required
        '403':
          description: Not the lease holder, not a member host, or not a registered Tool Host
        '409':
          description: Expired, already reported or stale
        '503':
          description: Dependency unavailable
  /api/control/v1/tool-hosts/mcp-refreshes:
    post:
      operationId: requestMcpRefresh
      security:
      - deviceCertificate: []
      description: The holder of one MCP_PROXY invocation saw notifications/tools/list_changed and asks for an immediate refresh
        of that call's server. Control queues one unless a scan of it is already open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v2/mcp-proxy.schema.json#/$defs/McpRefreshRequest
      responses:
        '202':
          description: Accepted; a refresh is queued or already open
        '400':
          description: Invalid bounded input
        '401':
          description: Authentication or direct TLS required
        '403':
          description: Not the invocation's lease holder, or not an MCP_PROXY call
        '503':
          description: Dependency unavailable
  /api/control/v1/tool-hosts/mcp-quarantines:
    post:
      operationId: reportMcpQuarantine
      security:
      - deviceCertificate: []
      description: The lease holder of one invocation or scan reports a quarantine. Control derives the targets from that evidence
        and applies it only to the current approval; a stale report is audited and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v2/mcp-proxy.schema.json#/$defs/McpQuarantineReport
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/mcp-proxy.schema.json#/$defs/McpServerRegistration
        '400':
          description: Invalid bounded input
        '401':
          description: Authentication or direct TLS required
        '403':
          description: Not the lease holder, not a member host, or not a registered Tool Host
        '409':
          description: Expired, already reported or stale
        '503':
          description: Dependency unavailable
  /api/control/v1/access/invocations/cancel:
    post:
      operationId: cancelCallerOperation
      description: Gateway role only. Persists cancellation even before first submission.
      security:
      - adminAccessToken: []
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/enterprise.schema.json#/$defs/CancellationAccepted
        '403':
          description: Authentication, scope, expiry or current authority refused
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v2/common.schema.json#/$defs/RequestContext
  /api/control/v1/access/service-permits/issue:
    post:
      operationId: issueServicePermit
      description: Direct admitted executor device certificate and fencing token required.
      security:
      - deviceCertificate: []
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/enterprise.schema.json#/$defs/ServicePermit
        '403':
          description: Authentication, scope, expiry or current authority refused
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/enterprise.schema.json#/$defs/ServicePermitIssue
  /api/control/v1/access/service-permits/{audience}/consume:
    post:
      operationId: consumeServicePermit
      description: Dedicated toolgate-service-{audience} role; exact request facts and current authority checked.
      security:
      - adminAccessToken: []
      parameters:
      - in: path
        name: audience
        required: true
        schema:
          type: string
          enum: [olo-memory, olo-rag]
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/enterprise.schema.json#/$defs/ServicePermitConsumed
        '403':
          description: Authentication, scope, expiry or current authority refused
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/enterprise.schema.json#/$defs/ServicePermitConsumption
  /api/control/v1/access/service-permits/{audience}/epoch:
    get:
      operationId: serviceAuthorizationEpoch
      description: Dedicated service role; coalesced tenant revocation feed snapshot.
      security:
      - adminAccessToken: []
      parameters:
      - in: path
        name: audience
        required: true
        schema:
          type: string
          enum: [olo-memory, olo-rag]
      responses:
        '200':
          description: Authorized result
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/enterprise.schema.json#/$defs/ServiceAuthorizationEpoch
        '403':
          description: Authentication, scope, expiry or current authority refused
  /api/control/v1/access/service-permits/{audience}/jwks:
    get:
      operationId: servicePermitKeys
      description: Dedicated service role; current purpose-separated Control effect verification key.
      parameters:
      - in: path
        name: audience
        required: true
        schema:
          type: string
          enum: [olo-memory, olo-rag]
      responses:
        '200':
          description: Authenticated key-discovery result
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [kty, alg, use, kid, n, e]
        '403':
          description: Dedicated service role for this audience and tenant required
components:
  securitySchemes:
    adminAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 token with verified issuer/audience/expiry and signed tenant_id/groups.
        Not a Gateway runtime credential.
    deviceCertificate:
      type: mutualTLS
      description: Direct verified device TLS identity; forwarded identity headers
        never authenticate.
