        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/package.schema.json#/$defs/PackageDeploymentPage
        '401':
          description: Authentication or direct TLS required
        '403':
          description: Not permitted, or not a registered Tool Host
        '503':
          description: Dependency unavailable
    post:
      operationId: deployServerPackage
      description: Super Admin only. Makes a stored version the one Tool Hosts run for its package id, with the values of
        its declared globals and destination host settings. Control writes the service profile, the globals document, a
        disabled directory entry per new tool in the default Tool Group (an existing tool keeps its state and group) and the
        tool's resource extractor. hostIds names the Tool Hosts that run it (none means every Tool Host); deploying the
        same version with other hostIds moves its tools. Each tool still needs a reviewed enable, a binding that allows the package digest and a
        grant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
