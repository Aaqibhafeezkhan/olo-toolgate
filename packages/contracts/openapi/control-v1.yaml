openapi: 3.1.0
info:
  title: OLO ToolGate Control Plane API
  version: 0.10.0-dev
  description: Tenant-scoped group administration with reviewed configuration changes
    and online current authorization. Signed snapshots describe configuration; execution
    requires a separately signed single-use permit.
security:
- adminAccessToken: []
paths:
  /api/control/v1/admin-session:
    get:
      operationId: getAdminSession
      responses:
        '200':
          description: Verified administrative role
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/control.schema.json#/$defs/AdminSession
        '403':
          description: Administrator portal permission required
  /api/public/v1/installers:
    get:
      operationId: publicClientInstallers
      security: []
      responses:
        '200':
          description: Unsigned interactive installer manifest
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/local-tools.schema.json#/$defs/ClientInstallerManifest
        '503':
          description: Installers unavailable
  /api/public/v1/clients:
    get:
      operationId: publicClientDownloads
      security: []
      responses:
        '200':
          description: Verified immutable client release packages
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/local-tools.schema.json#/$defs/ClientDownloadManifest
        '503':
          description: No published release bundle
  /api/public/v1/clients/{filename}:
    get:
      operationId: publicClientBinary
      security: []
      parameters:
      - name: filename
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Checksum-verified archive with dependency SBOM
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Filename is not in the immutable manifest
        '429':
          description: Public transfer capacity reached
        '503':
          description: Release unavailable or integrity validation failed
  /api/public/v1/clients/local-trust:
    get:
      operationId: publicLocalClientTrust
      security: []
      description: Public CA bootstrap for local quickstart installations. Clients
        accept this only over loopback and verify the selected HTTPS gateway before
        persisting trust.
      responses:
        '200':
          description: Public local gateway origin and CA certificate; no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - serverUrl
                - caCertificatePem
                properties:
                  serverUrl:
                    type: string
                    format: uri
                    maxLength: 2048
                  caCertificatePem:
                    type: string
                    maxLength: 16384
        '404':
          description: Local quickstart bootstrap is disabled
  /api/public/v1/clients/configuration:
    get:
      operationId: publicClientConfiguration
      security: []
      description: Server-owned HTTPS Control origin for automatic setup and gateway
        changes. Contains no credentials.
      responses:
        '200':
          description: Public gateway configuration; no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - serverUrl
                properties:
                  serverUrl:
                    type: string
                    format: uri
                    maxLength: 2048
        '503':
          description: Endpoint gateway is not configured
  /api/public/v1/clients/setup/{target}:
    get:
      operationId: publicConfiguredWindowsInstaller
      security: []
      description: One Windows EXE containing the client, native bridge, Chrome extension
        files and tray icon. The public gateway origin is encoded in the suggested
        filename; installer bytes and checksums match the release.
      parameters:
      - name: target
        in: path
        required: true
        schema:
          type: string
          enum:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
      responses:
        '200':
          description: Configured installer download; no-store
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Gateway origin exceeds filename limits
        '404':
          description: Windows target is unavailable
        '503':
          description: Endpoint configuration or installer is unavailable
  /.well-known/olo-toolgate-client:
    get:
      operationId: clientDiscovery
      description: Direct HTTPS. Detached RS256 signature over domain-prefixed exact
        payload bytes. TLS origin bootstraps dedicated device CA.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/SignedClientDiscovery
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict
        '423':
          description: Registered-key certificate recovery is blocked by disablement,
            deapproval or an expired connection deadline
        '503':
          description: Dependency unavailable
      security: []
  /api/control/v1/endpoint/ping:
    post:
      operationId: pingEndpoint
      description: Device presence continues before enrollment, during suspension and
        after deletion or revocation. A signed CSR proves the announced key. Control
        returns its current state and the next action; presence grants no access.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointPresencePing
      responses:
        '200':
          description: Authoritative device state and next action; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointConnectionDirective
        '403':
          description: Device ID does not match the proved key
        '503':
          description: Dependency unavailable
  /api/control/v1/endpoint/enrollments:
    get:
      operationId: listEndpointEnrollments
      description: Dedicated toolgate-enroller with an enabled same-tenant user lists
        all unexpired pending devices. No device codes, CSRs or certificates are returned.
      responses:
        '200':
          description: Success; no-store; at most 32 requests
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentPage
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user
        '503':
          description: Dependency unavailable
    post:
      operationId: startEndpointEnrollment
      description: Anonymous direct HTTPS, verified P-256 CSR, bounded pending quota.
        This challenge creation is not a grant and may be repeated after a lost response.
        An exact already approved device/key can recover its public certificate without
        changing owner, enablement or connection deadline.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentChallenge
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentStart
      security: []
  /api/control/v1/endpoint/enrollments/request-approval:
    post:
      operationId: requestEndpointEnrollmentApproval
      description: Explicit signed-key request to reopen a revoked device for a fresh
        administrator review. Old enrollment codes are invalidated. This request
        never approves access and bypasses initial-enrollment automatic approval.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentStart
      responses:
        '200':
          description: Fresh pending enrollment challenge; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentChallenge
        '403':
          description: Device ID does not match the proved key
        '409':
          description: Device is not revoked or awaiting reenrollment
        '503':
          description: Dependency unavailable
  /api/control/v1/endpoint/enrollments/poll:
    post:
      operationId: pollEndpointEnrollment
      description: Device code proves possession; minimum five-second poll interval,
        ten-minute expiry. Exact certificate response may be recovered until expiry.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentResult
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentPoll
      security: []
  /api/control/v1/endpoint/enrollments/review:
    get:
      operationId: reviewEndpointEnrollment
      description: Dedicated toolgate-enroller and signed user_id mapping to enabled
        same-tenant user. Compare code and key fingerprint on the device.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentReview
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict
        '503':
          description: Dependency unavailable
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-F0-9]{16}$
  /api/control/v1/endpoint/enrollments/decision:
    post:
      operationId: decideEndpointEnrollment
      description: Dedicated toolgate-enroller confirms device for their signed enabled
        user. Approval, identity registration, directory metadata, audit and idempotency
        commit atomically. Approvals enforce connectionExpiresAtUnixMs for certificates,
        renewal and all device access; omission defaults to 24 hours. Explicit unlimitedConnection=true
        gives approval without an access deadline while certificates still renew.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentReview
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict; ONE_DEVICE_PER_ACCOUNT when an
            ownDevices approver already owns a device in the rule's group
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/control.schema.json#/$defs/ControlErrorDetail
        '429':
          description: Too many failed lookups or approvals (RATE_LIMITED)
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentDecision
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
  /api/control/v1/endpoint/enrollments/lookup:
    post:
      operationId: lookupEndpointEnrollment
      description: Returns the pending enrollment a client's code names, for comparison
        before approval, when the signed-in user may approve it through a group rule or
        an ownDevices rule. An unknown, expired, decided or unapprovable code is 404 without
        detail. Five failed lookups or approvals per user in ten minutes return 429.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentLookupResult
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '404':
          description: No enrollment this user may approve
        '429':
          description: Too many failed lookups or approvals (RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/control.schema.json#/$defs/ControlErrorDetail
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnrollmentLookup
  /api/control/v1/endpoint/console-device/challenge:
    post:
      operationId: challengeConsoleDevice
      description: Issues a single-use two-minute challenge bound to the verified console session and owned device key. Does not approve device access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/ConsoleDeviceLookup
      responses:
        '200':
          description: Bounded challenge; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/ConsoleDeviceChallenge
        '400':
          description: Exactly one code or device identifier is required
        '403':
          description: Device context is not allowed for this session
        '404':
          description: No eligible device or enrollment
        '429':
          description: Too many failed attempts
  /api/control/v1/endpoint/console-device/verify:
    post:
      operationId: verifyConsoleDevice
      description: Verifies a device-key signature and records current-device context for this console token session. Never issues a certificate or approves access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/ConsoleDeviceProof
      responses:
        '200':
          description: Current-device context; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/ConsoleDeviceVerified
        '403':
          description: Invalid device proof or revoked authority
        '409':
          description: Expired, replayed or mismatched challenge
        '429':
          description: Too many failed attempts
  /api/control/v1/endpoint/socket:
    get:
      operationId: endpointJobSocket
      description: RFC 6455 upgrade with a verified active mTLS device. ClientSocketRequest
        and ClientSocketReply frames use existing check-in, authorization, result
        and builder contracts. Ping/pong verifies liveness; the channel closes after
        job inactivity. Browser origins and bearer substitutes are rejected.
      security:
      - deviceCertificate: []
      responses:
        '101':
          description: Bidirectional authenticated active-job channel
        '401':
          description: Direct TLS and a device certificate are required
        '403':
          description: Device is inactive or permanently revoked
        '423':
          description: Device is disabled, deapproved or its connection deadline expired;
            access can be restored
        '503':
          description: Channel capacity or dependencies unavailable
  /api/control/v1/endpoint/check-in:
    post:
      operationId: endpointCheckIn
      description: Actual verified TLS peer certificate plus active registry. No bearer/header
        substitute. Sequence and exact report replay are transactional; certificates
        renew before expiry.
      parameters:
      - in: header
        name: X-ToolGate-System-Name
        required: false
        description: Informational OS hostname from the authenticated protected client;
          never identity or authorization. The peer IP is observed from the transport
          and ignores forwarded-IP headers.
        schema:
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[a-zA-Z0-9._-]+$
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointCheckInAck
        '400': &id013
          description: Invalid bounded input
        '401': &id014
          description: Direct TLS/identity required
        '403': &id015
          description: Wrong tenant/user, inactive or revoked device
        '410':
          description: Device deleted; request a fresh enrollment and approval
        '423':
          description: Device is disabled, deapproved or its connection deadline expired;
            retryable suspension
        '409': &id016
          description: State, replay or polling conflict
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointCheckIn
      security: []
  /api/control/v1/endpoint/devices:
    get:
      operationId: listEndpointDevices
      description: Administrator lists all directory devices and unexpired pending
        requests in their tenant, including internal Quickstart executors. Quickstart
        supports an explicit deployment=true view using EndpointManagedDeviceDeploymentPage,
        which adds optional public deployment records without changing the default response.
      parameters:
      - name: deployment
        in: query
        required: false
        description: Opt in to public Docker display metadata on Quickstart. Standalone Control returns its normal device page.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                anyOf:
                - $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointManagedDevicePage
                - $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointManagedDeviceDeploymentPage
        '401':
          description: Direct TLS/identity required
        '403':
          description: Administrator role and same tenant required
        '503':
          description: Dependency unavailable
  /api/control/v1/endpoint/devices/{id}/approval:
    post:
      operationId: setEndpointApproval
      description: Administrator approves or deapproves an enrolled key without revoking
        it or changing its owner or directory enabled state. Explicit unlimitedConnection
        allows unlimited approval; certificate validity remains at most 24 hours.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointApprovalRequest
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointDeviceRecord
        '400':
          description: Invalid approval deadline
        '401':
          description: Direct TLS/identity required
        '403':
          description: Administrator role and enabled user required
        '409':
          description: Approval revision changed or key permanently revoked
        '503':
          description: Dependency unavailable
  /api/control/v1/endpoint/devices/{id}/request-approval:
    post:
      operationId: requestEndpointDeviceApproval
      description: Administrator reopens a revoked device for a fresh enrollment request.
        Approval and access remain blocked until the live client submits its CSR
        and an administrator approves it. Does not change directory enablement.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointRevokeRequest
      responses:
        '200':
          description: Awaiting fresh client enrollment; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointDeviceRecord
        '403':
          description: Administrator role and enabled user required
        '409':
          description: Device revision changed or device is not revoked
        '503':
          description: Dependency unavailable
  /api/control/v1/endpoint/devices/{id}/enabled:
    post:
      operationId: setEndpointEnabled
      description: Administrator enables or disables device directory activation independently
        of approval. A pending request may receive disabled directory metadata without
        granting credentials.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointEnabledRequest
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/control.schema.json#/$defs/ControlDevice
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Administrator role and enabled user required
        '409':
          description: Directory revision changed or no pending identity
        '503':
          description: Dependency unavailable
  /api/control/v1/endpoint/devices/{id}:
    get:
      operationId: getEndpointDevice
      description: Administrative enrolled identity view. Directory metadata alone
        never authenticates a device.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointDeviceRecord
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict
        '503':
          description: Dependency unavailable
      parameters:
      - &id001
        name: id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
  /api/control/v1/endpoint/devices/{id}/revoke:
    post:
      operationId: revokeEndpointDevice
      description: Administrator revocation; expected revision, durable idempotency
        and audit. Next check-in rejects even before certificate expires.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointDeviceRecord
        '400':
          description: Invalid bounded input
        '401':
          description: Direct TLS/identity required
        '403':
          description: Wrong tenant/user, inactive or revoked device
        '409':
          description: State, replay or polling conflict
        '503':
          description: Dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/endpoint.schema.json#/$defs/EndpointRevokeRequest
      parameters:
      - *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
  /api/control/v1/approvals:
    get:
      operationId: listApprovals
      description: Verified human identity; current group-scoped reviewer privilege,
        separation of duties and exact operation obligations are evaluated by Control.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/enterprise.schema.json#/$defs/EnterpriseApprovalPage
        '400':
          description: Invalid canonical input
        '401':
          description: Valid signed short-lived JWT required
        '403':
          description: Role, tenant or approver identity denied
        '404':
          description: Approval not found
        '409':
          description: Stale revision, obsolete policy or spent permit
        '413':
          description: Request too large
        '503':
          description: Approval dependency unavailable
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
  /api/control/v1/approvals/{id}:
    get:
      operationId: getApproval
      description: Verified human identity; current group-scoped reviewer privilege,
        separation of duties and exact operation obligations are evaluated by Control.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/enterprise.schema.json#/$defs/EnterpriseApproval
        '400':
          description: Invalid canonical input
        '401':
          description: Valid signed short-lived JWT required
        '403':
          description: Role, tenant or approver identity denied
        '404':
          description: Approval not found
        '409':
          description: Stale revision, obsolete policy or spent permit
        '413':
          description: Request too large
        '503':
          description: Approval dependency unavailable
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /api/control/v1/approvals/{id}/decision:
    post:
      operationId: decideApproval
      description: Verified human identity; current group-scoped reviewer privilege,
        separation of duties and exact operation obligations are evaluated by Control.
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/v1/enterprise.schema.json#/$defs/EnterpriseApproval
        '400':
          description: Invalid canonical input
        '401':
          description: Valid signed short-lived JWT required
        '403':
          description: Role, tenant or approver identity denied
        '404':
          description: Approval not found
        '409':
          description: Stale revision, obsolete policy or spent permit
        '413':
          description: Request too large
        '503':
          description: Approval dependency unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v1/enterprise.schema.json#/$defs/EnterpriseApprovalDecisionRequest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
  /api/control/v1/bundles/current:
    get:
      operationId: getCurrentPolicyBundle
      description: Tenant-scoped immutable signed current bundle. Requires admin,
