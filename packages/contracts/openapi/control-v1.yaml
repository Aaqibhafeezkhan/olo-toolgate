          application/yaml:
            schema:
              $ref: ../schemas/v1/control.schema.json#/$defs/ControlImportRequest
  /api/control/v1/settings:
    get:
      operationId: getServerSettings
      description: Feature permissions control visibility and changes. A write that changes configuration.requiredReviews
        while it is above 0 returns 202 with a SETTINGS configuration change that needs the
        current number of reviews, with no Super Admin bypass. Returns the tenant's control-plane settings
        (formatVersion 2), grouped by Configuration page. clientCheckIn is read-only and
        always shows the running deployment's values. The document is also the export
        format.
      parameters:
      - in: query
        name: section
        required: false
        schema:
          type: string
          enum: [server, device]
        description: Read one feature. Unreadable groups are omitted from the response.
      responses:
        '200':
          description: Success; no-store
          headers:
            ETag:
              description: Quoted settings revision
              schema:
                type: string
            X-Request-ID:
              description: Server correlation ID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: ../schemas/v2/settings.schema.json#/$defs/ControlSettingsView
        '400': *id002
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id006
        '413': *id007
        '415': *id008
        '500': *id009
        '503': *id010
    put:
      operationId: updateServerSettings
      description: Feature permissions control visibility and changes. A write that changes configuration.requiredReviews
        while it is above 0 returns 202 with a SETTINGS configuration change that needs the
        current number of reviews, with no Super Admin bypass. Replaces the editable settings with a full
        formatVersion 2 record; used to restore an exported settings document. The
        revision and clientCheckIn in the body are ignored; If-Match carries the current
        revision.
      parameters:
      - *id011
      - *id012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/v2/settings.schema.json#/$defs/ControlServerSettings
      responses:
        '200':
