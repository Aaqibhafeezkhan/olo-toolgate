openapi: 3.1.0
info:
  title: OLO ToolGate Gateway Core
  version: 1.0.0-dev.1
  description: Online enterprise group authority with explicit HUMAN, DELEGATED and
    SERVICE modes. This gateway accepts workload credentials; HUMAN sessions use verified
    Control authentication. Every effect consumes a Control permit using the target
    device certificate.
servers:
- url: https://gateway.example.invalid
security:
- runtimeBearer: []
paths:
  /access/invocations:
    post:
      operationId: submitAndReserveInvocation
      description: Submit exact arguments to the current Control group authority.
        Pending approval carries no capability. Every effect requires a reserved Control
        permit consumed by the target device over mTLS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: https://schemas.ololabs.io/toolgate/v1/runtime.schema.json#/$defs/AuthorizationRequest
      responses:
        '200':
          description: Explicit result; no-store
          content:
            application/json:
              schema:
                $ref: https://schemas.ololabs.io/toolgate/v1/enterprise.schema.json#/$defs/EnterpriseAuthorizationOutcome
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-zA-Z0-9._-]+$
  /mcp:
    post:
      operationId: mcpIngress
      description: Stateless 2026-07-28 ingress. Discovery uses current group grants
        and installed profiles. Calls preserve original arguments. ASK returns a durable
        pending invocation; approved calls enter the same device-bound permit pipeline.
        Mirrored metadata headers required. Only 2026-07-28 is served; a request with
        no _meta protocol version that calls initialize or names another version in
        MCP-Protocol-Version gets -32022 listing the supported version. GET and DELETE
        return 405.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      parameters:
      - in: header
        name: MCP-Protocol-Version
        required: true
        description: Must equal the _meta protocol version.
        schema:
          type: string
          const: '2026-07-28'
      - in: header
        name: Mcp-Method
        required: true
        schema:
          type: string
      - in: header
        name: Mcp-Name
        schema:
          type: string
      - in: header
        name: Accept
        required: true
        schema:
          type: string
      responses:
        '200':
          description: JSON-RPC result or explicit authorization/unsupported error
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid frame, parameters, unsupported version or header mismatch
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          description: Unsupported RPC method
        '406':
          description: JSON and SSE acceptance required
        '413':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
        '504':
          $ref: '#/components/responses/Error'
  /v1/health/live:
    get:
      operationId: liveness
      servers:
      - url: http://127.0.0.1:9091
      security: []
      responses:
        '200':
          description: Process is serving management traffic
  /v1/health/ready:
    get:
      operationId: readiness
      servers:
      - url: http://127.0.0.1:9091
      security: []
      responses:
        '200':
          description: Current authority observed within five seconds; at least one
            unexpired workload credential; not draining
          credentials and audit usable; not draining: null
        '503':
          description: Unsafe for new traffic
  /v1/metrics:
    get:
      operationId: metrics
      servers:
      - url: http://127.0.0.1:9091
      security: []
      responses:
        '200':
          description: Fixed-cardinality Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    runtimeBearer:
      type: http
      scheme: bearer
      description: Administrator-provisioned high-entropy runtime token with exact
        identity and expiry binding
  responses:
    Error:
      description: Stable sanitized error code and server-generated request ID
      content:
        application/json:
          schema:
            $ref: https://schemas.ololabs.io/toolgate/v1/error.schema.json#/$defs/ErrorEnvelope
