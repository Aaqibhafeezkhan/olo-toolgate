# Required 2026-07-28 server scenarios the Java protocol layer does not pass yet, for
# @modelcontextprotocol/conformance@0.2.0-alpha.12 --requirements 2026-07-28.
# The baseline counts warnings too. A scenario leaves this list in the PR that makes it pass; the run fails on a stale entry.
server:
  # Prompts, resources and completions: ToolGate serves tools only, so these do not apply
  # (protocol-layer.md A1 acceptance counts the scenarios that apply to tools).
  - completion-complete
  - resources-list
  - resources-read-text
  - resources-read-binary
  - resources-templates-read
  - prompts-list
  - prompts-get-simple
  - prompts-get-with-args
  - prompts-get-embedded-resource
  - prompts-get-with-image
  - input-required-result-non-tool-request
  - sep-2164-resource-not-found
  - caching:sep-2549-prompts-list-caching-hints
  - caching:sep-2549-resources-list-caching-hints
  - caching:sep-2549-resources-templates-list-caching-hints
