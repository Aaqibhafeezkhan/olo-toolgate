[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "toolgate-sdk"
version = "0.10.0.dev0"
description = "ToolGate Tool SDK for Python: authoring API, descriptor generation, MCP runtime, harness and build commands"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# The runtime is standard library only. tomli reads pyproject.toml at build time on Python 3.10.
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toolgate = ["py.typed"]
