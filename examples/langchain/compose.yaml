name: ${TOOLGATE_LANGCHAIN_PROJECT:-toolgate-langchain}
services:
  registry:
    # Explicit loopback-only development registry, supported by Control's OCI adapter.
    image: registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:${TOOLGATE_REGISTRY_PORT:-18552}
    ports:
      - "127.0.0.1:${TOOLGATE_REGISTRY_PORT:-18552}:${TOOLGATE_REGISTRY_PORT:-18552}"
      - "127.0.0.1:${TOOLGATE_HTTP_PORT:-18091}:8080"
      - "127.0.0.1:${TOOLGATE_TLS_PORT:-18451}:8443"
    volumes:
      - registry-data:/var/lib/registry
  quickstart:
    image: ${TOOLGATE_QUICKSTART_IMAGE:-ololab/olo-toolgate-quickstart:dev}
    platform: linux/amd64
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
    stop_grace_period: 35s
    # Control and the system Docker engine use the same loopback registry coordinates.
    network_mode: service:registry
    depends_on:
      registry:
        condition: service_started
    env_file:
      - path: ${TOOLGATE_LANGCHAIN_STATE:-.state}/client-images.env
        required: false
    environment:
      TOOLGATE_DISABLE_ADMIN_PASSWORD: 'false'
      TOOLGATE_QUICKSTART_DATABASE_MODE: sqlite
      TOOLGATE_GATEWAY_NAME: ${TOOLGATE_GATEWAY_NAME:-LangChain Gateway}
      TOOLGATE_QUICKSTART_CLIENT_CREDENTIALS: 'true'
      TOOLGATE_CONTROL_ENDPOINT_CONTROL_URL: https://localhost:${TOOLGATE_TLS_PORT:-18451}
      TOOLGATE_CONTROL_ENDPOINT_GATEWAY_URL: https://localhost:${TOOLGATE_TLS_PORT:-18451}
      # Setup downloads name this console so Windows clients can trust the local CA.
      TOOLGATE_CONTROL_ENDPOINT_CONSOLE_URL: http://127.0.0.1:${TOOLGATE_HTTP_PORT:-18091}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=65532,gid=65532
    volumes:
      - quickstart-data:/data
  linux-device:
    image: ${TOOLGATE_DEVICE_IMAGE:-ololab/olo-toolgate-device:dev}
    entrypoint: [python, -u, /opt/toolgate/langchain-device.py]
    platform: linux/amd64
    hostname: langchain-linux-device
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 30s
    depends_on:
      quickstart:
        condition: service_healthy
    environment:
      TOOLGATE_DEVICE_UPSTREAM: registry
      TOOLGATE_DEVICE_HTTP_PORT: ${TOOLGATE_HTTP_PORT:-18091}
      TOOLGATE_DEVICE_TLS_PORT: ${TOOLGATE_TLS_PORT:-18451}
    tmpfs:
      - /run:rw,nosuid,size=8m,mode=755
    volumes:
      - device-config:/etc/olo-toolgate
      - device-state:/var/lib/olo-toolgate
      # Explicit local evaluation executor; tool containers receive no socket or mounts.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [CMD, python, -c, "import json; d=json.load(open('/run/olo-toolgate/device-status.json')); assert d.get('deviceId')"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 24
  agent:
    profiles: [ai]
    build:
      context: ../..
      dockerfile: examples/langchain/agent.Dockerfile
    # Reuse the device's byte-preserving loopback TLS relay. No device state is mounted.
    network_mode: service:linux-device
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    depends_on:
      linux-device:
        condition: service_healthy
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      TOOLGATE_CREDENTIAL_DIRECTORY: /run/toolgate-agents
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - ${TOOLGATE_LANGCHAIN_STATE:-.state}/agents:/run/toolgate-agents:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
volumes:
  registry-data:
  quickstart-data:
  device-config:
  device-state:
