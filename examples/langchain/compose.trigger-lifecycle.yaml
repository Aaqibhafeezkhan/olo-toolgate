# Disposable additional executors for M12 lifecycle acceptance.
services:
  lifecycle-device-b:
    extends:
      file: compose.yaml
      service: linux-device
    hostname: langchain-lifecycle-b
    volumes:
      - lifecycle-config-b:/etc/olo-toolgate
      - lifecycle-state-b:/var/lib/olo-toolgate
  lifecycle-device-c:
    extends:
      file: compose.yaml
      service: linux-device
    hostname: langchain-lifecycle-c
    volumes:
      - lifecycle-config-c:/etc/olo-toolgate
      - lifecycle-state-c:/var/lib/olo-toolgate
  lifecycle-device-d:
    extends:
      file: compose.yaml
      service: linux-device
    hostname: langchain-lifecycle-d
    volumes:
      - lifecycle-config-d:/etc/olo-toolgate
      - lifecycle-state-d:/var/lib/olo-toolgate
volumes:
  lifecycle-config-b:
  lifecycle-state-b:
  lifecycle-config-c:
  lifecycle-state-c:
  lifecycle-config-d:
  lifecycle-state-d:
