# FILENAME: <next-available-sequence-number>-<Your-First-Name>-<Your-Last-Name>.yaml
# Example: 3-Your-Name.yaml if 1 and 2 are the highest existing sequence numbers.
# Check the target collection first; choose the highest number + 1, with no leading zeros.
# Replace spaces in your name with hyphens; use the .yaml extension.
# COPY this sample into .changes/<active-version>/<your-filename>.yaml.
# Read .changes/config.json for the active version; currently it is v1.0.
# This sample in .changes/ is documentation only and is never compiled into release notes.
# Replace every example name, handle, number, URL and description before submitting.
# Keep schemaVersion, contributor.name, changes, and each change's type and summary.
# All other fields are optional: delete the entire unused field or section, including its children.
# Do not leave an empty optional list/object or a blank value; do not invent PRs or tickets.
# Repeat a person item for each collaborator/owner/reviewer, and a change item for each feature/fix.
# One shared feature should normally have one change item listing all involved people and PRs.
# Use real, agreed roles; roles describe attribution and do not grant repository permissions.
# Allowed roles: core-contributor, core-maintainer, maintainer, contributor, author,
# reviewer, tester, documentation, release-manager, product-owner. Multiple roles are allowed.
# After copying, run: python tools/release/notes.py --check
# Preview with: python tools/release/notes.py --output build/release-notes

# REQUIRED: keep 1; this selects the current fragment format, not the product version.
schemaVersion: 1
# REQUIRED: identify the person submitting this fragment; shared work is credited below.
contributor:
  # REQUIRED: replace with your full display name (up to 120 characters).
  name: "Your Full Name"
  # OPTIONAL: your GitHub login without @; remove this field if you do not use GitHub.
  github: your-login
  # OPTIONAL: your established project roles; choose only applicable values from the list above.
  roles: [contributor]

# REQUIRED: provide at least one feature/fix; repeat the entire "- type" block for additional changes.
changes:
  # REQUIRED: choose breaking, added, changed, fixed, security, docs, or internal.
  # Use breaking for incompatible changes; added for new capabilities; fixed for bug fixes;
  # changed for existing behavior; security for publishable security fixes; docs/internal for that work.
  - type: fixed
    # OPTIONAL: the affected product area, such as Gateway, Control, Tool Host, Java SDK, or Release tooling.
    component: "Tool Host"
    # REQUIRED: concise user-facing explanation of what changed; replace the example, maximum 2000 characters.
    summary: "Resume interrupted tasks without repeating completed effects."
    # OPTIONAL: explain who benefits and what practical difference this change makes.
    impact: "Operators can recover work after a worker restart."
    # OPTIONAL: specify required upgrade/configuration steps, especially for breaking changes; omit if none.
    migration: "Restart workers after updating and review the task recovery configuration."
    # OPTIONAL: select one or more affected audiences: users, operators, developers, administrators.
    audience: [operators, developers]

    # OPTIONAL: short form for a single PR; replace 123 with a real positive PR number, without #.
    # Prefer pullRequests below when there are several PRs or ownership/review details; remove this if unused.
    # If the same number appears in both forms, the generated PR-number summary displays it once.
    pr: 123
    # OPTIONAL: related PRs; use bare positive numbers or detailed objects as demonstrated below.
    # Remove the entire section when no PR exists; feature ownership and individual PR ownership are separate.
    pullRequests:
      # REQUIRED FOR THIS OBJECT: real positive PR number; repeat this object for another detailed PR.
      - number: 123
        # OPTIONAL: the actual PR title, or a concise approved description.
        title: "Recover interrupted tasks after a worker restart"
        # OPTIONAL: the real HTTPS URL of this PR; replace the example repository/number if needed.
        url: https://github.com/olo-labs/olo-toolgate/pull/123
        # OPTIONAL: all people accountable for THIS PR; add/remove person items for shared ownership.
        owners:
          # REQUIRED FOR THIS PERSON: the first PR owner's full name.
          - name: "Your Full Name"
            # OPTIONAL: this PR owner's GitHub login, without @.
            github: your-login
            # OPTIONAL: this person's applicable project/work roles; use author if they authored this PR.
            roles: [contributor, author]
          # REQUIRED FOR THIS PERSON: another owner of the SAME PR; delete this item if there is only one owner.
          - name: "Collaborator Full Name"
            # OPTIONAL: the second PR owner's GitHub login, without @.
            github: collaborator-login
            # OPTIONAL: the second owner's actual roles; do not claim maintainer status unless established.
            roles: [contributor, author]
        # OPTIONAL: other people who implemented, tested or documented THIS PR; omit if none.
        contributors:
          # REQUIRED FOR THIS PERSON: the collaborator's full name; repeat person items as needed.
          - name: "Collaborator Full Name"
            # OPTIONAL: this collaborator's GitHub login, without @.
            github: collaborator-login
            # OPTIONAL: describe this person's contribution to this PR.
            roles: [contributor, tester]
        # OPTIONAL: people who actually reviewed THIS PR; add multiple reviewers as needed.
        reviewers:
          # REQUIRED FOR THIS PERSON: the reviewer's full name; do not list a person who has not reviewed it.
          - name: "Reviewer Full Name"
            # OPTIONAL: the reviewer's GitHub login, without @.
            github: reviewer-login
            # OPTIONAL: reviewer plus any established project role, such as maintainer or core-maintainer.
            roles: [reviewer]
      # OPTIONAL: a second real PR with no detailed attribution; remove this item if there is no second PR.
      - 124

    # OPTIONAL: people accountable for the ENTIRE feature/change, potentially spanning several PRs.
    # List everyone who shares ownership, even if the individual PR owner lists differ.
    owners:
      # REQUIRED FOR THIS PERSON: the first feature owner's full name.
      - name: "Your Full Name"
        # OPTIONAL: the feature owner's GitHub login, without @.
        github: your-login
        # OPTIONAL: this owner's actual roles in the project or this work.
        roles: [contributor, author]
      # REQUIRED FOR THIS PERSON: another owner of the SAME feature; remove this item if not applicable.
      - name: "Collaborator Full Name"
        # OPTIONAL: the additional feature owner's GitHub login, without @.
        github: collaborator-login
        # OPTIONAL: this owner's applicable roles; use more than one role when appropriate.
        roles: [contributor, author]
    # OPTIONAL: additional people to credit for the whole feature; the primary contributor is already credited.
    contributors:
      # REQUIRED FOR THIS PERSON: the collaborator's full name; add more person items for shared work.
      - name: "Collaborator Full Name"
        # OPTIONAL: the collaborator's GitHub login, without @.
        github: collaborator-login
        # OPTIONAL: credit the work performed, such as author, reviewer, tester or documentation.
        roles: [contributor, tester]

    # OPTIONAL: related Jira tickets, GitHub issues or other tracker items; remove this section if none.
    # Use one item per ticket; keep only references and summaries suitable for the release audience.
    tickets:
      # REQUIRED FOR THIS TICKET: choose jira, github or other; this example uses Jira.
      - system: jira
        # REQUIRED FOR THIS TICKET: the actual tracker ID; quote GitHub IDs such as "#123".
        id: "TG-123"
        # REQUIRED FOR THIS TICKET: the real HTTPS ticket URL; replace this illustrative hostname and ID.
        url: https://jira.example.com/browse/TG-123
        # OPTIONAL: the ticket owner's approved user-facing summary, not a dump of internal discussion.
        summary: "Recover in-progress tasks after an interrupted deployment."
        # OPTIONAL: the accountable ticket owner; collaborators belong in the contributors list below.
        owner:
          # REQUIRED WHEN OWNER IS PRESENT: the ticket owner's full name.
          name: "Ticket Owner Full Name"
          # OPTIONAL: the ticket owner's GitHub login, without @; remove if unavailable.
          github: ticket-owner-login
          # OPTIONAL: the ticket owner's actual roles; product-owner is only an example.
          roles: [product-owner]
        # OPTIONAL: identify who supplied/approved the summary; repeat the owner here if it was the owner.
        summaryAuthor:
          # REQUIRED WHEN SUMMARY AUTHOR IS PRESENT: the summary writer/approver's full name.
          name: "Ticket Owner Full Name"
          # OPTIONAL: the summary author's GitHub login, without @; remove if unavailable.
          github: ticket-owner-login
          # OPTIONAL: the summary author's actual project/work roles.
          roles: [product-owner]
        # OPTIONAL: everyone else who handled THIS ticket; repeat person items for multiple collaborators.
        contributors:
          # REQUIRED FOR THIS PERSON: the first ticket collaborator's full name.
          - name: "Your Full Name"
            # OPTIONAL: the first ticket collaborator's GitHub login, without @.
            github: your-login
            # OPTIONAL: roles reflecting this person's work on this ticket.
            roles: [contributor, author]
          # REQUIRED FOR THIS PERSON: another ticket collaborator's full name; delete this item if unused.
          - name: "Collaborator Full Name"
            # OPTIONAL: the additional ticket collaborator's GitHub login, without @.
            github: collaborator-login
            # OPTIONAL: roles reflecting the additional collaborator's actual contribution.
            roles: [contributor, tester]
